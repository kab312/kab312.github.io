<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="1" stop-color="#eef1ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475fdd"/>
      <stop offset="1" stop-color="#7657d8"/>
    </linearGradient>
  </defs>
  <rect width="1672" height="941" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="150" fill="#dff4ff"/>
  <circle cx="1600" cy="90" r="145" fill="#8c6de8" opacity=".85"/>
  <circle cx="1550" cy="860" r="160" fill="#d7f1ff"/>
  <text x="836" y="90" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="800" fill="#0f2054">Итоговая работа · Ночь музеев</text>
  <text x="836" y="140" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#53658d">Новый сюжет — те же навыки HTML</text>

  <rect x="90" y="190" width="610" height="560" rx="34" fill="#fff" stroke="#d9e4f5" stroke-width="3"/>
  <text x="140" y="250" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#14275e">Структура проекта</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#26375f">
    <text x="145" y="315">museum-night-starter/</text>
    <text x="190" y="365">├── index.html</text>
    <text x="190" y="415">├── pages/</text>
    <text x="250" y="460">├── exhibits.html</text>
    <text x="250" y="505">└── visit.html</text>
    <text x="190" y="555">└── assets/</text>
    <text x="250" y="600">├── images/</text>
    <text x="250" y="645">└── media/</text>
  </g>
  <rect x="130" y="680" width="530" height="40" rx="20" fill="#eef3ff"/>
  <text x="395" y="708" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#4354b8">Сначала изучите файлы, потом собирайте страницу</text>

  <rect x="745" y="190" width="835" height="560" rx="34" fill="#fff" stroke="#d9e4f5" stroke-width="3"/>
  <rect x="780" y="225" width="760" height="120" rx="24" fill="url(#hero)"/>
  <text x="830" y="275" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="800" fill="#fff">Что нужно показать</text>
  <text x="830" y="317" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#eef2ff">Не копировать КиберGO, а перенести знания в новый сайт.</text>

  <g font-family="DejaVu Sans, sans-serif">
    <g transform="translate(800 385)">
      <circle cx="30" cy="30" r="30" fill="#e8efff"/><text x="30" y="41" text-anchor="middle" font-size="28" font-weight="800" fill="#4261d5">1</text>
      <text x="82" y="28" font-size="27" font-weight="700" fill="#192c61">Связать три HTML-страницы</text><text x="82" y="58" font-size="20" fill="#5a6a89">Относительные пути и возврат на главную.</text>
    </g>
    <g transform="translate(800 475)">
      <circle cx="30" cy="30" r="30" fill="#f1e9ff"/><text x="30" y="41" text-anchor="middle" font-size="28" font-weight="800" fill="#7454d4">2</text>
      <text x="82" y="28" font-size="27" font-weight="700" fill="#192c61">Подключить изображения и подписи</text><text x="82" y="58" font-size="20" fill="#5a6a89">alt, figure и figcaption в новом контексте.</text>
    </g>
    <g transform="translate(800 565)">
      <circle cx="30" cy="30" r="30" fill="#e3f8ef"/><text x="30" y="41" text-anchor="middle" font-size="28" font-weight="800" fill="#2e9c72">3</text>
      <text x="82" y="28" font-size="27" font-weight="700" fill="#192c61">Добавить аудио, видео и poster</text><text x="82" y="58" font-size="20" fill="#5a6a89">Медиа должны реально воспроизводиться в браузере.</text>
    </g>
    <g transform="translate(800 655)">
      <circle cx="30" cy="30" r="30" fill="#fff0d8"/><text x="30" y="41" text-anchor="middle" font-size="28" font-weight="800" fill="#d68a25">4</text>
      <text x="82" y="28" font-size="27" font-weight="700" fill="#192c61">Собрать программу в таблицу</text><text x="82" y="58" font-size="20" fill="#5a6a89">caption, th, thead, tbody и сохранённые данные.</text>
    </g>
  </g>

  <rect x="250" y="800" width="1172" height="92" rx="28" fill="#eaf4ff" stroke="#cfe3f7" stroke-width="2"/>
  <circle cx="315" cy="846" r="30" fill="#fff"/><text x="315" y="857" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="30">★</text>
  <text x="370" y="840" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="800" fill="#173066">Этой работой можно повысить оценку до 5.</text>
  <text x="370" y="873" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#526889">Соберите сайт самостоятельно и покажите результат преподавателю.</text>
</svg>
