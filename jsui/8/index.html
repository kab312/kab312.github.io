<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Изучение особенностей синхронного и асинхронного программирования</title>
<style>
      :root {
        --bg: #f2f5f9;
        --paper: #fff;
        --ink: #203047;
        --muted: #5e6e84;
        --line: #dce3ed;
        --blue: #245fd0;
        --green: #137451;
        --red: #ab303f;
        --code: #152131;
        --shadow: 0 5px 22px #1c355010;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        font:
          15px/1.48 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      body {
        height: 100dvh;
        overflow: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.46;
      }
      button:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 3px solid #83a9f3;
        outline-offset: 2px;
      }
      code,
      kbd,
      pre {
        font-family: "Cascadia Code", Consolas, monospace;
      }
      code {
        font-size: 0.92em;
      }
      p {
        margin: 0 0 10px;
      }
      p:last-child {
        margin-bottom: 0;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      #shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .top {
        height: 62px;
        flex: none;
        padding: 10px 22px;
        background: white;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand {
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }
      .logo {
        background: #183357;
        color: #fff;
        border-radius: 9px;
        padding: 5px 9px;
      }
      .topmeta {
        margin-left: auto;
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .meter {
        width: 115px;
        height: 5px;
        background: #e4ebf5;
        border-radius: 9px;
        overflow: hidden;
      }
      .meter > span {
        display: block;
        height: 100%;
        background: var(--blue);
        transition: width 0.2s;
      }
      .btn {
        padding: 9px 12px;
        line-height: 1.15;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: #264260;
        font-weight: 650;
      }
      .btn:hover:not(:disabled) {
        background: #f1f6ff;
      }
      .btn.small {
        font-size: 12px;
        padding: 7px 10px;
      }
      .btn.main {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .btn.success {
        background: #e8f6ee;
        border-color: #b5dec8;
        color: #146242;
      }
      .btn.danger {
        color: #9d3a3a;
        font-size: 12px;
      }
      .inner {
        width: 100%;
        max-width: 1640px;
        margin: 0 auto;
        padding: 14px 22px 12px;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .eyebrow {
        font-size: 11px;
        color: #3d65a6;
        text-transform: uppercase;
        letter-spacing: 0.055em;
        font-weight: 750;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      h1 {
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin: 4px 0 0;
      }
      .intro {
        flex: none;
      }
      .lesson-top {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 11px;
      }
      .brief {
        font-size: 14px;
        color: #3b4e65;
        max-height: 126px;
        overflow: auto;
        line-height: 1.53;
      }
      .brief code,
      .task code {
        background: #e8eef8;
        border-radius: 4px;
        padding: 1px 3px;
        overflow-wrap: anywhere;
      }
      .task {
        padding: 9px 13px;
        border: 1px solid #cbdcf3;
        border-left: 3px solid var(--blue);
        border-radius: 9px;
        background: #fff;
        max-height: 145px;
        overflow: auto;
        font-size: 14px;
        line-height: 1.5;
      }
      .task-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #41618d;
        font-weight: 800;
        margin-bottom: 3px;
      }
      .expected {
        font-size: 12px;
        color: #526d61;
        margin-top: 5px;
      }
      .expected:before {
        content: "Проверьте себя: ";
        font-weight: 750;
      }
      .workgrid {
        flex: 1;
        min-height: 260px;
        display: grid;
        grid-template-columns: minmax(0, 1.07fr) minmax(0, 0.93fr);
        gap: 13px;
      }
      .workcard {
        min-width: 0;
        min-height: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .cardbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        padding: 7px 11px;
        min-height: 42px;
        border-bottom: 1px solid var(--line);
        background: #fafcff;
        flex: none;
      }
      .filetabs {
        display: flex;
        gap: 4px;
      }
      .filetab {
        border: 0;
        border-radius: 5px;
        background: transparent;
        font:
          12px Consolas,
          monospace;
        color: #63758a;
        padding: 6px 8px;
      }
      .filetab[aria-selected="true"] {
        background: #e3ecfb;
        color: #2459b2;
        font-weight: 800;
      }
      .subtle {
        color: var(--muted);
        font-size: 11px;
      }
      .editorwrap {
        position: relative;
        flex: 1;
        min-height: 120px;
        background: var(--code);
        overflow: hidden;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: block;
        color: #dce7f5;
        font:
          14px/22px "Cascadia Code",
          Consolas,
          monospace;
      }
      .fallback-gutter {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 1;
        width: 38px;
        padding: 12px 7px;
        background: #1b2a3e;
        color: #8496ae;
        white-space: pre;
        text-align: right;
        user-select: none;
        overflow: hidden;
      }
      .highlight-scroller {
        position: absolute;
        inset: 0 0 0 38px;
        overflow: hidden;
        pointer-events: none;
      }
      .highlight-pre {
        font: inherit;
        line-height: 22px;
        tab-size: 2;
        padding: 12px 14px;
        margin: 0;
        white-space: pre;
        min-width: max-content;
      }
      .fallback-textarea {
        position: absolute;
        inset: 0 0 0 38px;
        width: calc(100% - 38px);
        height: 100%;
        border: 0;
        outline: none !important;
        background: transparent;
        color: transparent;
        -webkit-text-fill-color: transparent;
        caret-color: #fff;
        font: inherit;
        line-height: 22px;
        tab-size: 2;
        white-space: pre;
        resize: none;
        padding: 12px 14px;
        z-index: 2;
        overflow: auto;
      }
      .fallback-textarea::selection {
        background: #456fa399;
      }
      .syn-string {
        color: #addc9b;
      }
      .syn-keyword {
        color: #c4b0f7;
      }
      .syn-func {
        color: #87d1f6;
      }
      .syn-comment {
        color: #91a3bb;
      }
      .syn-tag {
        color: #87d1f6;
      }
      .syn-number {
        color: #efc792;
      }
      .monaco-host {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: none;
      }
      .monaco-host.ready {
        display: block;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        flex: none;
      }
      .actions .edit-note {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
      }
      .feedback {
        border-top: 1px solid var(--line);
        background: #f6f9fe;
        color: #3d5676;
        padding: 9px 12px;
        font-size: 13px;
        min-height: 40px;
        max-height: 90px;
        overflow: auto;
        flex: none;
      }
      .feedback.good {
        background: #eaf8f0;
        color: #146344;
      }
      .feedback.bad {
        background: #fff0ef;
        color: #9e2635;
      }
      .hint {
        flex: none;
        max-height: 130px;
        overflow: auto;
        padding: 9px 12px;
        background: #edf4ff;
        border-top: 1px solid #cfddf2;
        font-size: 13px;
      }
      .hint pre {
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        margin: 7px 0 0;
        color: #1b4075;
      }
      .preview-frame {
        flex: 1;
        display: block;
        width: 100%;
        border: 0;
        min-height: 130px;
        background: white;
      }
      .inspector {
        height: 147px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line);
      }
      .inspect-tabs {
        display: flex;
        align-items: center;
        background: #f6f9fd;
        padding: 4px 8px;
        border-bottom: 1px solid var(--line);
        gap: 5px;
        flex: none;
      }
      .inspect-tab {
        font-size: 11px;
        padding: 4px 7px;
        border: 0;
        background: transparent;
        color: #536c88;
        border-radius: 5px;
      }
      .inspect-tab[aria-selected="true"] {
        background: #dfebff;
        color: #2459b2;
        font-weight: 750;
      }
      .inspect-body {
        min-height: 0;
        overflow: auto;
        flex: 1;
      }
      .inspector .tree {
        padding: 6px 10px;
      }
      .tree-row {
        display: block;
        border: 0;
        background: transparent;
        border-radius: 4px;
        color: #365375;
        font:
          11px/1.5 Consolas,
          monospace;
        text-align: left;
        padding: 1px 6px;
        max-width: 100%;
        white-space: nowrap;
      }
      .tree-row:hover,
      .tree-row[aria-pressed="true"] {
        background: #deebff;
        color: #174898;
      }
      .tree-note {
        font-size: 10px;
        color: #63758b;
        padding: 2px 10px 5px;
      }
      .node-note {
        font-size: 11px;
        padding: 5px 10px;
        background: #edf4ff;
        color: #2c4f77;
      }
      .console {
        background: #192638;
        color: #d8eaff;
        font:
          12px/1.5 Consolas,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: 9px 12px;
        min-height: 100%;
      }
      .compare {
        padding: 7px 11px;
        font-size: 11px;
      }
      .compare strong {
        font-size: 10px;
        letter-spacing: 0.02em;
        color: #5a6f89;
      }
      .compare pre {
        margin: 2px 0 6px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #294e80;
      }
      .nav {
        flex: none;
        height: 59px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 22px;
        background: white;
        border-top: 1px solid var(--line);
      }
      .nav .spacer {
        flex: 1;
      }
      .nav-note {
        font-size: 11px;
        color: var(--muted);
      }
      dialog {
        border: 1px solid #d1ddeb;
        border-radius: 15px;
        padding: 0;
        color: var(--ink);
        width: min(760px, calc(100vw - 28px));
        max-height: calc(100dvh - 32px);
        box-shadow: 0 20px 100px #122b4a40;
      }
      dialog::backdrop {
        background: #10213c66;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: white;
        z-index: 1;
      }
      .dialog-head h2 {
        font-size: 19px;
        line-height: 1.3;
        margin: 0;
      }
      .dialog-content {
        padding: 18px 22px;
        font-size: 15px;
        line-height: 1.65;
      }
      .dialog-content h3 {
        font-size: 16px;
        margin: 18px 0 7px;
      }
      .dialog-content h3:first-child {
        margin-top: 0;
      }
      .dialog-content code {
        background: #eef3fb;
        border-radius: 4px;
        padding: 1px 4px;
        overflow-wrap: anywhere;
      }
      .dialog-content pre {
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #18283f;
        color: #dce9fc;
        padding: 14px;
        border-radius: 9px;
      }
      .dialog-content pre code {
        background: none;
        color: inherit;
        padding: 0;
      }
      .dialog-content dl {
        display: grid;
        grid-template-columns: minmax(90px, 0.7fr) minmax(0, 1.5fr);
        gap: 9px 16px;
      }
      .dialog-content dt {
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .dialog-content dd {
        margin: 0;
        min-width: 0;
      }
      .reason {
        padding: 11px 13px;
        border-left: 3px solid #4c83d4;
        background: #eef5ff;
        border-radius: 0 7px 7px 0;
      }
      .pitfall {
        padding: 10px 13px;
        background: #fff7e9;
        border-radius: 7px;
      }
      .dialog-content a {
        color: #245fd0;
      }
      .step-list {
        display: grid;
        gap: 6px;
      }
      .step-link {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: white;
        padding: 9px 11px;
        display: flex;
        gap: 10px;
        color: #304c70;
        text-align: left;
      }
      .step-link.current {
        background: #edf4ff;
        border-color: #88ade5;
      }
      .step-link .step-num {
        font-weight: 800;
        min-width: 23px;
      }
      .step-link .step-done {
        margin-left: auto;
        color: var(--green);
      }
      .finish {
        background: white;
        border: 1px solid #cbdcf2;
        border-radius: 13px;
        padding: 22px;
        overflow: auto;
        flex: 1;
      }
      .finish h2 {
        margin: 0 0 10px;
      }
      .finish .skills {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 15px 0;
      }
      .skill {
        padding: 12px 15px;
        background: #f1f6fd;
        border-radius: 8px;
      }
      .skill code {
        display: block;
        color: #275da6;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .finish-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .finish details {
        margin-top: 16px;
      }
      .finish ol {
        padding-left: 23px;
      }
      .finish li {
        margin: 5px 0;
      }
      @media (max-height: 745px) and (min-width: 761px) {
        .top {
          height: 54px;
        }
        .inner {
          padding-top: 9px;
          gap: 9px;
        }
        h1 {
          font-size: 22px;
        }
        .lesson-top {
          margin-top: 7px;
          gap: 14px;
        }
        .brief {
          font-size: 13px;
          max-height: 119px;
        }
        .task {
          font-size: 13px;
          padding: 7px 10px;
          max-height: 131px;
        }
        .nav {
          height: 54px;
        }
        .inspector {
          height: 129px;
        }
        .feedback {
          padding: 7px 11px;
        }
        .expected {
          font-size: 11px;
        }
      }
      @media (max-width: 760px) {
        body {
          height: auto;
          min-height: 100dvh;
          overflow: auto;
        }
        .top {
          height: auto;
          min-height: 58px;
          padding: 9px 12px;
          flex-wrap: wrap;
          gap: 7px;
        }
        .brand {
          font-size: 14px;
        }
        .topmeta {
          font-size: 11px;
          gap: 6px;
        }
        .meter {
          width: 55px;
        }
        .top .btn {
          font-size: 11px;
          padding: 6px 8px;
        }
        .inner {
          padding: 14px 12px;
        }
        .heading {
          align-items: flex-start;
        }
        h1 {
          font-size: 22px;
        }
        .lesson-top {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .brief,
        .task {
          max-height: none;
        }
        .workgrid {
          display: flex;
          flex-direction: column;
          min-height: 0;
        }
        .workcard {
          height: 405px;
          flex: none;
        }
        .editorwrap {
          min-height: 200px;
        }
        .workcard.preview-card {
          height: 410px;
        }
        .inspector {
          height: 150px;
        }
        .nav {
          height: auto;
          min-height: 58px;
          position: sticky;
          bottom: 0;
          padding: 9px 11px;
          gap: 7px;
          z-index: 5;
        }
        .nav .btn {
          font-size: 12px;
          padding: 9px 10px;
        }
        .nav-note {
          display: none;
        }
        .actions .edit-note {
          font-size: 10px;
        }
        .dialog-content {
          padding: 15px 17px;
        }
        .dialog-content dl {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        .dialog-content dd {
          margin-bottom: 9px;
        }
        .finish .skills {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }

      /* Размеры и поведение сохраняют оформление предыдущего занятия. */
      .top {
        gap: 10px;
      }
      .topmeta {
        gap: 8px;
      }
      .preview-tools {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .preview-note {
        flex: none;
        padding: 7px 11px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        background: #fafcff;
      }
      .runtime-errors {
        flex: none;
        padding: 7px 11px;
        background: #fff0ef;
        color: #9e2635;
        font-size: 12px;
        max-height: 80px;
        overflow: auto;
      }
      .preview-card > .console {
        flex: none;
        height: 105px;
        min-height: 0;
        border-top: 1px solid #35475f;
      }
      .dialog-content table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .dialog-content th,
      .dialog-content td {
        text-align: left;
        vertical-align: top;
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-content th {
        background: #f2f6fc;
      }
      .dialog-content .experiment-box {
        background: #f3f7fc;
        border: 1px solid #cfdaea;
        padding: 14px;
        border-radius: 9px;
        margin: 12px 0;
      }
      .experiment-input {
        width: 100%;
        max-width: 420px;
        font: 16px/1.4 inherit;
        border: 1px solid #91acd0;
        border-radius: 7px;
        padding: 9px 11px;
        margin: 8px 0;
      }
      .experiment-result {
        min-height: 40px;
        padding: 9px 11px;
        background: #fff;
        border-radius: 6px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .experiment-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .step-group {
        margin: 14px 0 5px;
        color: #44648d;
        font-size: 12px;
        font-weight: 750;
      }
      .step-link .step-done {
        white-space: nowrap;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0;
      }
      .score-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f6f9fe;
      }
      .score-card.done {
        background: #edf8f1;
        border-color: #b5d9c3;
      }
      .score-card strong {
        font-size: 22px;
        display: block;
        margin-bottom: 5px;
      }
      .result-grade {
        font-size: 22px;
        font-weight: 750;
        margin: 12px 0;
      }
      .result-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      .finish pre {
        white-space: pre-wrap;
        background: #eff4fb;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
      }
      .small-note {
        font-size: 12px;
        color: var(--muted);
      }
      .theory-check {
        padding: 11px 13px;
        background: #eef5ff;
        border-radius: 8px;
        margin-top: 13px;
      }
      .source-link {

<script id="lessonData" type="application/json">[{"id":"order01","num":1,"title":"Обычные команды идут по порядку","chapter":1,"story":"Выбираем время для фильма «Живой звук». Сначала посмотрим, в каком порядке выполняются обычные команды. Сообщения появляются в консоли под карточкой фильма.","task":"После первой команды добавьте вывод <b>«Выбираем сеанс»<\/b> через <code>console.log()<\/code>.","expected":"В консоли сначала «Открыли страницу», затем «Выбираем сеанс». Нажимать кнопку в карточке пока не нужно.","solution":"console.log(\"Открыли страницу\");\nconsole.log(\"Выбираем сеанс\");\n","starter":"console.log(\"Открыли страницу\");\n// Добавьте второе сообщение\n","hints":["Нужна ещё одна обычная команда под первой. Обработчик клика здесь не требуется.","Запишите <code>console.log(\"Выбираем сеанс\");<\/code> на месте комментария."],"tests":[{"type":"logOrder","values":["Открыли страницу","Выбираем сеанс"]}],"mode":"single","theory":{"theory":"<p>Когда команды не откладывают работу, JavaScript выполняет их последовательно. Сначала одну строку, затем следующую.<\/p><p>Такой участок кода называют <strong>синхронным<\/strong>. Начнём с двух знакомых сообщений.<\/p>","example":"console.log(\"Открываем афишу\");\nconsole.log(\"Показываем время\");\n","result":"Сначала появится «Открываем афишу», затем «Показываем время».","breakdown":"<p><code>console.log()<\/code> выводит переданный текст в консоль. Кавычки обозначают строку, сами кавычки в результате не видны.<\/p><p>Вторая команда выполняется после первой. Здесь нет ни ожидания нажатия, ни отложенной функции.<\/p>","question":"Почему нижнее сообщение в этом примере появляется вторым?","answer":"Это обычные последовательные команды. Выполнив первую, программа переходит к следующей."},"example":"console.log(\"Открываем афишу\");\nconsole.log(\"Показываем время\");\n","result":"Сначала появится «Открываем афишу», затем «Показываем время».","explanation":"<p><code>console.log()<\/code> выводит переданный текст в консоль. Кавычки обозначают строку, сами кавычки в результате не видны.<\/p><p>Вторая команда выполняется после первой. Здесь нет ни ожидания нажатия, ни отложенной функции.<\/p>","question":"Почему нижнее сообщение в этом примере появляется вторым?","answer":"Это обычные последовательные команды. Выполнив первую, программа переходит к следующей."},{"id":"order02","num":2,"title":"Вызов функции выполняется сейчас","chapter":1,"story":"Сообщение о времени показа вынесено в готовую функцию. Проверим, когда выполнится её команда: важен не только номер строки, но и место вызова функции.","task":"На месте комментария вызовите готовую функцию <code>showSession()<\/code>. Её определение менять не нужно.","expected":"Порядок: «Открыли страницу», «Сеанс в 19:30», «Продолжаем работу».","solution":"function showSession() {\n  console.log(\"Сеанс в 19:30\");\n}\n\nconsole.log(\"Открыли страницу\");\nshowSession();\nconsole.log(\"Продолжаем работу\");\n","starter":"function showSession() {\n  console.log(\"Сеанс в 19:30\");\n}\n\nconsole.log(\"Открыли страницу\");\n// Вызовите функцию здесь\nconsole.log(\"Продолжаем работу\");\n","hints":["Определение функции сверху ещё не выполняет её команды. Нужен вызов между двумя сообщениями.","Вызов записывается с круглыми скобками: <code>showSession();<\/code>."],"tests":[{"type":"logOrder","values":["Открыли страницу","Сеанс в 19:30","Продолжаем работу"]}],"mode":"single","theory":{"theory":"<p>Определение функции сохраняет набор команд. Они выполнятся, когда программа дойдёт до <strong>вызова<\/strong>.<\/p><p>При обычном синхронном вызове сначала выполняется тело функции, затем код после вызова.<\/p>","example":"function showTime() {\n  console.log(\"Показ в 21:45\");\n}\n\nconsole.log(\"Открыли афишу\");\nshowTime();\nconsole.log(\"Время показано\");\n","result":"«Открыли афишу», затем «Показ в 21:45», затем «Время показано».","breakdown":"<p>Строки между фигурными скобками относятся к функции <code>showTime<\/code>. При чтении определения сообщение ещё не выводится.<\/p><p>Круглые скобки в <code>showTime()<\/code> означают вызов. Программа выполняет команду функции и возвращается к нижнему <code>console.log()<\/code>.<\/p>","question":"Почему сообщение из верхней функции появилось между двумя нижними сообщениями?","answer":"Потому что между ними стоит вызов функции. Её определение расположено сверху, а выполнение начинается в месте вызова."},"example":"function showTime() {\n  console.log(\"Показ в 21:45\");\n}\n\nconsole.log(\"Открыли афишу\");\nshowTime();\nconsole.log(\"Время показано\");\n","result":"«Открыли афишу», затем «Показ в 21:45», затем «Время показано».","explanation":"<p>Строки между фигурными скобками относятся к функции <code>showTime<\/code>. При чтении определения сообщение ещё не выводится.<\/p><p>Круглые скобки в <code>showTime()<\/code> означают вызов. Программа выполняет команду функции и возвращается к нижнему <code>console.log()<\/code>.<\/p>","question":"Почему сообщение из верхней функции появилось между двумя нижними сообщениями?","answer":"Потому что между ними стоит вызов функции. Её определение расположено сверху, а выполнение начинается в месте вызова."},{"id":"order03","num":3,"title":"Обработчик ждёт нажатия","chapter":1,"story":"Посетитель сам решает, когда проверить места. Подключим сообщение к кнопке: оно должно появляться после нажатия. Подготовка страницы при этом заканчивается сразу.","task":"Внутри готового обработчика <code>click<\/code> выведите <b>«Кнопку нажали»<\/b>. Затем нажмите «Проверить места» справа.","expected":"Сразу видно «Страница готова». «Кнопку нажали» появляется только после клика.","solution":"const checkButton = document.querySelector(\".check-sessions\");\n\ncheckButton.addEventListener(\"click\", () => {\n  console.log(\"Кнопку нажали\");\n});\n\nconsole.log(\"Страница готова\");\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\n\ncheckButton.addEventListener(\"click\", () => {\n  // Сообщите о нажатии\n});\n\nconsole.log(\"Страница готова\");\n","hints":["Команда должна находиться между фигурными скобками обработчика, а не после него.","На месте комментария добавьте <code>console.log(\"Кнопку нажали\");<\/code>."],"tests":[{"type":"log","value":"Страница готова"},{"type":"notLog","value":"Кнопку нажали"},{"type":"click","selector":".check-sessions"},{"type":"logOrder","values":["Страница готова","Кнопку нажали"]}],"mode":"single","theory":{"theory":"<p>Подключение обработчика и выполнение его команд происходят в разные моменты. <code>addEventListener()<\/code> сообщает браузеру, какую функцию вызвать после события.<\/p><p>Пока клика нет, программа может выполнить обычный код ниже.<\/p>","example":"const button = document.querySelector(\".check-sessions\");\n\nbutton.addEventListener(\"click\", () => {\n  console.log(\"Начали по нажатию\");\n});\n\nconsole.log(\"Обработчик подключён\");\n","result":"«Обработчик подключён» появится сразу. «Начали по нажатию» — после клика.","breakdown":"<p><code>querySelector()<\/code> находит кнопку. Переменная хранит ссылку на неё.<\/p><p>Функция <code>() =&gt; { ... }<\/code> передаётся браузеру для события <code>click<\/code>. Команда внутри неё при подключении ещё не запускается.<\/p><p>Нижний <code>console.log()<\/code> находится за пределами обработчика и выполняется при подготовке страницы.<\/p>","question":"Значит ли расположение команды выше в файле, что она обязательно выполнится раньше?","answer":"Нет. Команда внутри обработчика ждёт его вызова. Обычный код ниже может выполниться до нажатия."},"example":"const button = document.querySelector(\".check-sessions\");\n\nbutton.addEventListener(\"click\", () => {\n  console.log(\"Начали по нажатию\");\n});\n\nconsole.log(\"Обработчик подключён\");\n","result":"«Обработчик подключён» появится сразу. «Начали по нажатию» — после клика.","explanation":"<p><code>querySelector()<\/code> находит кнопку. Переменная хранит ссылку на неё.<\/p><p>Функция <code>() =&gt; { ... }<\/code> передаётся браузеру для события <code>click<\/code>. Команда внутри неё при подключении ещё не запускается.<\/p><p>Нижний <code>console.log()<\/code> находится за пределами обработчика и выполняется при подготовке страницы.<\/p>","question":"Значит ли расположение команды выше в файле, что она обязательно выполнится раньше?","answer":"Нет. Команда внутри обработчика ждёт его вызова. Обычный код ниже может выполниться до нажатия."},{"id":"order04","num":4,"title":"Ответ приходит позже","chapter":2,"story":"После нажатия проверка мест начинается сразу, а ответ приходит с задержкой. Готовый таймер изображает ожидание сервера. В карточке появится результат, а в консоли отметим момент его получения.","task":"Внутри готовой функции, переданной в <code>setTimeout()<\/code>, выведите <b>«19:30: ответ получен»<\/b>.","expected":"После клика сразу «Проверка началась». Примерно через две секунды — ответ в консоли и «Мест нет» в карточке.","solution":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\n\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  eveningMessage.textContent = \"Проверяем места...\";\n  console.log(\"Проверка началась\");\n\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2000);\n});\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\n\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  eveningMessage.textContent = \"Проверяем места...\";\n  console.log(\"Проверка началась\");\n\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    // Отметьте получение ответа\n    checkButton.disabled = false;\n  }, 2000);\n});\n","hints":["Сообщение относится к полученному ответу, поэтому его место — внутри отложенной функции.","Добавьте <code>console.log(\"19:30: ответ получен\");<\/code> рядом с командой результата карточки."],"tests":[{"type":"notLog","value":"19:30: ответ получен"},{"type":"click","selector":".check-sessions"},{"type":"log","value":"Проверка началась"},{"type":"notLog","value":"19:30: ответ получен"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"disabled","selector":".check-sessions","value":true},{"type":"wait","ms":2200},{"type":"log","value":"19:30: ответ получен"},{"type":"text","selector":".evening-message","value":"Мест нет"},{"type":"disabled","selector":".check-sessions","value":false}],"mode":"single","theory":{"theory":"<p>Между запуском проверки и её ответом проходит время. Здесь <code>setTimeout()<\/code> позволяет запланировать вызов функции на потом.<\/p><p>Таймер изображает задержку ответа. Настоящего сетевого запроса в этом занятии нет.<\/p>","example":"console.log(\"Ждём ответ\");\n\nsetTimeout(() => {\n  console.log(\"Ответ готов\");\n}, 1500);\n","result":"«Ждём ответ» появится сразу. «Ответ готов» — примерно через полторы секунды.","breakdown":"<p>В <code>setTimeout()<\/code> переданы функция и число 1500. Это миллисекунды: 1000 мс — одна секунда. В задании готовая задержка равна 2000 мс.<\/p><p>Сейчас выполняется планирование. Команды внутри переданной функции будут выполнены при её позднем вызове.<\/p><p>В готовом коде карточки <code>textContent<\/code> меняет надпись. Две строки <code>disabled<\/code> выключают кнопку на время проверки и возвращают её после ответа: <code>true<\/code> выключает, <code>false<\/code> включает.<\/p>","question":"Какая команда примера выполняется после ожидания?","answer":"console.log(\"Ответ готов\"): она находится внутри функции, переданной таймеру."},"example":"console.log(\"Ждём ответ\");\n\nsetTimeout(() => {\n  console.log(\"Ответ готов\");\n}, 1500);\n","result":"«Ждём ответ» появится сразу. «Ответ готов» — примерно через полторы секунды.","explanation":"<p>В <code>setTimeout()<\/code> переданы функция и число 1500. Это миллисекунды: 1000 мс — одна секунда. В задании готовая задержка равна 2000 мс.<\/p><p>Сейчас выполняется планирование. Команды внутри переданной функции будут выполнены при её позднем вызове.<\/p><p>В готовом коде карточки <code>textContent<\/code> меняет надпись. Две строки <code>disabled<\/code> выключают кнопку на время проверки и возвращают её после ответа: <code>true<\/code> выключает, <code>false<\/code> включает.<\/p>","question":"Какая команда примера выполняется после ожидания?","answer":"console.log(\"Ответ готов\"): она находится внутри функции, переданной таймеру."},{"id":"order05","num":5,"title":"Строка ниже не ждёт таймер","chapter":2,"story":"Мы запланировали получение ответа. Проверим, остановился ли на этом обычный код. Для этого добавим сообщение ниже вызова таймера.","task":"После <code>}, 2000);<\/code>, на месте комментария, выведите <b>«Страница продолжает работать»<\/b>. Оставьте команду внутри обработчика клика.","expected":"Сразу: «Проверка началась», «Страница продолжает работать». Позже: «19:30: ответ получен».","solution":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\n\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  eveningMessage.textContent = \"Проверяем места...\";\n  console.log(\"Проверка началась\");\n\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2000);\n\n  console.log(\"Страница продолжает работать\");\n});\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\n\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  eveningMessage.textContent = \"Проверяем места...\";\n  console.log(\"Проверка началась\");\n\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2000);\n\n  // Отметьте продолжение обычного кода\n});\n","hints":["Нужная строка находится после таймера, но перед последним <code>});<\/code>, закрывающим обработчик кнопки.","Добавьте <code>console.log(\"Страница продолжает работать\");<\/code> за пределами функции таймера."],"tests":[{"type":"click","selector":".check-sessions"},{"type":"logOrder","values":["Проверка началась","Страница продолжает работать"]},{"type":"notLog","value":"19:30: ответ получен"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"wait","ms":2200},{"type":"logOrder","values":["Проверка началась","Страница продолжает работать","19:30: ответ получен"]}],"mode":"single","theory":{"theory":"<p><code>setTimeout()<\/code> планирует поздний вызов функции, а обычный код продолжается. Это пример <strong>асинхронной работы<\/strong>: нижняя обычная команда может выполниться раньше команды внутри таймера.<\/p>","example":"console.log(\"Начали\");\n\nsetTimeout(() => {\n  console.log(\"Получили ответ\");\n}, 1500);\n\nconsole.log(\"Читаем афишу\");\n","result":"Сразу «Начали» и «Читаем афишу». Позже — «Получили ответ».","breakdown":"<p>Первый <code>console.log()<\/code> выполняется сразу. Затем браузер получает функцию для позднего вызова.<\/p><p>Пока она ждёт, программа доходит до нижней команды и выводит «Читаем афишу». Эта строка не находится внутри таймера.<\/p><p>Здесь нужно смотреть не только сверху вниз, но и на границы функций: какая команда выполняется сейчас, а какая ждёт будущего вызова.<\/p>","question":"Почему нижняя строка появилась раньше строки, записанной выше неё внутри таймера?","answer":"Нижняя команда продолжает текущий код. Команда внутри таймера выполнится при позднем вызове переданной функции."},"example":"console.log(\"Начали\");\n\nsetTimeout(() => {\n  console.log(\"Получили ответ\");\n}, 1500);\n\nconsole.log(\"Читаем афишу\");\n","result":"Сразу «Начали» и «Читаем афишу». Позже — «Получили ответ».","explanation":"<p>Первый <code>console.log()<\/code> выполняется сразу. Затем браузер получает функцию для позднего вызова.<\/p><p>Пока она ждёт, программа доходит до нижней команды и выводит «Читаем афишу». Эта строка не находится внутри таймера.<\/p><p>Здесь нужно смотреть не только сверху вниз, но и на границы функций: какая команда выполняется сейчас, а какая ждёт будущего вызова.<\/p>","question":"Почему нижняя строка появилась раньше строки, записанной выше неё внутри таймера?","answer":"Нижняя команда продолжает текущий код. Команда внутри таймера выполнится при позднем вызове переданной функции."},{"id":"order06","num":6,"title":"Результат должен дождаться ответа","chapter":2,"story":"В этой версии карточка сразу объявляет «Мест нет», хотя сообщение о полученном ответе появляется лишь через две секунды. Команда результата оказалась среди обычных команд после таймера.","task":"Перенесите строку <code>eveningMessage.textContent = \"Мест нет\";<\/code> внутрь функции таймера, рядом с сообщением о получении ответа.","expected":"До ответа в карточке остаётся «Проверяем места...». Обычное сообщение «Страница продолжает работать» по-прежнему появляется сразу.","solution":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\n\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  eveningMessage.textContent = \"Проверяем места...\";\n  console.log(\"Проверка началась\");\n\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2000);\n\n  console.log(\"Страница продолжает работать\");\n});\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\n\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  eveningMessage.textContent = \"Проверяем места...\";\n  console.log(\"Проверка началась\");\n\n  setTimeout(() => {\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2000);\n\n  eveningMessage.textContent = \"Мест нет\";\n\n  console.log(\"Страница продолжает работать\");\n});\n","hints":["Менять задержку не нужно. Нужно изменить место команды, которая показывает окончательный результат.","Уберите присваивание после таймера и поместите его перед <code>console.log(\"19:30: ответ получен\");<\/code> внутри функции таймера."],"tests":[{"type":"click","selector":".check-sessions"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"logOrder","values":["Проверка началась","Страница продолжает работать"]},{"type":"notLog","value":"19:30: ответ получен"},{"type":"wait","ms":2200},{"type":"text","selector":".evening-message","value":"Мест нет"},{"type":"log","value":"19:30: ответ получен"}],"mode":"single","theory":{"theory":"<p>Если действие зависит от ещё не полученного ответа, его нужно выполнить после ожидания. Для этого команда должна находиться внутри отложенной функции.<\/p><p>Одно только расположение ниже <code>setTimeout()<\/code> ожидания не создаёт.<\/p>","example":"const message = document.querySelector(\".evening-message\");\nmessage.textContent = \"Ждём ответ\";\n\nsetTimeout(() => {\n  message.textContent = \"Ответ готов\";\n}, 1200);\n","result":"Сначала видна надпись «Ждём ответ». Позднее её заменяет «Ответ готов».","breakdown":"<p>Открывающая фигурная скобка после <code>() =&gt;<\/code> начинает тело функции. Закрывающая скобка перед <code>, 1200<\/code> завершает его.<\/p><p>Команда результата находится между этими скобками и поэтому ждёт вызова функции. Команда после <code>}, 1200);<\/code> продолжила бы обычный код сразу.<\/p>","question":"Что определяет момент появления результата: номер строки или то, внутри какой функции она находится?","answer":"Нужно учитывать функцию и момент её вызова. Строка внутри отложенной функции выполнится позже обычной строки после таймера."},"example":"const message = document.querySelector(\".evening-message\");\nmessage.textContent = \"Ждём ответ\";\n\nsetTimeout(() => {\n  message.textContent = \"Ответ готов\";\n}, 1200);\n","result":"Сначала видна надпись «Ждём ответ». Позднее её заменяет «Ответ готов».","explanation":"<p>Открывающая фигурная скобка после <code>() =&gt;<\/code> начинает тело функции. Закрывающая скобка перед <code>, 1200<\/code> завершает его.<\/p><p>Команда результата находится между этими скобками и поэтому ждёт вызова функции. Команда после <code>}, 1200);<\/code> продолжила бы обычный код сразу.<\/p>","question":"Что определяет момент появления результата: номер строки или то, внутри какой функции она находится?","answer":"Нужно учитывать функцию и момент её вызова. Строка внутри отложенной функции выполнится позже обычной строки после таймера."},{"id":"order07","num":7,"title":"Начинаем две проверки сразу","chapter":3,"story":"На 19:30 мест нет. Есть ещё показ в 21:45. Для каждого времени готова короткая функция проверки. Сейчас кнопка запускает только первую — добавим вторую рядом с ней.","task":"В обработчике <code>click<\/code> после <code>checkEvening();<\/code> вызовите <code>checkLate()<\/code>. Обе функции уже определены выше.","expected":"Сразу обе карточки показывают ожидание. 21:45 отвечает раньше и сообщает «Места есть». 19:30 ещё проверяется.","solution":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n    console.log(\"21:45: ответ получен\");\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  checkLate();\n});\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n    console.log(\"21:45: ответ получен\");\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  // Начните вторую проверку здесь\n});\n","hints":["Первая функция начинает проверку и заканчивает текущий вызов. Поэтому вторую можно вызвать следующей обычной командой.","На месте комментария добавьте <code>checkLate();<\/code>. Не переносите этот вызов внутрь первого таймера."],"tests":[{"type":"click","selector":".check-sessions"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"text","selector":".late-message","value":"Проверяем места..."},{"type":"disabled","selector":".check-sessions","value":true},{"type":"wait","ms":1000},{"type":"text","selector":".late-message","value":"Места есть"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"wait","ms":1400},{"type":"text","selector":".evening-message","value":"Мест нет"},{"type":"disabled","selector":".check-sessions","value":false}],"mode":"two","theory":{"theory":"<p>Функции <code>checkEvening()<\/code> и <code>checkLate()<\/code> запускаются обычными последовательными командами. Каждая начинает проверку, планирует поздний результат и заканчивает текущий вызов.<\/p><p>Поэтому запуск второй проверки не обязан ждать первого ответа. Их ожидания перекрываются.<\/p>","example":"function checkFirst() {\n  setTimeout(() => {\n    console.log(\"Первый ответ\");\n  }, 1800);\n}\nfunction checkSecond() {\n  setTimeout(() => {\n    console.log(\"Второй ответ\");\n  }, 500);\n}\ncheckFirst();\ncheckSecond();\n","result":"Обе проверки начнутся подряд. Примерно через полсекунды появится «Второй ответ», позже — «Первый ответ».","breakdown":"<p>Сначала вызывается <code>checkFirst()<\/code>. Она планирует функцию таймера, но не ждёт 1800 мс внутри текущего вызова.<\/p><p>Затем выполняется <code>checkSecond()<\/code>. Её ожидание короче, поэтому результат появляется раньше.<\/p><p>В задании сообщение 19:30 хранится в <code>eveningMessage<\/code>, а 21:45 — в <code>lateMessage<\/code>. Их обновление уже написано; меняем только место запуска проверки.<\/p>","question":"Нужно ли дождаться первого ответа, прежде чем вызвать вторую функцию проверки?","answer":"Нет. Первая функция планирует таймер и заканчивает текущий вызов. После этого можно вызвать вторую функцию; первый ответ придёт позже."},"example":"function checkFirst() {\n  setTimeout(() => {\n    console.log(\"Первый ответ\");\n  }, 1800);\n}\nfunction checkSecond() {\n  setTimeout(() => {\n    console.log(\"Второй ответ\");\n  }, 500);\n}\ncheckFirst();\ncheckSecond();\n","result":"Обе проверки начнутся подряд. Примерно через полсекунды появится «Второй ответ», позже — «Первый ответ».","explanation":"<p>Сначала вызывается <code>checkFirst()<\/code>. Она планирует функцию таймера, но не ждёт 1800 мс внутри текущего вызова.<\/p><p>Затем выполняется <code>checkSecond()<\/code>. Её ожидание короче, поэтому результат появляется раньше.<\/p><p>В задании сообщение 19:30 хранится в <code>eveningMessage<\/code>, а 21:45 — в <code>lateMessage<\/code>. Их обновление уже написано; меняем только место запуска проверки.<\/p>","question":"Нужно ли дождаться первого ответа, прежде чем вызвать вторую функцию проверки?","answer":"Нет. Первая функция планирует таймер и заканчивает текущий вызов. После этого можно вызвать вторую функцию; первый ответ придёт позже."},{"id":"order08","num":8,"title":"Запустили — ещё не получили ответ","chapter":3,"story":"Обе проверки начинаются одним нажатием. Отметим в консоли именно момент запуска: результат каждого сеанса появится позднее.","task":"После двух вызовов в обработчике кнопки выведите <b>«Проверки запущены»<\/b> через <code>console.log()<\/code>.","expected":"Сообщение «Проверки запущены» появляется сразу, пока обе карточки ещё показывают ожидание.","solution":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n    console.log(\"21:45: ответ получен\");\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  checkLate();\n  console.log(\"Проверки запущены\");\n});\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n    console.log(\"21:45: ответ получен\");\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  checkLate();\n  // Отметьте запуск обеих проверок\n});\n","hints":["Нужная команда относится к запуску. Её место — после двух вызовов, за пределами функций таймеров.","После <code>checkLate();<\/code> добавьте <code>console.log(\"Проверки запущены\");<\/code>."],"tests":[{"type":"click","selector":".check-sessions"},{"type":"log","value":"Проверки запущены"},{"type":"notLog","value":"19:30: ответ получен"},{"type":"notLog","value":"21:45: ответ получен"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"text","selector":".late-message","value":"Проверяем места..."},{"type":"wait","ms":1000},{"type":"logOrder","values":["Проверки запущены","21:45: ответ получен"]},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"wait","ms":1400},{"type":"logOrder","values":["Проверки запущены","21:45: ответ получен","19:30: ответ получен"]}],"mode":"two","theory":{"theory":"<p>Запуск проверки и получение её результата — разные события. Обычная команда после вызова функции запуска может выполниться до позднего ответа.<\/p>","example":"function startCheck() {\n  setTimeout(() => {\n    console.log(\"Ответ готов\");\n  }, 1000);\n}\n\nstartCheck();\nconsole.log(\"Проверка запущена\");\n","result":"Сразу «Проверка запущена», примерно через секунду — «Ответ готов».","breakdown":"<p><code>startCheck()<\/code> выполняет планирование и завершает текущий вызов. После этого программа доходит до нижнего <code>console.log()<\/code>.<\/p><p>Внутренняя функция таймера пока ждёт. Сам факт, что функция запуска уже была вызвана, не означает готовность результата.<\/p><p>В задании перед сообщением стоят два таких вызова. Для каждого действует тот же порядок.<\/p>","question":"Что подтверждает сообщение «Проверки запущены»?","answer":"Что код дошёл до запуска обеих проверок. Оно ещё не подтверждает получение ответов."},"example":"function startCheck() {\n  setTimeout(() => {\n    console.log(\"Ответ готов\");\n  }, 1000);\n}\n\nstartCheck();\nconsole.log(\"Проверка запущена\");\n","result":"Сразу «Проверка запущена», примерно через секунду — «Ответ готов».","explanation":"<p><code>startCheck()<\/code> выполняет планирование и завершает текущий вызов. После этого программа доходит до нижнего <code>console.log()<\/code>.<\/p><p>Внутренняя функция таймера пока ждёт. Сам факт, что функция запуска уже была вызвана, не означает готовность результата.<\/p><p>В задании перед сообщением стоят два таких вызова. Для каждого действует тот же порядок.<\/p>","question":"Что подтверждает сообщение «Проверки запущены»?","answer":"Что код дошёл до запуска обеих проверок. Оно ещё не подтверждает получение ответов."},{"id":"order09","num":9,"title":"Отмечаем настоящий момент ответа","chapter":3,"story":"Сообщение «21:45: ответ получен» сейчас появляется сразу после запуска, когда карточка ещё ждёт. Вернём сообщение к настоящему моменту готовности.","task":"Перенесите этот <code>console.log()<\/code> внутрь функции таймера в <code>checkLate()<\/code>, рядом с результатом позднего сеанса.","expected":"Порядок: «Проверки запущены», «21:45: ответ получен», «19:30: ответ получен».","solution":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n    console.log(\"21:45: ответ получен\");\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  checkLate();\n  console.log(\"Проверки запущены\");\n});\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  checkLate();\n  console.log(\"21:45: ответ получен\");\n  console.log(\"Проверки запущены\");\n});\n","hints":["Вызов <code>checkLate()<\/code> только начинает проверку. Сообщение об ответе должно выполняться после её ожидания.","Уберите <code>console.log(\"21:45: ответ получен\");<\/code> из обработчика кнопки и перенесите внутрь второго таймера, после изменения <code>lateMessage<\/code>."],"tests":[{"type":"click","selector":".check-sessions"},{"type":"log","value":"Проверки запущены"},{"type":"notLog","value":"21:45: ответ получен"},{"type":"notLog","value":"19:30: ответ получен"},{"type":"text","selector":".late-message","value":"Проверяем места..."},{"type":"wait","ms":1000},{"type":"logOrder","values":["Проверки запущены","21:45: ответ получен"]},{"type":"text","selector":".late-message","value":"Места есть"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"wait","ms":1400},{"type":"logOrder","values":["Проверки запущены","21:45: ответ получен","19:30: ответ получен"]}],"mode":"two","theory":{"theory":"<p>Расположение сообщения в коде должно соответствовать событию, о котором оно говорит. Сообщение об ответе относится к позднему вызову функции, а не к запуску ожидания.<\/p><p>Проверка, начатая второй, может ответить первой.<\/p>","example":"setTimeout(() => {\n  console.log(\"Ответ для 19:30\");\n}, 2000);\nsetTimeout(() => {\n  console.log(\"Ответ для 21:45\");\n}, 600);\nconsole.log(\"Ожидаем оба ответа\");\n","result":"Сразу «Ожидаем оба ответа». Затем «Ответ для 21:45». Позже — «Ответ для 19:30».","breakdown":"<p>Сначала программа планирует первый таймер, затем второй. Нижний <code>console.log()<\/code> выполняется при продолжении обычного кода.<\/p><p>У второго ожидание короче: 600 мс вместо 2000 мс. В этом примере его функция будет вызвана раньше.<\/p><p>Сообщения об ответах находятся внутри соответствующих функций. Так журнал отражает получение результатов, а не только порядок запусков.<\/p>","question":"Почему нельзя судить о порядке ответов только по расположению вызовов сверху вниз?","answer":"У проверок может быть разная задержка. Запуск второй после первой не заставляет второй ответ ждать первого."},"example":"setTimeout(() => {\n  console.log(\"Ответ для 19:30\");\n}, 2000);\nsetTimeout(() => {\n  console.log(\"Ответ для 21:45\");\n}, 600);\nconsole.log(\"Ожидаем оба ответа\");\n","result":"Сразу «Ожидаем оба ответа». Затем «Ответ для 21:45». Позже — «Ответ для 19:30».","explanation":"<p>Сначала программа планирует первый таймер, затем второй. Нижний <code>console.log()<\/code> выполняется при продолжении обычного кода.<\/p><p>У второго ожидание короче: 600 мс вместо 2000 мс. В этом примере его функция будет вызвана раньше.<\/p><p>Сообщения об ответах находятся внутри соответствующих функций. Так журнал отражает получение результатов, а не только порядок запусков.<\/p>","question":"Почему нельзя судить о порядке ответов только по расположению вызовов сверху вниз?","answer":"У проверок может быть разная задержка. Запуск второй после первой не заставляет второй ответ ждать первого."},{"id":"order10","num":10,"title":"Убираем лишнее ожидание","chapter":4,"story":"В этой версии 21:45 начинает проверяться лишь после ответа 19:30. Но сеансы независимы: посетитель мог бы узнать про поздний показ раньше. Исправим только запуск второй проверки.","task":"Переместите вызов <code>checkLate();<\/code> из первого таймера в обработчик кнопки, рядом с <code>checkEvening();<\/code>. Внутренний код проверок сохраните.","expected":"Обе проверки начинаются сразу. Сначала приходит положительный ответ 21:45, затем отказ 19:30.","solution":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n    console.log(\"21:45: ответ получен\");\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  checkLate();\n  console.log(\"Проверки запущены\");\n});\n","starter":"const checkButton = document.querySelector(\".check-sessions\");\nconst eveningMessage = document.querySelector(\".evening-message\");\nconst lateMessage = document.querySelector(\".late-message\");\n\nfunction checkEvening() {\n  eveningMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    eveningMessage.textContent = \"Мест нет\";\n    console.log(\"19:30: ответ получен\");\n    checkLate();\n    checkButton.disabled = false;\n  }, 2200);\n}\nfunction checkLate() {\n  lateMessage.textContent = \"Проверяем места...\";\n  setTimeout(() => {\n    lateMessage.textContent = \"Места есть\";\n    console.log(\"21:45: ответ получен\");\n  }, 800);\n}\ncheckButton.addEventListener(\"click\", () => {\n  checkButton.disabled = true;\n  checkEvening();\n  console.log(\"Проверки запущены\");\n});\n","hints":["Найдите, что сейчас откладывает запуск второй проверки. До команды внутри первого таймера программа дойдёт только после его ожидания.","Удалите <code>checkLate();<\/code> из таймера <code>checkEvening()<\/code>. В обработчике <code>click<\/code> поставьте этот вызов сразу после <code>checkEvening();<\/code>."],"tests":[{"type":"click","selector":".check-sessions"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"text","selector":".late-message","value":"Проверяем места..."},{"type":"log","value":"Проверки запущены"},{"type":"notLog","value":"21:45: ответ получен"},{"type":"notLog","value":"19:30: ответ получен"},{"type":"disabled","selector":".check-sessions","value":true},{"type":"wait","ms":1000},{"type":"text","selector":".late-message","value":"Места есть"},{"type":"text","selector":".evening-message","value":"Проверяем места..."},{"type":"logOrder","values":["Проверки запущены","21:45: ответ получен"]},{"type":"wait","ms":1400},{"type":"text","selector":".evening-message","value":"Мест нет"},{"type":"logOrder","values":["Проверки запущены","21:45: ответ получен","19:30: ответ получен"]},{"type":"disabled","selector":".check-sessions","value":false}],"mode":"two","theory":{"theory":"<p>Когда вторая проверка не зависит от первой, её можно начать сразу. Если её вызов находится внутри первого таймера, мы сами создаём лишнее ожидание.<\/p><p>Два соседних вызова начинают проверки подряд и позволяют их ожиданиям перекрываться.<\/p>","example":"function startFirst() {\n  setTimeout(() => {\n    console.log(\"Первый ответ\");\n  }, 1400);\n}\nfunction startSecond() {\n  setTimeout(() => {\n    console.log(\"Второй ответ\");\n  }, 400);\n}\nstartFirst();\nstartSecond();\n","result":"Обе проверки начнутся подряд. Сначала появится «Второй ответ», позже — «Первый ответ».","breakdown":"<p>Вызовы внизу стоят рядом. Выполнив планирование первой проверки, программа может сразу выполнить планирование второй.<\/p><p>Если поместить <code>startSecond()<\/code> внутрь первого таймера, вторая проверка начнётся только после первого ответа. Это другая последовательность действий.<\/p><p>Ожидания могут идти вместе. Сами вызовы функций JavaScript при этом обрабатываются последовательно.<\/p>","question":"Когда действительно нужно запускать второе действие после первого ответа?","answer":"Когда второму действию нужны данные из первого ответа. В наших двух независимых проверках такой зависимости нет."},"example":"function startFirst() {\n  setTimeout(() => {\n    console.log(\"Первый ответ\");\n  }, 1400);\n}\nfunction startSecond() {\n  setTimeout(() => {\n    console.log(\"Второй ответ\");\n  }, 400);\n}\nstartFirst();\nstartSecond();\n","result":"Обе проверки начнутся подряд. Сначала появится «Второй ответ», позже — «Первый ответ».","explanation":"<p>Вызовы внизу стоят рядом. Выполнив планирование первой проверки, программа может сразу выполнить планирование второй.<\/p><p>Если поместить <code>startSecond()<\/code> внутрь первого таймера, вторая проверка начнётся только после первого ответа. Это другая последовательность действий.<\/p><p>Ожидания могут идти вместе. Сами вызовы функций JavaScript при этом обрабатываются последовательно.<\/p>","question":"Когда действительно нужно запускать второе действие после первого ответа?","answer":"Когда второму действию нужны данные из первого ответа. В наших двух независимых проверках такой зависимости нет."}]</script>

  function highlightJS(value,lang='js'){
    const re=lang==='js'
      ? /\/\/[^\n]*|\/\*[\s\S]*?\*\/|`(?:\\.|[^`\\])*`|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|\b(?:const|let|function|return|if|else|true|false|document|console|null|setTimeout|addEventListener|disabled)\b|\b\d+\b|\b[A-Za-z_$][\w$]*(?=\s*\()/g
      : lang==='html'? /<\/?[A-Za-z][\w:-]*|\b[\w-]+(?=\s*=)|"[^"\n]*"|'[^'\n]*'|\/?\>/g
      : /\/\*[\s\S]*?\*\/|#[\da-fA-F]{3,8}\b|--[\w-]+|[\w-]+(?=\s*:)|\b\d+(?:px|rem|em|%|vh|vw)?\b/g;
    let result='',last=0;
    for(const m of value.matchAll(re)){
      result+=esc(value.slice(last,m.index));
      const t=m[0];
      let type=/^(\/\/|\/\*)/.test(t)?'comment':/^['"`]/.test(t)?'string':/^\d/.test(t)?'number':/^(const|let|function|return|if|else|true|false|document|console|null|setTimeout|addEventListener|disabled)$/.test(t)?'keyword':'func';
      if(lang==='html'&&t.startsWith('<'))type='tag';
      if(lang==='css'&&t.startsWith('#'))type='number';
      result+=`<span class="syn-${type}">${esc(t)}</span>`;
      last=m.index+t.length;
    }
    return result+esc(value.slice(last))+'\n';
  }

  function diffLines(original,updated){
    const a=original.trimEnd().split('\n'),b=updated.trimEnd().split('\n');
    const dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
    for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)
      dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const lines=[];let i=0,j=0;
    while(j<b.length){
      if(i<a.length&&a[i]===b[j]){i++;j++;}
      else if(i<a.length&&dp[i+1][j]>=dp[i][j+1])i++;
      else {if(b[j].trim())lines.push(j+1);j++;}
    }
    return lines;
  }

  function buildIframe(userCode,token){
    const stage=current();
    const layout=layoutForStage(stage);
    const safeCode=userCode.replace(/<\/script/ig,'<\\/script');
    const bootstrap=`
      (() => {
        const TOKEN=${JSON.stringify(token)};
        const captured=[];
        const emit=(type,payload={})=>parent.postMessage({from:'seans-frame',type,token:TOKEN,...payload},'*');
        const rawLog=console.log.bind(console);
        console.log=(...args)=>{const msg=args.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ');captured.push(msg);emit('log',{message:msg});rawLog(...args);};
        window.addEventListener('error',e=>{emit('error',{message:e.message||'Ошибка JavaScript'});});
        function q(s){return document.querySelector(s);}
        function elementLabel(selector){
          return {'.evening-message':'сообщение сеанса 19:30','.late-message':'сообщение сеанса 21:45',
            '.check-sessions':'Проверить места'}[selector]||selector;
        }
        function validate(op){
          const el=op.selector?q(op.selector):null;
          if(op.type==='click'){
            if(!el)throw new Error('На странице не найдена кнопка «'+elementLabel(op.selector)+'»');
            if(el.disabled)throw new Error('Кнопка «'+elementLabel(op.selector)+'» пока недоступна');
            el.click();return;
          }
          if(op.type==='wait')return new Promise(r=>setTimeout(r,op.ms));
          if(op.type==='log'){
            if(!captured.includes(op.value))throw new Error('В консоли не появилось ожидаемое сообщение: '+op.value);
            return;
          }
          if(op.type==='notLog'){
            if(captured.includes(op.value))throw new Error('Сообщение появилось слишком рано: '+op.value);
            return;
          }
          if(op.type==='logOrder'){
            let pos=-1;
            for(const msg of op.values){const next=captured.findIndex((v,i)=>i>pos&&v===msg);
              if(next<0)throw new Error('Проверьте порядок сообщений в консоли');pos=next;}
            return;
          }
          if(!el)throw new Error('На странице не найден элемент: '+elementLabel(op.selector));
          if(op.type==='text'&&el.textContent.trim()!==op.value)throw new Error('Проверьте: '+elementLabel(op.selector)+': сейчас «'+el.textContent.trim()+'»');
          if(op.type==='disabled'&&el.disabled!==op.value)throw new Error('Проверьте, когда кнопка «'+elementLabel(op.selector)+'» должна быть '+(op.value?'недоступной':'доступной'));
          if(op.type==='class'&&!el.classList.contains(op.value))throw new Error('Элемент «'+elementLabel(op.selector)+'» должен получить класс '+op.value);
          if(op.type==='notClass'&&el.classList.contains(op.value))throw new Error('Элемент «'+elementLabel(op.selector)+'» не должен содержать класс '+op.value);
          if(op.type==='value'&&el.value!==op.value)throw new Error('Проверьте значение поля '+op.selector);
        }
        window.addEventListener('message',async(e)=>{
          if(e.source!==parent||e.data?.type!=='seans-run-check'||e.data.token!==TOKEN)return;
          try {for(const op of e.data.tests){await validate(op);}emit('result',{passed:true});}
          catch(error){emit('result',{passed:false,message:error.message});}
        });
        window.__seansReady=()=>emit('ready');
      })();`;
    const codeScript=`\ntry {\n${safeCode}\n} catch(__e){parent.postMessage({from:'seans-frame',type:'error',token:${JSON.stringify(token)},message:__e.message},'*');}\nwindow.__seansReady();`;
    return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${previewData.css}</style></head><body><div class="frame">${layout}</div><script>${bootstrap}<\/script><script>${codeScript}<\/script></body></html>`;
  }

      <div class="skills">
        <div class="skill"><strong>Обычный порядок</strong><p>Синхронные команды выполняются последовательно. Тело обычной функции выполняется в месте её вызова.</p></div>
        <div class="skill"><strong>Асинхронное ожидание</strong><p>Обработчик ждёт события. Функция таймера ждёт позднего вызова. Обычный код ниже может выполниться раньше.</p></div>
        <div class="skill"><strong>Действие после ответа</strong><p>Команду, зависящую от результата ожидания, помещаем внутрь отложенной функции.</p></div>
        <div class="skill"><strong>Независимые проверки</strong><p>Их можно начать подряд. Порядок запуска не гарантирует такой же порядок получения ответов.</p></div>
      </div>
      <h3>Вопросы для закрепления</h3>
      <details class="review-question"><summary>Почему команда ниже setTimeout() может выполниться раньше команды внутри него?</summary><p>Сам вызов setTimeout() только планирует функцию. Затем программа продолжает обычный код. Переданная функция будет вызвана позже.</p></details>
      <details class="review-question"><summary>Когда выполняется тело обычной синхронной функции?</summary><p>В месте её вызова. Оно выполняется до перехода к следующей обычной команде после вызова.</p></details>
      <details class="review-question"><summary>Куда поместить команду, которая должна дождаться ответа?</summary><p>Внутрь отложенной функции, вызываемой после ожидания. Расположение после вызова таймера ожидания не создаёт.</p></details>
      <details class="review-question"><summary>Почему 21:45 может ответить раньше, хотя его проверку запустили второй?</summary><p>Проверки независимы и могут иметь разную задержку. Ожидание позднего показа в нашем примере короче.</p></details>
      <details class="review-question"><summary>Почему вызов второй проверки внутри первого таймера добавляет ожидание?</summary><p>Программа дойдёт до этого вызова только после ожидания первого таймера. Если проверки независимы, оба вызова можно разместить рядом.</p></details>`;
    progress();
  }
  // All controls and navigation are from the supplied shell.
  $('#checkBtn').onclick=runCheck;
  $('#hintBtn').onclick=showHint;
  $('#explainBtn').onclick=showExplanation;
  $('#memoBtn').onclick=showMemo;
  $('#stepsBtn').onclick=showSteps;
  $('#resetStep').onclick=()=>askReset(false);
  $('#resetProgress').onclick=()=>askReset(true);
  $('#closeDialog').onclick=()=>$('#infoDialog').close();
  $('#consoleBtn').onclick=()=>showConsole($('#console').hidden);
  $('#prev').onclick=()=>db.finished?go(db.index):go(db.index-1);
  $('#next').onclick=()=>db.index===steps.length-1?finish():go(db.index+1);
  const modal=$('#infoDialog');let backdropDown=false;
  const onBackdrop=e=>{const r=modal.getBoundingClientRect();return e.target===modal&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom);};
  modal.addEventListener('pointerdown',e=>{backdropDown=e.button===0&&onBackdrop(e);});
  modal.addEventListener('click',e=>{if(backdropDown&&onBackdrop(e))modal.close();backdropDown=false;});
  modal.addEventListener('close',()=>{backdropDown=false;});
  window.addEventListener('beforeunload',()=>{saveCode();persist();});
  function loadMonaco(){
    if(monacoAPI||monacoPending||typeof window.require!=='function')return;
    monacoPending=true;
    const vs='https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs';
    try{
      window.require.config({paths:{vs}});
      window.MonacoEnvironment={getWorkerUrl:()=> 'data:text/javascript;charset=utf-8,'+encodeURIComponent(`self.MonacoEnvironment={baseUrl:'${vs}/'};importScripts('${vs}/base/worker/workerMain.js');`)};
      window.require(['vs/editor/editor.main'],()=>{
        monacoAPI=window.monaco;monacoPending=false;
        if(!db.finished)makeEditor();
      },()=>{monacoPending=false;});
    }catch {monacoPending=false;}
  }
  window.addEventListener('load',loadMonaco);
  // If CDN is inaccessible, the fully usable syntax-highlighted textarea remains available.
  const restoreFinished=db.finished && db.passed[steps.at(-1).id];
  render();
  if(restoreFinished)finish();
})();
</script>
