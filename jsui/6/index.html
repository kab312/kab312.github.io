<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Модальные окна. Создание, открытие и закрытие</title>
<style>
:root {
  --bg: #f2f5f9;
  --paper: #fff;
  --ink: #203047;
  --muted: #617188;
  --line: #dce3ed;
  --blue: #245fd0;
  --green: #137451;
  --red: #a92b3d;
  --code: #142031;
  --shadow: 0 5px 22px #1c355010;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
}
body {
  height: 100dvh;
  overflow: hidden;
  font:
    15px/1.5 system-ui,
    -apple-system,
    "Segoe UI",
    Arial,
    sans-serif;
  color: var(--ink);
  background: var(--bg);
}
button {
  font: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
button:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid #83a9f3;
  outline-offset: 2px;
}
code,
kbd,
pre {
  font-family: Consolas, "Cascadia Code", monospace;
}
p {
  margin: 0 0 11px;
}
p:last-child {
  margin-bottom: 0;
}
[hidden] {
  display: none !important;
}
#shell {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.top {
  height: 62px;
  flex: none;
  padding: 9px 22px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 800;
  white-space: nowrap;
  font-size: 15px;
}
.logo {
  background: #183357;
  color: #fff;
  border-radius: 8px;
  padding: 6px 9px;
}
.topmeta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
}
.meter {
  width: 110px;
  height: 6px;
  background: #e3eaf5;
  border-radius: 8px;
  overflow: hidden;
}
.meter span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--blue);
  transition: width 0.18s;
}
.btn {
  padding: 9px 12px;
  line-height: 1.16;
  border: 1px solid #d8e0eb;
  border-radius: 8px;
  background: white;
  color: #24415f;
  font-weight: 650;
}
.btn:hover:not(:disabled) {
  background: #eef4ff;
}
.btn.small {
  font-size: 13px;
  padding: 8px 11px;
}
.btn.main {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.btn.main:hover:not(:disabled) {
  background: #194fae;
  color: #fff;
}
.btn.success {
  background: #e8f6ee;
  color: #146242;
  border-color: #bddfc9;
}
.btn.danger {
  color: #9d3a3a;
}
.inner {
  width: 100%;
  max-width: 1640px;
  margin: 0 auto;
  padding: 13px 22px 12px;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.heading h1 {
  font-size: 24px;
  line-height: 1.18;
  margin: 1px 0 0;
  letter-spacing: -0.02em;
}
.lesson-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 9px;
}
.brief,
.task {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 9px;
  min-width: 0;
  padding: 11px 13px;
  max-height: 165px;
  overflow: auto;
  font-size: 15px;
  line-height: 1.5;
}
.brief {
  color: #344961;
}
.task {
  border-color: #cadbf2;
  border-left: 3px solid var(--blue);
}
.task-label {
  font-size: 13px;
  font-weight: 800;
  color: #42628e;
  margin-bottom: 4px;
}
.expected {
  font-size: 13px;
  margin-top: 8px;
  color: #2e6c55;
}
.expected strong {
  font-weight: 800;
}
.lesson-top code,
.dialog-content p code,
.dialog-content li code {
  background: #e7eef9;
  padding: 1px 4px;
  border-radius: 4px;
  overflow-wrap: anywhere;
}
.workgrid {
  flex: 1;
  min-height: 200px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
}
.workcard {
  min-height: 0;
  min-width: 0;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 12px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cardbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 43px;
  padding: 6px 10px;
  background: #fafcff;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.filetabs {
  display: flex;
  align-items: center;
  gap: 4px;
}
.filetab {
  font:
    13px Consolas,
    monospace;
  border: 0;
  border-radius: 6px;
  padding: 7px 10px;
  background: transparent;
  color: #60748c;
}
.filetab[aria-selected="true"] {
  font-weight: 800;
  color: #2459b2;
  background: #e3ecfb;
}
.editorwrap {
  position: relative;
  background: var(--code);
  flex: 1;
  min-height: 110px;
  overflow: hidden;
}
.fallback {
  position: absolute;
  inset: 0;
  display: block;
  color: #dce7f5;
  font:
    14px/22px Consolas,
    "Cascadia Code",
    monospace;
}
.fallback-gutter {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 42px;
  z-index: 2;
  background: #1c2a3e;
  color: #8597b2;
  padding: 12px 7px;
  text-align: right;
  white-space: pre;
  user-select: none;
  overflow: hidden;
}
.highlight-scroller {
  position: absolute;
  inset: 0 0 0 42px;
  overflow: hidden;
  pointer-events: none;
}
.highlight-pre {
  font: inherit;
  line-height: 22px;
  margin: 0;
  padding: 12px 14px;
  tab-size: 2;
  white-space: pre;
  min-width: max-content;
}
.fallback-textarea {
  position: absolute;
  inset: 0 0 0 42px;
  width: calc(100% - 42px);
  height: 100%;
  z-index: 3;
  resize: none;
  border: 0;
  outline: 0 !important;
  background: transparent;
  color: transparent;
  -webkit-text-fill-color: transparent;
  caret-color: #fff;
  font: inherit;
  line-height: 22px;
  tab-size: 2;
  white-space: pre;
  padding: 12px 14px;
  overflow: auto;
}
.fallback-textarea::selection {
  background: #5b83bb99;
}
.fallback-textarea[readonly] {
  cursor: default;
}
.monaco-host {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 4;
}
.monaco-host.ready {
  display: block;
}
.syn-comment {
  color: #91a5c0;
}
.syn-string {
  color: #b2e6a4;
}
.syn-keyword {
  color: #c9b6fc;
}
.syn-number {
  color: #edc691;
}
.syn-tag,
.syn-property {
  color: #8cd2fa;
}
.syn-attr {
  color: #e0b98e;
}
.actions {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 11px;
  flex: none;
  flex-wrap: wrap;
}
.edit-note {
  font-size: 12px;
  color: var(--muted);
  margin-left: auto;
}
.feedback {
  background: #f6f9fe;
  color: #3e5876;
  padding: 9px 12px;
  min-height: 41px;
  max-height: 76px;
  overflow: auto;
  border-top: 1px solid var(--line);
  font-size: 14px;
  flex: none;
}
.feedback.good {
  background: #eaf8f0;
  color: #166243;
}
.feedback.bad {
  background: #fff0ef;
  color: #9e2635;
}
.hint {
  flex: none;
  max-height: 170px;
  overflow: auto;
  padding: 11px 13px;
  background: #edf4ff;
  border-top: 1px solid #cfddf2;
  font-size: 14px;
}
.hint pre {
  white-space: pre-wrap;
  font:
    14px/1.5 Consolas,
    monospace;
  color: #183961;
  margin: 8px 0 0;
  background: none;
}
.hint strong {
  color: #234c86;
}
.preview-frame {
  border: 0;
  display: block;
  flex: 1;
  width: 100%;
  min-height: 120px;
  background: #111411;
}
.preview-note {
  flex: none;
  background: #fafcff;
  border-top: 1px solid var(--line);
  color: #546a83;
  padding: 7px 10px;
  font-size: 13px;
}
.runtime-errors {
  flex: none;
  background: #fff1ef;
  color: #a32735;
  padding: 8px 11px;
  font-size: 13px;
  max-height: 85px;
  overflow: auto;
}
.console {
  flex: none;
  max-height: 125px;
  overflow: auto;
  margin: 0;
  padding: 9px 11px;
  background: #192638;
  color: #cfe1f8;
  font:
    12px/1.5 Consolas,
    monospace;
  white-space: pre-wrap;
}
.nav {
  flex: none;
  height: 61px;
  background: #fff;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 9px 18px;
}
.nav-controls {
  display: grid;
  grid-template-columns: 1fr 1.75fr 1fr;
  gap: 11px;
  width: min(100%, 510px);
}
.nav-controls .btn {
  min-width: 0;
}
.nav-controls.at-finish {
  display: flex;
  width: auto;
  justify-content: center;
}
.nav-controls.at-finish #prev {
  min-width: 190px;
  white-space: nowrap;
}
.finish {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px;
  flex: 1;
  min-height: 0;
  overflow: auto;
}
.finish h2 {
  margin: 0 0 9px;
  font-size: 24px;
}
.finish h3 {
  font-size: 18px;
  margin: 20px 0 11px;
}
.finish p {
  max-width: 820px;
}
.skills {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  max-width: 850px;
  margin: 20px 0;
}
.skill {
  padding: 13px 15px;
  background: #f1f6fd;
  border-radius: 8px;
}
.skill code {
  display: inline;
  color: #2760a3;
  font-size: 14px;
  margin: 0;
}
.skill > code:first-child {
  display: block;
  margin-bottom: 4px;
}
.review-question {
  border: 1px solid var(--line);
  background: #fafcff;
  border-radius: 8px;
  margin: 8px 0;
  padding: 12px 15px;
  max-width: 850px;
}
.review-question summary {
  cursor: pointer;
  font-weight: 700;
}
.review-question p {
  margin-top: 10px;
}
.return-btn {
  margin-top: 17px;
}
.dialog {
  border: 1px solid #d1ddeb;
  border-radius: 14px;
  padding: 0;
  width: min(750px, calc(100vw - 28px));
  max-height: calc(100dvh - 32px);
  box-shadow: 0 22px 95px #10264253;
  color: var(--ink);
}
.dialog::backdrop {
  background: #13263e80;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 15px 20px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: white;
  z-index: 1;
}
.dialog-head h2 {
  font-size: 19px;
  margin: 0;
}
.dialog-content {
  padding: 19px 22px;
  font-size: 16px;
  line-height: 1.65;
  overflow: auto;
}
.dialog-content h3 {
  font-size: 17px;
  margin: 19px 0 7px;
}
.dialog-content h3:first-child {
  margin-top: 0;
}
.dialog-content pre {
  font:
    15px/1.55 Consolas,
    monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #18283f;
  color: #e0eafa;
  padding: 14px;
  border-radius: 8px;
}
.dialog-content ul {
  padding-left: 23px;
}
.dialog-content li {
  margin: 5px 0;
}
.understanding {
  margin-top: 18px;
  padding: 13px 15px;
  background: #f2f6fd;
  border-radius: 8px;
}
.understanding strong {
  display: block;
  margin-bottom: 6px;
}
.understanding details summary {
  cursor: pointer;
  color: #245da6;
  font-weight: 700;
}
.understanding details p {
  margin: 10px 0 0;
}
.step-list {
  display: grid;
  gap: 7px;
}
.step-group {
  font-size: 13px;
  color: #42648c;
  font-weight: 800;
  margin: 13px 0 3px;
}
.step-link {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: #27445f;
  padding: 10px 12px;
  font-size: 14px;
}
.step-link.current {
  border-color: #7aa2de;
  background: #f0f6ff;
}
.step-link.done {
  border-color: #b5dac4;
  background: #eff9f2;
}
.step-link:disabled {
  opacity: 0.5;
}
.step-link span:first-child {
  min-width: 24px;
  font-weight: 800;
}
.step-link span:nth-child(2) {
  flex: 1;
}
.step-status {
  font-size: 12px;
  color: #15754b;
}
.example-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.example-list > div {
  background: #f3f7fc;
  padding: 10px;
  border-radius: 8px;
}
#editorOverlays {
  position: fixed;
  inset: 0;
  z-index: 45;
  pointer-events: none;
  background: transparent !important;
}
#editorOverlays .editor-widget,
#editorOverlays .suggest-details-container,
#editorOverlays .monaco-hover,
#editorOverlays .parameter-hints-widget {
  pointer-events: auto;
}
@media (max-height: 780px) and (min-width: 761px) {
  .top {
    height: 54px;
  }
  .inner {
    padding-top: 9px;
    gap: 8px;
  }
  .lesson-top {
    margin-top: 7px;
  }
  .heading h1 {
    font-size: 22px;
  }
  .brief,
  .task {
    max-height: 136px;
    font-size: 14px;
    padding: 8px 11px;
  }
  .nav {
    height: 54px;
  }
  .cardbar {
    min-height: 38px;
    padding: 5px 9px;
  }
  .actions {
    padding: 6px 9px;
  }
  .feedback {
    padding: 6px 10px;
    min-height: 36px;
  }
  .topmeta {
    gap: 7px;
  }
}
@media (max-width: 950px) and (min-width: 761px) {
  .top {
    padding-inline: 14px;
  }
  .inner {
    padding-inline: 14px;
  }
  .meter {
    width: 66px;
  }
  .brand {
    font-size: 13px;
  }
  .btn.small {
    padding: 7px 8px;
  }
  .heading h1 {
    font-size: 21px;
  }
  .brief,
  .task {
    font-size: 13px;
  }
  .filetab {
    font-size: 12px;
    padding: 6px;
  }
}
@media (max-width: 760px) {
  body {
    height: auto;
    min-height: 100dvh;
    overflow: auto;
  }
  .top {
    height: auto;
    min-height: 58px;
    padding: 10px 12px;
    flex-wrap: wrap;
  }
  .topmeta {
    margin-left: 0;
    width: 100%;
    flex-wrap: wrap;
    gap: 7px;
  }
  .brand {
    font-size: 14px;
  }
  .meter {
    width: 64px;
  }
  .inner {
    padding: 12px;
    gap: 10px;
  }
  .heading h1 {
    font-size: 22px;
  }
  .lesson-top {
    grid-template-columns: 1fr;
    gap: 9px;
  }
  .brief,
  .task {
    max-height: none;
  }
  .workgrid {
    display: flex;
    flex-direction: column;
  }
  .workcard {
    height: 400px;
    flex: none;
  }
  .editorwrap {
    min-height: 200px;
  }
  .workcard.preview-card {
    height: 470px;
  }
  .nav {
    position: sticky;
    bottom: 0;
    z-index: 5;
    height: auto;
    min-height: 56px;
    padding: 9px;
  }
  .nav-controls {
    gap: 7px;
  }
  .nav-controls .btn {
    font-size: 12px;
    padding: 9px 6px;
  }
  .edit-note {
    font-size: 11px;
  }
  .dialog-content {
    padding: 16px 15px;
  }
  .skills,
  .example-list {
    grid-template-columns: 1fr;
  }
  .cardbar {
    gap: 4px;
    padding: 5px 6px;
  }
  .filetabs {
    gap: 1px;
  }
  .filetab {
    font-size: 11px;
    padding: 7px 5px;
  }
  #resetStep {
    font-size: 11px;
    padding: 7px 6px;
    white-space: nowrap;
  }
}

/* Чтение объяснений и памятки */
.dialog-content pre {
  tab-size: 2;
  line-height: 1.6;
}
.dialog-content pre code {
  display: block;
  font: inherit;
  line-height: inherit;
  background: transparent;
  color: inherit;
  padding: 0;
  border-radius: 0;
}
.lesson-theory p code,
.lesson-theory li code,
.modal-memo p code,
.modal-memo td code,
.modal-memo dt code,
.modal-memo dd code {
  font-size: 0.94em;
  background: #e8eef8;
  color: #234d7a;
  padding: 1px 4px;
  border-radius: 4px;
  overflow-wrap: anywhere;
}
.lesson-theory .code-breakdown {
  padding-left: 22px;
  margin: 10px 0 18px;
}
.lesson-theory .code-breakdown li {
  margin: 10px 0;
  padding-left: 3px;
}
.lesson-theory .theory-check {
  border-left: 3px solid #92b4e4;
  background: #f5f8fd;
  padding: 13px 16px;
  margin-top: 20px;
  border-radius: 0 8px 8px 0;
}
.lesson-theory .theory-check h3,
.lesson-theory .understanding h3 {
  margin-top: 0;
}
.lesson-theory .understanding {
  padding: 15px 16px;
  margin-top: 18px;
}
.memo-table-wrap {
  overflow-x: auto;
  margin: 12px 0 22px;
}
.memo-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  line-height: 1.6;
}
.memo-table th,
.memo-table td {
  text-align: left;
  vertical-align: top;
  padding: 11px 12px;
  border: 1px solid #dce3ed;
  overflow-wrap: anywhere;
}
.memo-table th {
  background: #f0f4fb;
  font-weight: 750;
  color: #324e70;
}
.memo-table td:first-child {
  width: 38%;
}
.memo-section {
  border: 1px solid #dce3ed;
  border-radius: 9px;
  margin: 12px 0;
  background: white;
  overflow: hidden;
}
.memo-section > summary {
  cursor: pointer;
  font-weight: 700;
  color: #254f7b;
  padding: 13px 15px;
  background: #f7f9fd;
}
.memo-section[open] > summary {
  border-bottom: 1px solid #dce3ed;
}
.memo-section-body {
  padding: 15px 16px;
}
.memo-section-body > pre:first-child {
  margin-top: 0;
}
.memo-definitions {
  margin: 0;
}
.memo-definitions dt {
  font-weight: 700;
  margin: 17px 0 5px;
}
.memo-definitions dt:first-child {
  margin-top: 0;
}
.memo-definitions dd {
  margin: 0;
  color: #3e526b;
}
@media (max-width: 760px) {
  .memo-table th,
  .memo-table td {
    padding: 9px 8px;
  }
  .memo-table {
    font-size: 14px;
  }
  .memo-section-body {
    padding: 13px 12px;
  }
  .dialog-content pre {
    font-size: 14px;
    padding: 12px;
  }
}

/* Цвета кода на светлом фоне и в тёмных блоках. */
:is(.dialog-content, .hint, .brief, .task) {
  --code-string: #2d6b36;
  --code-keyword: #7041a5;
  --code-func: #165f98;
  --code-comment: #63738a;
  --code-tag: #165f98;
  --code-number: #99600b;
  --code-attr: #875018;
}
.dialog-content pre {
  --code-string: #addc9b;
  --code-keyword: #c4b0f7;
  --code-func: #87d1f6;
  --code-comment: #a7b5c9;
  --code-tag: #87d1f6;
  --code-number: #efc792;
  --code-attr: #edc691;
}
.syn-func {
  color: #87d1f6;
}

n          \u003cspan class=\"identity-name\">СЦЕНА\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"header-meta\">Живые события рядом\u003c/div>\n      \u003c/header>\n      \u003cmain>\n        \u003csection class=\"hero\">\n          \u003cdiv class=\"hero-copy\">\n            \u003cp class=\"kicker\">Ближайший концерт\u003c/p>\n            \u003ch1>\n              ЗВУК,\n              \u003cbr>\n              КОТОРЫЙ\n              \u003cbr>\n              \u003cspan class=\"lime\">ЧУВСТВУЕШЬ.\u003c/span>\n            \u003c/h1>\n            \u003cp class=\"lead\">\n              Два выступления за один вечер. Живой звук, близкая сцена и музыка, которую\n              хочется слушать не в наушниках.\n            \u003c/p>\n            \u003cdiv class=\"hero-action\">\n              \u003cbutton class=\"cta open-modal\" type=\"button\">Посмотреть программу\u003c/button>\n              \u003cspan class=\"action-note\">Суббота, открытие дверей в 19:00\u003c/span>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"feature\">\n            \u003cimg src=\"assets/concert.jpg\" alt=\"Зрители на живом концерте\">\n            \u003cdiv class=\"feature-top\">\n              \u003cspan class=\"category\">Живой концерт\u003c/span>\n              \u003cspan class=\"date\">\n                \u003cstrong>07\u003c/strong>\n                НОЯБ\n              \u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"feature-bottom\">\n              \u003cp class=\"event-type\">Музыкальный вечер\u003c/p>\n              \u003ch2>\n                Ближе к сцене.\n                \u003cbr>\n                Ближе к музыке.\n              \u003c/h2>\n              \u003cp>Концерт начнётся в 19:30\u003c/p>\n            \u003c/div>\n          \u003c/div>\n        \u003c/section>\n        \u003csection class=\"details\">\n          \u003cdiv class=\"detail\">\n            \u003cspan>Когда\u003c/span>\n            \u003cstrong>7 ноября, суббота\u003c/strong>\n          \u003c/div>\n          \u003cdiv class=\"detail\">\n            \u003cspan>Начало концерта\u003c/span>\n            \u003cstrong>19:30\u003c/strong>\n          \u003c/div>\n          \u003cdiv class=\"detail\">\n            \u003cspan>Формат\u003c/span>\n            \u003cstrong>Два живых выступления\u003c/strong>\n          \u003c/div>\n        \u003c/section>\n      \u003c/main>\n    \u003c/div>\n    \u003c!-- МОДАЛЬНОЕ ОКНО: вставляйте разметку перед подключением script.js -->\n    __MODAL__\n    \u003cscript src=\"script.js\">\u003c/script>\n  \u003c/body>\n\u003c/html>\n","baseCss":":root {\n  --bg: #111411;\n  --panel: #181c18;\n  --paper: #f4f4eb;\n  --ink: #171c17;\n  --light: #f7f8f0;\n  --lime: #daf66e;\n  --muted: #b5bdb2;\n  --line: #343a33;\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--light);\n  font:\n    16px/1.45 \"Arial\",\n    \"Helvetica Neue\",\n    system-ui,\n    sans-serif;\n  -webkit-font-smoothing: antialiased;\n}\n\nbutton {\n  font: inherit;\n  cursor: pointer;\n}\n\nbutton:focus-visible {\n  outline: 3px solid var(--lime);\n  outline-offset: 4px;\n}\n\n.site {\n  max-width: 1500px;\n  margin: 0 auto;\n  padding: 0 clamp(28px, 5vw, 88px);\n}\n\n.site-header {\n  height: 94px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  border-bottom: 1px solid var(--line);\n  gap: 24px;\n}\n\n.identity {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  color: var(--light);\n}\n\n.identity-symbol {\n  display: grid;\n  place-items: center;\n  background: var(--lime);\n  color: var(--ink);\n  font-size: 22px;\n  line-height: 1;\n  font-weight: 900;\n  border-radius: 10px;\n  width: 39px;\n  height: 39px;\n  letter-spacing: -0.08em;\n}\n\n.identity-name {\n  font-size: 25px;\n  font-weight: 900;\n  letter-spacing: -0.085em;\n  line-height: 1;\n}\n\n.header-meta { th=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 9h14l-1 11H6L5 9Z\"/>\u003cpath d=\"M9 9V7a3 3 0 0 1 6 0v2\"/>\u003cpath d=\"M10 14h4\"/>\u003c/svg>\u003c/div>\n          \u003ch2>Корзина пуста\u003c/h2>\n          \u003cp>Здесь появятся товары, которые вы добавите для покупки.\u003c/p>\n        \u003c/div>\n      \u003c/section>\n      \u003caside class=\"summary\" aria-label=\"Сводка заказа\">\n        \u003cdiv class=\"summary-head\">\u003ch2>Ваш заказ\u003c/h2>\u003cspan class=\"summary-tag\">FORMA\u003c/span>\u003c/div>\n        \u003cdiv class=\"summary-line\">\u003cspan>Товары\u003c/span>\u003cstrong class=\"items-count\">2 шт.\u003c/strong>\u003c/div>\n        \u003cdiv class=\"summary-line\">\u003cspan>Доставка\u003c/span>\u003cstrong>При оформлении\u003c/strong>\u003c/div>\n        \u003cdiv class=\"summary-rule\">\u003c/div>\n        \u003cdiv class=\"total-label\">Стоимость товаров\u003c/div>\n        \u003cdiv class=\"total-price\">19 800 ₽\u003c/div>\n        \u003cp class=\"summary-caption\">Итоговая стоимость доставки рассчитывается отдельно.\u003c/p>\n        \u003cbutton class=\"clear-cart\" type=\"button\">Очистить корзину\n          \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14m-6-6 6 6-6 6\"/>\u003c/svg>\n        \u003c/button>\n        \u003cdiv class=\"summary-foot\">Вы можете изменить состав заказа\u003c/div>\n      \u003c/aside>\n    \u003c/div>\n    \u003cdiv class=\"feature-line\">\u003cstrong>FORMA — звук без лишнего.\u003c/strong>\u003cspan>Наушники и колонки для вашего ритма\u003c/span>\u003c/div>\n  \u003c/main>\n\n  \u003cdiv class=\"modal-overlay is-hidden\" role=\"presentation\">\n    \u003cdiv class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title\" aria-describedby=\"modal-description\">\n      \u003cbutton class=\"modal-close\" type= id;\n  place-items: center;\n  background: var(--soft-blue);\n  color: var(--blue);\n  border-radius: 20px;\n  margin-bottom: 25px;\n}\n.empty-icon svg {\n  width: 34px;\n  height: 34px;\n}\n.empty-state h2 {\n  font-size: 37px;\n  letter-spacing: -0.05em;\n  margin: 0 0 12px;\n}\n.empty-state p {\n  margin: 0;\n  color: #81858a;\n  max-width: 290px;\n  line-height: 1.55;\n}\n.feature-line {\n  margin-top: 30px;\n  padding-top: 22px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  border-top: 1px solid #deddd8;\n  font-size: 12px;\n  color: #85888c;\n  gap: 14px;\n}\n.feature-line strong {\n  color: #5d6268;\n  font-weight: 750;\n}\n/* Готовое модальное окно. Студенты управляют им из script.js. */\n.modal-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 100;\n  display: grid;\n  place-items: center;\n  padding: 22px;\n  background: rgba(11, 19, 32, 0.57);\n  -webkit-backdrop-filter: blur(7px);\n  backdrop-filter: blur(7px);\n}\n.modal {\n  background: #fff;\n  border-radius: 22px;\n  padding: 36px;\n  width: min(100%, 470px);\n  box-shadow: 0 36px 120px rgba(0, 0, 0, 0.23);\n  position: relative;\n}\n.modal-close {\n  border: 0;\n  background: #f2f2f0;\n  color: #585d65;\n  width: 36px;\n  height: 36px;\n  display: grid;\n  place-items: center;\n  border-radius: 50%;\n  position: absolute;\n  right: 20px;\n  top: 20px;\n}\n.modal-close:hover {\n  background: #e5e7eb;\n}\n.modal-close svg {\n  width: 18px;\n  height: 18px;\n}\n.modal-icon {\n  width: 60px;\n  height: 60px;\n  display: grid;\n  place-items: center;\n  border-radius: 18px;\n  background: #fff0eb;\n  color: #d65b40;\n  margin-bottom: 24px;\n}\n.modal-icon svg {\n  width: 27px;\n  height: 27px;\n}\n.modal h2 {\n  margin: 0 0 13px;\n  font-weight: 800;\n  letter-spacing: -0.055em;\n  font-size: 32px;\n  line-height: 1.13;\n}\n.modal p {\n  margin: 0;\n  color: #747980;\n  font-size: 15px;\n  line-height: 1.65;\n  max-width: 350px;\n}\n.modal-actions {\n  display: grid S.push({"id": "s19", "kind": "assignment", "group": "Самостоятельная работа", "file": "js", "title": "Самостоятельная работа: FORMA", "story": "В FORMA подготовлена корзина с наушниками Studio One и колонкой Pocket Sound. HTML, CSS и модальное окно готовы. Работайте только в <code>script.js</code>: переменные для элементов объявлены в начале файла.", "task": "<p>На «4» — очистка корзины. На «5» — удаление наушников через то же окно.</p><div class=\"assignment-actions\"><a class=\"btn small\" data-forma-download download=\"FORMA_practice.zip\">Скачать проект (ZIP)</a></div>", "expected": "После подтверждения нужные товары скрываются, сумма и счётчики обновляются.", "theory": "<div class=\"assignment-condition\">\n<p>HTML, CSS и модальное окно уже подготовлены. Работайте только в файле <code>script.js</code>. Переменные для поиска элементов объявлены в начале файла.</p>\n<p>Можно работать здесь, в VS Code, WebStorm или другом редакторе.</p>\n<h3>Как скрывать и показывать элементы</h3>\n<p>В CSS уже существует класс <code>is-hidden</code>, который скрывает элемент.</p>\n<ul><li><code>classList.add('is-hidden')</code> — скрыть элемент.</li><li><code>classList.remove('is-hidden')</code> — показать элемент.</li></ul>\n<h3>Задание на «4»</h3>\n<h4>1. Открытие модального окна</h4>\n<p>При нажатии на кнопку <code>.clear-cart</code> («Очистить корзину»):</p>\n<ul><li>Уберите класс <code>is-hidden</code> у <code>.modal-overlay</code>.</li><li>Добавьте класс <code>modal-open</code> элементу <code>body</code>, чтобы страница не прокручивалась.</li></ul>\n<h4>2. Закрытие модального окна</h4>\n<p>Закрытие должно работать при нажатии на кнопку <code>.modal-cancel</code> («Оставить»), крестик <code>.modal-close</code> и затемнённую область <code>.modal-overlay</code>.</p>\n<p>При закрытии:</p>\n<ul><li>Добавьте класс <code>is-hidden</code> элементу <code>.modal-overlay</code>.</li><li>Уберите класс <code>modal-open</code> у <code>body</code>.</li><li>При нажатии внутри белого окна < const MODAL_MEMO = "<div class=\"modal-memo\">\n<p>HTML задаёт элементы окна, CSS — его вид и состояния, JavaScript — реакцию на действия посетителя. В этой памятке используются те же классы и переменные, что на странице «СЦЕНА».</p>\n<h3>Какие элементы мы используем</h3>\n<div class=\"memo-table-wrap\"><table class=\"memo-table\"><thead><tr><th>Элемент или класс</th><th>Назначение</th></tr></thead><tbody>\n<tr><td><code>.open-modal</code></td><td>Кнопка «Посмотреть программу». В JavaScript — <code>openButton</code>.</td></tr>\n<tr><td><code>.modal-overlay</code></td><td>Затемнение на весь экран. В JavaScript — <code>modalOverlay</code>.</td></tr>\n<tr><td><code>.modal</code></td><td>Карточка с заголовком, расписанием и кнопками внутри затемнения.</td></tr>\n<tr><td><code>.close-icon</code><br><code>.close-bottom</code></td><td>Крестик и нижняя кнопка. В JavaScript — <code>closeIcon</code> и <code>closeButton</code>. Обе вызывают <code>closeModal</code>.</td></tr>\n<tr><td><code>is-open</code></td><td>Дополнительный класс у затемнения. Включает открытое состояние.</td></tr>\n<tr><td><code>modal-open</code></td><td>Дополнительный класс у <code>body</code>. Блокирует прокрутку фоновой страницы.</td></tr>\n</tbody></table></div>\n<details class=\"memo-section\"><summary>HTML: вложенность элементов</summary><div class=\"memo-section-body\">\n<p>Внешний слой содержит карточку. В карточке находятся шапка, расписание и нижняя часть. Ниже показана одна строка расписания; остальные имеют ту же структуру.</p>\n<pre><code data-lang=\"html\">&lt;div class=\"modal-overlay\"&gt;\n  &lt;div class=\"modal\"&gt;\n    &lt;div class=\"modal-top\"&gt;\n      &lt;div&gt;\n        &lt;p class=\"modal-eyebrow\"&gt;7 ноября, суббота&lt;/p&gt;\n        &lt;h2&gt;Программа вечера&lt;/h2&gt;\n      &lt;/div&gt;\n      &lt;button class=\"close-icon close-modal\"\n        type=\"button\" aria-label=\"Закрыть окно\"&gt;×&lt;/button&gt;\n    &lt;/div&gt;\n    &lt;div class=\"schedule\"&gt;\n      &lt;div class=\"schedule-item\"&gt;\n        &lt;span class=\"schedule-time\"&gt;19:00&lt;/span&gt;\n        &lt;div&gt;\n          &lt;strong&gt;Открытие дверей&lt;/strong&gt;\n          &lt;p&gt;Встречаем гостей&lt;/p&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=\"modal-footer\"&gt;\n      &lt;button class=\"close-bottom close-modal\"\n        type=\"button\"&gt;Закрыть&lt;/button&gt;\n      &lt;span&gt;Начало концерта в 19:30&lt;/span&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;</code></pre>\n<p>Кнопка открытия уже находится на основной странице, вне затемнения. Класс <code>close-modal</code> есть у обеих кнопок закрытия; в нашем коде мы находим их отдельно по <code>.close-icon</code> и <code>.close-bottom</code>.</p>\n</div></details>\n<details class=\"memo-section\"><summary>CSS: положение, видимость и прокрутка</summary><div class=\"memo-section-body\">\n<p>Ниже собраны основные правила, которые управляют окном. Оформление шапки, расписания и кнопок добавляется отдельно.</p>\n<pre><code data-lang=\"css\">.modal-overlay {\n  display: none;\n  position: fixed;\n  inset: 0;\n  z-index: 30;\n  padding: 20px;\n  background: rgba(9, 12, 9, 0.75);\n  backdrop-filter: blur(8px);\n  align-items: center;\n  justify-content: center;\n}\n\n.modal-overlay.is-open {\n  display: flex;\n}\n\n.modal {\n  width: min(100%, 590px);\n  max-height: calc(100dvh - 40px);\n  overflow: auto;\n  padding: 30px 36px;\n  border-radius: 20px;\n  color: #171c17;\n  background: #f4f4eb;\n}\n\nbody.modal-open {\n  overflow: hidden;\n}</code></pre>\n<p><code>display: none</code> скрывает весь внешний слой. Когда на нём появляется <code>is-open</code>, более точный селектор возвращает <code>display: flex</code>. Свойства выравнивания ставят карточку по центру.</p>\n<p><code>position: fixed</code> и <code>inset: 0</code> растягивают затемнение на экран. <code>max-height</code> ограничивает высоту карточки, а <code>overflow: auto</code> сохраняет доступ к длинному содержимому.</p>\n<p><code>overflow: hidden</code> у <code>body.modal-open</code> запрещает прокрутку фоновой страницы на время открытия.</p>\n</div></details>\n<details class=\"memo-section\"><summary>JavaScript: открытие и все способы закрытия</summary><div class=\"memo-section-body\">\n<p>Одна функция открывает окно, вторая закрывает. Разные обработчики вызывают эти функции. Здесь собран код после последнего шага.</p>\n<pre><code data-lang=\"javascript\">const openButton = document.querySelector('.open-modal');\nconst modalOverlay = document.querySelector('.modal-overlay');\nconst closeIcon = document.querySelector('.close-icon');\nconst closeButton = document.querySelector('.close-bottom');\n\nfunction openModal() {\n  modalOverlay.classList.add('is-open');\n  document.body.classList.add('modal-open');\n}\n\nfunction closeModal() {\n  modalOverlay.classList.remove('is-open');\n  document.body.classList.remove('modal-open');\n}\n\nopenButton.addEventListener('click', openModal);\ncloseIcon.addEventListener('click', closeModal);\ncloseButton.addEventListener('click', closeModal);\n\nmodalOverlay.addEventListener('click', function(event) {\n  if (event.target === modalOverlay) {\n    closeModal();\n  }\n});\n\ndocument.addEventListener('keydown', function(event) {\n  if (event.key === 'Escape') {\n    closeModal();\n  }\n});</code></pre>\n<p>В <code>addEventListener</code> передаём готовую функцию без скобок. Внутри обработчика пишем <code>closeModal()</code> со скобками, когда нужно выполнить закрытие прямо сейчас.</p>\n</div></details>\n<details class=\"memo-section\"><summary>Синтаксис, который легко перепутать</summary><div class=\"memo-section-body\">\n<dl class=\"memo-definitions\">\n<dt><code>querySelector('.modal-overlay')</code></dt><dd>Поиск по CSS-селектору. Точка перед именем означает класс. Если подходящего элемента нет, результат — <code>null</code>.</dd>\n<dt><code>classList.add('is-open')</code><br><code>classList.remove('is-open')</code></dt><dd>Добавление и удаление одного класса. Здесь точка перед именем не нужна. Остальные классы элемента сохраняются.</dd>\n<dt><code>.modal-overlay.is-open</code></dt><dd>Один элемент с двумя классами. Пробела между ними нет.</dd>\n<dt><code>event.target</code></dt><dd>Элемент, на котором начался клик. Сравниваем его с <code>modalOverlay</code>, чтобы клик по содержимому карточки не закрывал окно.</dd>\n<dt><code>event.key === 'Escape'</code></dt><dd>Проверка клавиши в обработчике <code>keydown</code>. Другие клавиши не должны вызывать закрытие.</dd>\n</dl></div></details>\n<details class=\"memo-section\"><summary>Если окно работает неправильно</summary><div class=\"memo-section-body\">\n<dl class=\"memo-definitions\">\n<dt>Окно не открывается</dt><dd>Сверьте классы в HTML и селекторах. Проверьте, что <code>openModal</code> добавляет <code>is-open</code> именно к <code>modalOverlay</code>, а в CSS есть <code>.modal-overlay.is-open</code>.</dd>\n<dt>Окно открывается сразу при загрузке</dt><dd>Проверьте подключение: <code>addEventListener('click', openModal)</code>. Скобки после <code>openModal</code> здесь не нужны. На шаге CSS «Скрываем и показываем окно» открытое состояние демонстрируется автоматически.</dd>\n<dt>Клик по тексту закрывает окно</dt><dd>В обработчике затемнения вызывайте закрытие только внутри условия <code>event.target === modalOverlay</code>.</dd>\n<dt>Escape не срабатывает в предпросмотре</dt><dd>Сначала откройте окно и щёлкните по его тексту. Клавиатурное событие должно поступать в страницу «СЦЕНА». Проверьте написание <code>'Escape'</code>.</dd>\n<dt>После закрытия не возвращается прокрутка</dt><dd>В <code>closeModal</code> должна быть строка <code>document.body.classList.remove('modal-open')</code>.</dd>\n</dl></div></details>\n</div>";

const FORMA_HARNESS=String.raw`
(function(){
 const token='__TOKEN__';
 function send(kind,payload){parent.postMessage({source:'scena-frame',kind,token,...payload},'*');}
 window.addEventListener('error',event=>send('error',{message:event.message||'Ошибка JavaScript'}));
 const originalLog=console.log.bind(console);

function buildFormaPreview(files){
 const css=(files.css+'\n'+FORMA_PREVIEW_CSS).replace(/<\/style/gi,'<\\/style');
 const js=files.js.replace(/<\/script/gi,'<\\/script');
 let html=files.html.replace('<link rel="stylesheet" href="style.css">',`<style>${css}</style>`)
  .replace('<\x73cript src="script.js" defer><\/script>','');
 for(const [name,uri] of Object.entries(FORMA.assets))html=html.replaceAll(`src="${name}"`,`src="${uri}"`);
 const harness=FORMA_HARNESS.replace('__TOKEN__',previewToken);
 return html.replace('</body>',`<\x73cript>${harness}<\/script><\x73cript>${js}<\/script></body>`);
}
function buildPreviewHtml(){
 const files=projectFiles(),stage=state.index+1;
 if(current().kind==='assignment')return buildFormaPreview(files);
 const css=files.css.replace(/<\/style/gi,'<\\/style');
 const js=files.js.replace(/<\/script/gi,'<\\/script');
 let html=files.html.replace('<link rel="stylesheet" href="style.css">',`<style>${css}</style>`);
 html=html.replace('src="assets/concert.jpg"',`src="${DATA.photo}"`);
 if(stage<=5){
  const helperStyle="<style>\n.modal-overlay:not([style]) {\n  max-width: 590px;\n  margin: 28px auto 42px;\n  padding: 17px 20px;\n  border: 2px dashed #a1ba97;\n  border-radius: 12px;\n  color: #172017;\n  background: #f4f4eb;\n}\n.modal-overlay > .modal {\n  min-height: 45px;\n}\n.modal-overlay button {\n  cursor: pointer;\n}\n</style>";
  html=html.replace('</head>',helperStyle+'</head>');
 }
 const token=previewToken;
 const harness=PREVIEW_HARNESS.replace('__TOKEN__',token).replace('__STAGE__',String(stage));
 html=html.replace('<\x73cript src="script.js"><\/script>',`<\x73cript>${harness}<\/script><\x73cript>${js}<\/script>`);
 return html;
}
function renderPreview(forCheck=false){

function appendError(text){
 previewErrors.push(text);
 $('#runtimeErrors').hidden=false;

function applyResult(data){
 clearTimeout(checkTimer);pendingCheck=false;
 $('#checkBtn').disabled=false;
 const runtimeError=previewErrors[0];
 const ok=!!data.ok&&!runtimeError;
 const e=ensureEntry();e.passed=ok;e.draft=projectFiles()[current().file];
 if(ok){state.unlocked=Math.max(state.unlocked,Math.min(S.length-1,state.index+1));feedback(data.message+' Переходите к следующему шагу.','good');}
 else feedback(runtimeError?'Исправьте ошибку JavaScript: '+runtimeError:data.message,'bad');

window.addEventListener('message',(event)=>{
 if(event.source!==$('#preview').contentWindow)return;
 const data=event.data;
 if(!data||data.source!=='scena-frame'||data.token!==previewToken)return;
 if(data.kind==='error'){appendError(data.message);return;}
 if(data.kind==='log'){previewLogs.push(data.message);$('#console').textContent=previewLogs.join('\n');return;}
 if(data.kind==='ready'){
  if(pendingCheck)$('#preview').contentWindow.postMessage({source:'scena-host',kind:'check',token:previewToken},'*');
  return;
 }
 if(data.kind==='result'&&pendingCheck)applyResult(data);
