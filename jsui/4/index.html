            if (this===window) listeners.push("window:"+type);
            if (this===document) listeners.push("document:"+type);
            return originalListen.call(this,type,callback,...options);
          };
        }

function compilePreview(source) {
          try {
            const tree = acorn.parse(source, {ecmaVersion:"latest",sourceType:"script"});
            const positions = new Set();
            const functions = new Set();
            function visit(node, owner = null, parent = null) {
              if (!node || typeof node !== "object") return;
              const isFunction = /^(FunctionDeclaration|FunctionExpression|ArrowFunctionExpression)$/.test(node.type);
              const active = isFunction ? node : owner;
              if (node.type === "CallExpression") {
                const callee = node.callee;
                const name = callee?.type === "Identifier" ? callee.name :
                  callee?.type === "MemberExpression" && callee.object?.name === "window" ?
                    (callee.computed ? callee.property?.value : callee.property?.name) : "";
                if (["prompt","confirm","alert"].includes(name)) {
                  if (parent?.type !== "AwaitExpression") positions.add(node.start);
                  if (active && !active.async) functions.add(active.start);
                }
              }
              for (const [key,value] of Object.entries(node)) {
                if (key === "start" || key === "end") continue;
                if (Array.isArray(value)) value.forEach(child => visit(child,active,node));
                else if (value && typeof value === "object") visit(value,active,node);
              }
            }
            visit(tree);
            const edits = [...positions].map(at=>({at,text:"await "}));
            edits.push(...[...functions].map(at=>({at,text:"async "})));
            edits.sort((a,b)=>b.at-a.at);
            let result = source;
            for (const edit of edits) result=result.slice(0,edit.at)+edit.text+result.slice(edit.at);
            return "(async function(){\n" + result + "\n})().catch(error=>window.dispatchEvent(new ErrorEvent('error',{error,message:error.message})));";
          } catch { return source; }
        }
        function markup(files, config) {
          const doc = new DOMParser().parseFromString(files.html, "text/html");
          const csp = doc.createElement("meta");
          csp.httpEquiv = "Content-Security-Policy";
          csp.content = "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' data:; style-src 'unsafe-inline' data:; img-src data:; font-src data:; base-uri 'none'; form-action 'none'";
          const bridge = doc.createElement("script");
          bridge.textContent = "(" + frameBridge.toString() + ")(" + JSON.stringify(config) + ");";
          for (const link of doc.querySelectorAll('link[rel="stylesheet"]'))
            link.href = "data:text/css;charset=utf-8," + encodeURIComponent(files.css);
          for (const img of doc.querySelectorAll("img[src]")) {
            const asset = assets[img.getAttribute("src")];
            if (asset) img.src = asset;
          }
          for (const script of doc.querySelectorAll("script[src]")) {
            const name=script.getAttribute("src").replace(/^\.\//,"");
            const source=name==="script.js" ? files.js : name==="interface.js" ? files.interface || "" : "";
            const text=name==="script.js" && !config.test ? compilePreview(source) : source;
            script.src="data:text/javascript;charset=utf-8,"+encodeURIComponent(text+"\n//# sourceURL="+name);
          }
          doc.head.prepend(csp,bridge);
          return "<!doctype html>\n"+doc.documentElement.outerHTML;
        }

        function cancelJobs() {

function runFrame(files, test = null) {
          const token="window-events-"+Math.random().toString(36).slice(2)+"-"+Date.now().toString(36);

          if (test) {
            frame.setAttribute("sandbox","allow-scripts");

            frame.tabIndex=-1;
            frame.title="Проверка поведения";
            frame.style.cssText="position:fixed;left:0;top:0;z-index:1;width:"+(test.width || Math.max(320,$("#preview").clientWidth))+"px;height:480px;border:0;opacity:.001;pointer-events:none;";
            document.body.append(frame);
            void frame.offsetWidth;
          } else previewToken=token;

            const timer=setTimeout(()=>{
              jobs.delete(token);
              if(test) frame.remove();
              resolve({timeout:true});
            },test ? 20000 : 6000);
            jobs.set(token,{frame,resolve,timer,hidden:!!test});
          });
          frame.srcdoc=markup(files,{token,test,startAt:test ? null : current().previewStart});
          return promise;
        }

        async function check() {
          if (checking || finished) return;
          persistEditor();
          save();
          const s = current(),
            entry = attempt(),
            myEpoch = epoch;
          const sourceFiles = getFiles(current(), true);
          checking = true;
          $("#checkBtn").disabled = true;
          if (previewDirty) runPreview();
          try {
            const cases = testCases(s.id),
              results = [];
            for (let i = 0; i < cases.length; i++) {
              if (myEpoch !== epoch) return;
              feedback(
                `Проверяем ситуацию ${i + 1} из ${cases.length}: ${cases[i].label}`,
              );
              const r = await runFrame(sourceFiles, cases[i]);
              if (myEpoch !== epoch) return;
              if (r.cancelled) return;
              if (r.timeout) {
                results.push({
                  label: cases[i].label,
                  ok: false,
                  message:
                    "Проверка не получила ответ. Проверьте код на ошибки и бесконечные циклы.",
                });
                break;
              }
              if (r.errors?.length) {
                results.push({
                  label: cases[i].label,
                  ok: false,
                  message: friendlyError(r.errors[0]),
                });
                break;
              }
              const ok = !!cases[i].ok(r);
              results.push({
                label: cases[i].label,
                ok,
                message: ok ? "" : cases[i].why,
              });
            }
            if (myEpoch !== epoch) return;
            entry.checks = results;
            entry.passed =
              results.length === cases.length && results.every((x) => x.ok);
            entry.updated = new Date().toISOString();
            if (entry.passed) entry.verifiedJs=entry.js;
            if (entry.passed)
              db.unlocked = Math.max(
                db.unlocked,
                Math.min(steps.length - 1, db.index + 1),
                firstUnfinishedStep(),
              );
            save();
            progress();
            const failed = results.find((x) => !x.ok);
            feedback(
              entry.passed
                ? (s.kind === "reinforce" ? "Афиша работает. Можно открыть итоги." : "Работает. Можно продолжать.")
                : `${failed?.label || "Проверка"}: ${failed?.message || "Сравните код с условием."}`,
              entry.passed ? "good" : "bad",
            );
          } finally {
            if (myEpoch === epoch) {
              checking = false;
              $("#checkBtn").disabled = false;
            }
          }
        }

              ? "Сбросить прогресс занятия?"
              : "Вернуть исходный код задания?",
            `<p>${all ? "Будут удалены код и результаты всех шагов этого интерактива. Прогресс других занятий сохранится." : "Изменится только текущее задание. Остальные попытки и результаты сохранятся."}</p><div class="result-actions"><button class="btn danger" id="confirmReset">${all ? "Сбросить всё занятие" : "Сбросить это задание"}</button><button class="btn" id="cancelReset">Отмена</button></div>`,
          );
          $("#cancelReset").onclick = () => $("#infoDialog").close();
          $("#confirmReset").onclick = () => {
            clearTimeout(autoTimer);
            clearTimeout(saveTimer);
            epoch++;
            cancelJobs();
            checking = false;
            disposeEditor();
            $("#infoDialog").close();
            if (all) {
              try {
                localStorage.removeItem(STORAGE_KEY);
              } catch {}
              db = fresh();
            } else
              db.entries[current().id] = {
                js: current().starter,
                passed: false,
                checks: [],
                updated: null,
              };
            save();
            render();
          };
        }

        $("#checkBtn").onclick = check;
        $("#hintBtn").onclick = showHint;
        $("#explainBtn").onclick = showExplanation;
        $("#memoBtn").onclick = showMemo;
        $("#stepsBtn").onclick = showSteps;
        $("#experimentBtn").onclick = experiment;
        $("#closeDialog").onclick = () => $("#infoDialog").close();
        $("#consoleBtn").onclick = () => {
          const open = $("#console").hidden;
          $("#console").hidden = !open;
          $("#consoleBtn").setAttribute("aria-expanded", String(open));
        };
        const infoDialog = $("#infoDialog");
        let dialogPressOnBackdrop = false;
        function isDialogBackdrop(event) {
          const bounds = infoDialog.getBoundingClientRect();
          return (
            event.target === infoDialog &&
            (event.clientX < bounds.left ||
              event.clientX >= bounds.right ||
              event.clientY < bounds.top ||
              event.clientY >= bounds.bottom)
          );
        }
        infoDialog.addEventListener("pointerdown", (event) => {
          dialogPressOnBackdrop = event.button === 0 && isDialogBackdrop(event);
        });
        infoDialog.addEventListener("click", (event) => {
          const close = dialogPressOnBackdrop && isDialogBackdrop(event);
          dialogPressOnBackdrop = false;
          if (close) infoDialog.close();
        });
        infoDialog.addEventListener("pointercancel", () => {
          dialogPressOnBackdrop = false;
        });
        infoDialog.addEventListener("close", () => {
          dialogPressOnBackdrop = false;
        });
        $$(".filetab").forEach(
          (b) =>
            (b.onclick = () => {
              persistEditor();
              selectedFile = b.dataset.file;
              makeEditor();
            }),
        );
        $("#prev").onclick = () => {
          if (finished) {
            go(db.index);
            return;
          }
          go(db.index - 1);
        };
        $("#next").onclick = () => {
          if (!attempt().passed) return;
          if (db.index === steps.length - 1) finish();
          else go(db.index + 1);
        };
        $("#resetStep").onclick = () => askReset(false);
        $("#resetProgress").onclick = () => askReset(true);
        window.addEventListener("beforeunload", () => {
          persistEditor();
          save();
        });
        window.addEventListener("resize", () => {
          if (monacoApi && !editorInstance && !finished && innerWidth > 760)
            mountMonaco();
          else if (!monacoApi) loadMonaco();
        });
        migrateStoredCode();
        const restoreFinish = db.finished;
        render();
        if (restoreFinish) finish();
        loadMonaco();
      })();
    </script>
</body>
</html>
