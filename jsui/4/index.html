<script id="lessonData" type="application/json">[{"id":"t1","kind":"learn","title":"Подпишите билет на последний сеанс","file":"js","brief":"\u003cp>Последний сеанс лета — на крыше кинотеатра. Зритель хочет увидеть на билете свой ник вместо слова «Гость». Кнопка уже найдена, а функция ждёт двух команд.\u003c/p>\u003cp>\u003ccode>window.prompt(\"Ваш ник?\")\u003c/code> задаёт вопрос и возвращает ответ. Сохраните его в переменной, затем передайте в знакомое \u003ccode>ticketName.textContent\u003c/code>.\u003c/p>","task":"Внутри \u003ccode>askName\u003c/code> сохраните ответ \u003ccode>window.prompt(\"Как подписать ваш билет?\")\u003c/code> в \u003ccode>visitorName\u003c/code>. Следующей строкой присвойте \u003ccode>visitorName\u003c/code> свойству \u003ccode>ticketName.textContent\u003c/code>. Нажмите «Подписать билет» и введите ник.","expected":"Введённый ник заменяет «Гость». Повторное нажатие позволяет изменить его.","starter":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\n\nfunction askName() {\n  // Сохраните ответ prompt в visitorName.\n  // Покажите visitorName в ticketName.textContent.\n}\n\nnameButton.addEventListener(\"click\", askName);\n","solution":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\n\nfunction askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n  ticketName.textContent = visitorName;\n}\n\nnameButton.addEventListener(\"click\", askName);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>document представляет HTML-страницу. querySelector находит элемент по CSS-селектору. const сохраняет ссылку на элемент: nameButton — кнопка, ticketName — подпись на билете.\u003c/p>\u003cp>window даёт доступ к возможностям окна браузера. prompt — одна из них: запросить текст. В скобках находится вопрос, а результатом вызова будет ответ зрителя.\u003c/p>\u003cp>Присваивание можно читать справа налево: сначала получаем ответ, затем сохраняем его в visitorName. Следующая команда записывает сохранённый текст в билет.\u003c/p>\u003cp>Функция askName выполняется по событию click. Подключение уже написано: addEventListener связывает кнопку, нажатие и функцию. Поэтому вопрос не мешает человеку до нажатия.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>const nameButton = document.querySelector(&quot;.name-button&quot;);\nconst ticketName = document.querySelector(&quot;.ticket-name&quot;);\n\nfunction askName() {\n  const visitorName = window.prompt(&quot;Как подписать ваш билет?&quot;);\n  ticketName.textContent = visitorName;\n}\n\nnameButton.addEventListener(&quot;click&quot;, askName);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>const visitorName = window.prompt(...)\u003c/code>\u003c/dt>\u003cdd>Показываем вопрос и сохраняем ответ в переменной.\u003c/dd>\u003cdt>\u003ccode>ticketName.textContent = visitorName\u003c/code>\u003c/dt>\u003cdd>Выводим ответ в существующем элементе. Знак = присваивает значение.\u003c/dd>\u003cdt>\u003ccode>function askName()\u003c/code>\u003c/dt>\u003cdd>Объединяем команды в действие. Само объявление функции не выполняет их.\u003c/dd>\u003cdt>\u003ccode>nameButton.addEventListener(&quot;click&quot;, askName)\u003c/code>\u003c/dt>\u003cdd>Нажатие вызывает функцию. Её имя передаём без скобок: браузер вызовет её позже.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Нажмите «Подписать билет» и введите «Лис». Повторите с другим ником.\u003c/p>\u003cp>Измените текст вопроса своими словами. Проверьте, что на билете появляется ответ, а не сам вопрос.\u003c/p>\u003cp>Снова нажмите кнопку и отмените ввод. Подпись исчезнет: следующей небольшой правкой исправим этот случай.\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Что будет, если написать prompt перед функцией?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>Запрос откроется при запуске кода, ещё до нажатия. Внутри обработчика зритель сам выбирает момент ввода.\u003c/p>\u003c/details>","hint":"Результат метода можно присвоить переменной так же, как число или строку. Затем переменную можно использовать в textContent.","hintCode":"const visitorName = window.prompt(\"Как подписать ваш билет?\");\n","experiment":null,"previewLabel":"Крыша","previewStart":".cinema-ticket-section","globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"","support":"","history":[],"stage":1,"replaces":[]},{"id":"t2","kind":"learn","title":"Отмена не должна стирать имя","file":"js","brief":"\u003cp>Зритель подписал билет, снова открыл ввод и передумал. После «Отмены» имя исчезло: мы записали ответ, не посмотрев, что вернул запрос.\u003c/p>\u003cp>При отмене \u003ccode>prompt\u003c/code> возвращает \u003ccode>null\u003c/code>. Условие \u003ccode>visitorName !== null\u003c/code> означает «ответ не равен null». Записываем имя только при этом условии.\u003c/p>","task":"Внутри \u003ccode>askName\u003c/code>, после получения ответа, добавьте \u003ccode>if (visitorName !== null)\u003c/code>. Поместите готовую строку изменения имени внутрь фигурных скобок этого \u003ccode>if\u003c/code>. Остальное оставьте как есть.","expected":"Новый ответ меняет имя. Отмена оставляет прежнюю подпись.","starter":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  // Изменяйте имя, только если visitorName не равен null.\n  ticketName.textContent = visitorName;\n}\n\nnameButton.addEventListener(\"click\", askName);\n","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    ticketName.textContent = visitorName;\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>Сначала повторите ошибку: введите «Лис», снова откройте запрос и отмените ввод. Прямое присваивание результата стирает подпись.\u003c/p>\u003cp>null означает, что человек отменил запрос. Это не строка «null» и не пустое поле. В условии пишем null без кавычек.\u003c/p>\u003cp>if разрешает выполнить команды только при верном условии. Здесь !== читается «не равно». Если ответ не null, меняем подпись. Если null, пропускаем эту команду.\u003c/p>\u003cp>Ветка else не нужна: при отмене мы ничего не меняем. Пока рассматриваем только отмену, пустое поле проверим отдельно.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function askName() {\n  const visitorName = window.prompt(&quot;Как подписать ваш билет?&quot;);\n\n  if (visitorName !== null) {\n    ticketName.textContent = visitorName;\n  }\n}\n\nnameButton.addEventListener(&quot;click&quot;, askName);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>visitorName !== null\u003c/code>\u003c/dt>\u003cdd>Проверяем, что зритель подтвердил ввод.\u003c/dd>\u003cdt>\u003ccode>if (...) { ... }\u003c/code>\u003c/dt>\u003cdd>Только команды внутри этих фигурных скобок зависят от условия.\u003c/dd>\u003cdt>\u003ccode>ticketName.textContent = visitorName\u003c/code>\u003c/dt>\u003cdd>Готовая команда перемещается внутрь if. До проверки её быть не должно.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Введите ник. Снова откройте запрос и отмените: ник должен сохраниться.\u003c/p>\u003cp>Повторите ввод с другим ником: условие не должно мешать обычному ответу.\u003c/p>\u003cp>Прочитайте условие вслух: «Если ответ не равен null, изменить подпись».\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Почему проверка после присваивания не спасёт старое имя?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>Присваивание уже изменит подпись. Условие должно стоять до действия, которое оно разрешает.\u003c/p>\u003c/details>","hint":"Откройте фигурную скобку после условия, а закройте после строки textContent. Скобка самой функции остаётся на месте.","hintCode":"if (visitorName !== null) {\n  // Здесь команда изменения подписи.\n}\n","experiment":null,"previewLabel":"Крыша","previewStart":".cinema-ticket-section","globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");","support":"","history":[],"stage":2,"replaces":["t1"]},{"id":"t3","kind":"learn","title":"Пустое поле тоже не имя","file":"js","brief":"\u003cp>Отмена уже безопасна. Но зритель может нажать «Готово» с пустым полем или ввести только пробелы. Прежнее имя должно сохраниться, а под ним появиться просьба ввести текст.\u003c/p>\u003cp>Строка \u003ccode>cleanName\u003c/code> уже подготовлена: \u003ccode>trim()\u003c/code> убирает пробелы по краям. Сравнение \u003ccode>cleanName !== \"\"\u003c/code> проверяет, что строка не пустая. Остальные действия в двух ветках написаны.\u003c/p>","task":"Найдите внутреннее \u003ccode>if (false)\u003c/code> и замените \u003ccode>false\u003c/code> условием \u003ccode>cleanName !== \"\"\u003c/code>. Прочитайте обе ветки: первая обновляет имя, вторая просит ввести текст. Затем проверьте пустое поле и поле с пробелами.","expected":"Пустой ввод сохраняет имя и показывает просьбу. Подходящий ник заменяет подпись и убирает просьбу.","starter":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (false) {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== \"\") {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>Предыдущая проверка уже отделяет отмену от подтверждённого ввода. Внутри неё мы точно работаем со строкой.\u003c/p>\u003cp>Метод trim() возвращает текст без пробелов по краям: «  Лис  » станет «Лис», а несколько пробелов — пустой строкой. Результат заранее сохранён в cleanName.\u003c/p>\u003cp>Внешний if отвечает на вопрос «Ввод не отменён?». Внутренний — «В тексте что-нибудь осталось?». Проверяем по очереди, без объединения условий.\u003c/p>\u003cp>Вся обработка уже написана. Нужно выбрать условие: если текст не пустой, меняем имя и очищаем пояснение. Иначе оставляем имя и показываем просьбу.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function askName() {\n  const visitorName = window.prompt(&quot;Как подписать ваш билет?&quot;);\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== &quot;&quot;) {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = &quot;&quot;;\n    } else {\n      nameHint.textContent = &quot;Введите имя или ник&quot;;\n    }\n  }\n}\n\nnameButton.addEventListener(&quot;click&quot;, askName);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>if (visitorName !== null)\u003c/code>\u003c/dt>\u003cdd>Сначала исключаем отмену. У null нет метода trim(), поэтому эта проверка остаётся снаружи.\u003c/dd>\u003cdt>\u003ccode>const cleanName = visitorName.trim()\u003c/code>\u003c/dt>\u003cdd>Получаем строку без крайних пробелов. Эту строку и проверяем, и показываем.\u003c/dd>\u003cdt>\u003ccode>cleanName !== &quot;&quot;\u003c/code>\u003c/dt>\u003cdd>Текст не равен пустой строке. Две соседние кавычки обозначают строку без символов.\u003c/dd>\u003cdt>\u003ccode>else\u003c/code>\u003c/dt>\u003cdd>В эту ветку попадут пустое поле и одни пробелы. Команды здесь не изменяют имя.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Введите «  Лис  »: в билете должен остаться «Лис».\u003c/p>\u003cp>Подтвердите пустое поле, затем поле из пробелов. Оба раза имя остаётся, под ним появляется просьба.\u003c/p>\u003cp>Перепишите просьбу своими словами. Введите нормальный ник: просьба должна исчезнуть. Отмена ввода по-прежнему сохраняет имя.\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Зачем проверять cleanName, а не исходный visitorName?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>В исходной строке могут быть одни пробелы. После trim() они исчезнут, и условие распознает пустой ввод.\u003c/p>\u003c/details>","hint":"Вы меняете только условие внутреннего if. Внешняя проверка null и действия обеих веток уже готовы.","hintCode":"if (cleanName !== \"\") {\n","experiment":null,"previewLabel":"Крыша","previewStart":".cinema-ticket-section","globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\nconst nameHint = document.querySelector(\".name-hint\");","support":"","history":[],"stage":3,"replaces":["t2"]},{"id":"t4","kind":"learn","title":"Сначала спросите согласие","file":"js","brief":"\u003cp>Билет подписан. Перед оформлением зритель должен увидеть имя ещё раз и решить, всё ли верно. При отказе он сможет исправить подпись.\u003c/p>\u003cp>\u003ccode>window.confirm(question)\u003c/code> показывает вопрос и возвращает \u003ccode>true\u003c/code> при согласии или \u003ccode>false\u003c/code> при отмене. Готовое \u003ccode>if (accepted)\u003c/code> оформит билет только при согласии.\u003c/p>","task":"В строке \u003ccode>const accepted = false;\u003c/code> замените \u003ccode>false\u003c/code> вызовом \u003ccode>window.confirm(question)\u003c/code>. Вопрос уже находится в \u003ccode>question\u003c/code>, а оформление внутри \u003ccode>if\u003c/code> написано. Сначала откажитесь от оформления, затем согласитесь.","expected":"Отмена сохраняет возможность изменить имя. После согласия билет подтверждён, кнопки отключены.","starter":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = false; // Здесь получите ответ на question.\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n","solution":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>prompt нужен для текста, confirm — для решения. У confirm не поле ввода, а выбор: согласиться с вопросом или отменить его.\u003c/p>\u003cp>question содержит готовый вопрос с текущей подписью. Обратные кавычки позволяют вставить ticketName.textContent через ${...}. Это знакомая шаблонная строка.\u003c/p>\u003cp>Ответ сохраняем в accepted. При true выполняются команды внутри if. При false они пропускаются — ничего восстанавливать не приходится.\u003c/p>\u003cp>Действия успешной ветки уже написаны. Прочитайте их: класс меняет оформление, textContent — статус, disabled = true — доступность кнопок.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(&quot;is-confirmed&quot;);\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n  }\n}\n\nbookButton.addEventListener(&quot;click&quot;, bookTicket);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>const accepted = window.confirm(question)\u003c/code>\u003c/dt>\u003cdd>Получаем решение и сохраняем его. true и false — логические значения без кавычек.\u003c/dd>\u003cdt>\u003ccode>if (accepted)\u003c/code>\u003c/dt>\u003cdd>Означает «если accepted истинно». Проверять ещё раз через === true не обязательно.\u003c/dd>\u003cdt>\u003ccode>ticket.classList.add(&quot;is-confirmed&quot;)\u003c/code>\u003c/dt>\u003cdd>Включаем готовое оформление подтверждённого билета.\u003c/dd>\u003cdt>\u003ccode>nameButton.disabled = true\u003c/code>\u003c/dt>\u003cdd>Отключаем кнопку. То же действие для bookButton защищает от повторного оформления.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Подпишите билет, нажмите «Подтвердить» и отмените вопрос. Статус и доступность кнопок не меняются.\u003c/p>\u003cp>Исправьте ник и повторите подтверждение. В вопросе появится новая подпись. Согласитесь: статус изменится, кнопки отключатся.\u003c/p>\u003cp>Напишите свой текст статуса внутри успешной ветки. Для нового опыта нажмите «Обновить афишу».\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Что будет, если сразу записать true в accepted?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>Билет оформится без вопроса. У зрителя не будет возможности проверить имя и отказаться.\u003c/p>\u003c/details>","hint":"Вызов метода можно поставить справа от =. Его результат попадёт в уже существующую переменную accepted.","hintCode":"const accepted = window.confirm(question);\n","experiment":"reload","previewLabel":"Крыша","previewStart":".cinema-ticket-section","globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\nconst nameHint = document.querySelector(\".name-hint\");\nconst ticket = document.querySelector(\".cinema-ticket\");\nconst ticketStatus = document.querySelector(\".ticket-status\");\nconst bookButton = document.querySelector(\".book-button\");","support":"","history":[{"id":"t3","number":3,"title":"Пустое поле тоже не имя","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== \"\") {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n"}],"stage":4,"replaces":[]},{"id":"t5","kind":"learn","title":"Билет есть. А где вход?","file":"js","brief":"\u003cp>Вход на крышу находится со двора. Сообщите об этом после оформления: зрителю нужно подняться к 21:15, за четверть часа до начала.\u003c/p>\u003cp>\u003ccode>window.alert(\"Ваше сообщение\")\u003c/code> показывает текст с одной кнопкой закрытия. Новую строку добавляем внутрь успешной ветки \u003ccode>if\u003c/code>, чтобы приглашение получили только подтвердившие билет.\u003c/p>","task":"Вместо комментария после \u003ccode>bookButton.disabled = true;\u003c/code> добавьте \u003ccode>window.alert\u003c/code> с инструкцией: вход со двора кинотеатра, подойти к 21:15. Новая строка должна остаться внутри \u003ccode>if (accepted)\u003c/code>.","expected":"После согласия открывается инструкция. После отмены она не появляется.","starter":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n    // Покажите сообщение о входе и времени.\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n","solution":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n    window.alert(\"Вход со двора кинотеатра. Поднимайтесь на крышу к 21:15.\");\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>Мы уже умеем получать текст и решение. Теперь нужно только сообщить информацию. Для этого подходит alert.\u003c/p>\u003cp>В скобках пишем строку сообщения. Сохранять результат в переменную не требуется: дальнейшего выбора по ответу здесь нет.\u003c/p>\u003cp>Место строки имеет значение. Внутри if сообщение открывается после согласия. За пределами if оно открывалось бы и после отказа.\u003c/p>\u003cp>Браузерные диалоги ждут ответа и мешают обычным действиям на странице до закрытия. Поэтому вызываем их по нажатию, а не при каждой прокрутке. На больших сайтах часто используют свои формы и окна.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(&quot;is-confirmed&quot;);\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n    window.alert(&quot;Вход со двора кинотеатра. Поднимайтесь на крышу к 21:15.&quot;);\n  }\n}\n\nbookButton.addEventListener(&quot;click&quot;, bookTicket);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>window.alert(&quot;...&quot;)\u003c/code>\u003c/dt>\u003cdd>Показываем строку. Имя переменной для ответа не нужно.\u003c/dd>\u003cdt>\u003ccode>После bookButton.disabled = true\u003c/code>\u003c/dt>\u003cdd>Сначала оформляем билет, затем объясняем, куда идти.\u003c/dd>\u003cdt>\u003ccode>До закрывающей скобки if\u003c/code>\u003c/dt>\u003cdd>Приглашение зависит от согласия на оформление.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Сначала отмените подтверждение: инструкция не должна открыться.\u003c/p>\u003cp>Повторите и согласитесь. После закрытия сообщения билет остаётся подтверждённым.\u003c/p>\u003cp>Сформулируйте инструкцию по-своему, сохранив место входа и время.\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Чем alert отличается от confirm?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>alert сообщает, confirm получает решение. Закрытие сообщения не заменяет согласие на бронирование.\u003c/p>\u003c/details>","hint":"После новой строки должна идти скобка, закрывающая успешную ветку. Второй обработчик нажатия не нужен.","hintCode":"window.alert(\"Вход со двора кинотеатра. Поднимайтесь на крышу к 21:15.\");\n","experiment":"reload","previewLabel":"Крыша","previewStart":".cinema-ticket-section","globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\nconst nameHint = document.querySelector(\".name-hint\");\nconst ticket = document.querySelector(\".cinema-ticket\");\nconst ticketStatus = document.querySelector(\".ticket-status\");\nconst bookButton = document.querySelector(\".book-button\");","support":"","history":[{"id":"t3","number":3,"title":"Пустое поле тоже не имя","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== \"\") {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n"}],"stage":5,"replaces":["t4"]},{"id":"t6","kind":"learn","title":"Афиша загрузилась, надпись осталась","file":"js","brief":"\u003cp>Билет работает. Теперь посмотрим на первое открытие сайта: снимки загрузились, а над фильмом осталось «Открываем афишу…». Функция \u003ccode>showReady\u003c/code> умеет убрать ожидание, но её никто не вызывает.\u003c/p>\u003cp>Событие \u003ccode>load\u003c/code> у \u003ccode>window\u003c/code> сообщает об окончании загрузки. Подключение такое же, как у кнопки: \u003ccode>window.addEventListener(\"load\", showReady)\u003c/code>. Меняются источник и название события.\u003c/p>","task":"После готовой функции \u003ccode>showReady\u003c/code> добавьте одну строку: подключите её к \u003ccode>load\u003c/code> у \u003ccode>window\u003c/code>. Передайте имя функции без скобок. Нажмите «Обновить афишу» и проверьте надпись.","expected":"После загрузки появляется «Последний показ сезона», фотография становится ярче.","starter":"function showReady() {\n  pageState.textContent = \"Последний показ сезона\";\n  poster.classList.add(\"is-ready\");\n}\n\n// Подключите showReady к load окна.\n","solution":"function showReady() {\n  pageState.textContent = \"Последний показ сезона\";\n  poster.classList.add(\"is-ready\");\n}\n\nwindow.addEventListener(\"load\", showReady);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>Схема та же, что у click: браузер сообщает о событии, наша функция отвечает. У кнопки событие возникало после нажатия, здесь загрузка завершается сама.\u003c/p>\u003cp>window относится к окружению страницы: его событиям, размеру и диалогам. document представляет сам HTML-документ, в котором мы искали элементы.\u003c/p>\u003cp>DOMContentLoaded у document означает, что готова структура HTML. load у window ждёт страницу с обычными зависимыми ресурсами, включая фотографии. Изображения с отложенной загрузкой могут появиться позже; в нашей афише она не включена.\u003c/p>\u003cp>Команды функции уже написаны. Нужно лишь указать событие, после которого они выполнятся. Так выбираем правильный момент, не переписывая само действие.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function showReady() {\n  pageState.textContent = &quot;Последний показ сезона&quot;;\n  poster.classList.add(&quot;is-ready&quot;);\n}\n\nwindow.addEventListener(&quot;load&quot;, showReady);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>function showReady()\u003c/code>\u003c/dt>\u003cdd>Описывает действие, но само объявление его не выполняет.\u003c/dd>\u003cdt>\u003ccode>window.addEventListener(&quot;load&quot;, showReady)\u003c/code>\u003c/dt>\u003cdd>Подключает действие к окончанию загрузки.\u003c/dd>\u003cdt>\u003ccode>showReady без ()\u003c/code>\u003c/dt>\u003cdd>Передаём функцию на будущее. Скобки вызвали бы её прямо сейчас.\u003c/dd>\u003cdt>\u003ccode>poster.classList.add(&quot;is-ready&quot;)\u003c/code>\u003c/dt>\u003cdd>Готовый класс убирает приглушение снимка.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Нажмите «Обновить афишу». Проверьте, что надпись ожидания исчезла.\u003c/p>\u003cp>Загрузка может быть быстрой: итоговая надпись заметнее короткой смены яркости.\u003c/p>\u003cp>Измените название вечера внутри функции. Снова откройте афишу этой кнопкой: должно появиться ваше название.\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Почему не подключаем load к nameButton?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>Мы ждём загрузку страницы, а не действие отдельной кнопки. Источник события здесь — window.\u003c/p>\u003c/details>","hint":"Вспомните строку с click: источник.addEventListener(событие, функция). Теперь источник — window, событие — load.","hintCode":"window.addEventListener(\"load\", showReady);\n","experiment":"reload","previewLabel":"Крыша","previewStart":null,"globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\nconst nameHint = document.querySelector(\".name-hint\");\nconst ticket = document.querySelector(\".cinema-ticket\");\nconst ticketStatus = document.querySelector(\".ticket-status\");\nconst bookButton = document.querySelector(\".book-button\");\nconst pageState = document.querySelector(\".season-label\");\nconst poster = document.querySelector(\".poster\");","support":"","history":[{"id":"t3","number":3,"title":"Пустое поле тоже не имя","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== \"\") {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n"},{"id":"t5","number":5,"title":"Билет есть. А где вход?","solution":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n    window.alert(\"Вход со двора кинотеатра. Поднимайтесь на крышу к 21:15.\");\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n"}],"stage":6,"replaces":[]},{"id":"t7","kind":"learn","title":"Зритель открыл афишу на телефоне","file":"js","brief":"\u003cp>В узком окне дата и адрес теснят друг друга. Готовый класс \u003ccode>is-compact\u003c/code> ставит их в одну колонку. Добавление и удаление класса уже написаны — осталось выбрать условие и событие.\u003c/p>\u003cp>\u003ccode>window.innerWidth\u003c/code> хранит ширину окна в пикселях. Узким считаем окно меньше 480: \u003ccode>window.innerWidth &lt; 480\u003c/code>. Событие изменения размера называется \u003ccode>resize\u003c/code>.\u003c/p>","task":"Замените \u003ccode>false\u003c/code> в условии на \u003ccode>window.innerWidth &lt; 480\u003c/code>. После готового вызова \u003ccode>updateLayout();\u003c/code> подключите эту же функцию к \u003ccode>resize\u003c/code> окна. Используйте запись \u003ccode>addEventListener\u003c/code> с прошлого шага.","expected":"Сужение включает одну колонку, расширение возвращает две. Кнопка над результатом меняет ширину.","starter":"function updateLayout() {\n  if (false) {\n    page.classList.add(\"is-compact\");\n  } else {\n    page.classList.remove(\"is-compact\");\n  }\n}\n\nupdateLayout();\n// Подключите updateLayout к resize окна.\n","solution":"function updateLayout() {\n  if (window.innerWidth \u003c 480) {\n    page.classList.add(\"is-compact\");\n  } else {\n    page.classList.remove(\"is-compact\");\n  }\n}\n\nupdateLayout();\nwindow.addEventListener(\"resize\", updateLayout);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>Узкое окно отнимает место у текста. Страница уже умеет выглядеть компактно: CSS-класс меняет колонки и отступы. Мы выбираем, когда его включать.\u003c/p>\u003cp>innerWidth — числовое свойство. Его читают без скобок. Знак \u003c сравнивает это число с 480: для 360 условие верно, для 600 — нет.\u003c/p>\u003cp>В if добавляем класс, в else удаляем. Поэтому страница умеет не только сужаться, но и возвращаться к широкому виду.\u003c/p>\u003cp>Первоначальный вызов updateLayout() уже есть: он учитывает окно при открытии. Обработчик resize нужен для последующих изменений. Внутри функции ширина читается каждый раз заново.\u003c/p>\u003cp>Обычную адаптивную вёрстку часто делают медиазапросами CSS. Здесь используем готовый класс для знакомства с событием resize.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function updateLayout() {\n  if (window.innerWidth &lt; 480) {\n    page.classList.add(&quot;is-compact&quot;);\n  } else {\n    page.classList.remove(&quot;is-compact&quot;);\n  }\n}\n\nupdateLayout();\nwindow.addEventListener(&quot;resize&quot;, updateLayout);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>window.innerWidth &lt; 480\u003c/code>\u003c/dt>\u003cdd>Проверяем текущее окно. При ширине ровно 480 условие уже неверно.\u003c/dd>\u003cdt>\u003ccode>page.classList.add(&quot;is-compact&quot;)\u003c/code>\u003c/dt>\u003cdd>Готовая команда для узкого вида.\u003c/dd>\u003cdt>\u003ccode>page.classList.remove(&quot;is-compact&quot;)\u003c/code>\u003c/dt>\u003cdd>Готовая команда для обратного перехода.\u003c/dd>\u003cdt>\u003ccode>updateLayout()\u003c/code>\u003c/dt>\u003cdd>Выполняем действие сразу при открытии.\u003c/dd>\u003cdt>\u003ccode>window.addEventListener(&quot;resize&quot;, updateLayout)\u003c/code>\u003c/dt>\u003cdd>Та же запись подключения, что у load, с другим событием и функцией.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Нажмите «Сузить окно», затем «Расширить окно». Смотрите на расположение даты и адреса.\u003c/p>\u003cp>Сравните первоначальный вызов со строкой addEventListener: в одном случае скобки есть, в другом — нет.\u003c/p>\u003cp>Предскажите, какая ветка сработает для ширины 479, 480 и 481.\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Почему не убираем вызов updateLayout(), хотя подключили resize?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>При открытии узкого окна размер ещё не менялся. Первый вызов выставляет вид сейчас, resize обновляет его позже.\u003c/p>\u003c/details>","hint":"Меняются только условие и последняя строка. Вспомните подключение load: теперь нужны resize и updateLayout.","hintCode":"window.addEventListener(\"resize\", updateLayout);\n","experiment":"resize","previewLabel":"Крыша","previewStart":null,"globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\nconst nameHint = document.querySelector(\".name-hint\");\nconst ticket = document.querySelector(\".cinema-ticket\");\nconst ticketStatus = document.querySelector(\".ticket-status\");\nconst bookButton = document.querySelector(\".book-button\");\nconst pageState = document.querySelector(\".season-label\");\nconst poster = document.querySelector(\".poster\");\nconst page = document.querySelector(\".cinema-page\");","support":"","history":[{"id":"t3","number":3,"title":"Пустое поле тоже не имя","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== \"\") {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n"},{"id":"t5","number":5,"title":"Билет есть. А где вход?","solution":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n    window.alert(\"Вход со двора кинотеатра. Поднимайтесь на крышу к 21:15.\");\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n"},{"id":"t6","number":6,"title":"Афиша загрузилась, надпись осталась","solution":"function showReady() {\n  pageState.textContent = \"Последний показ сезона\";\n  poster.classList.add(\"is-ready\");\n}\n\nwindow.addEventListener(\"load\", showReady);\n"}],"stage":7,"replaces":[]},{"id":"t8","kind":"learn","title":"Билет должен оставаться под рукой","file":"js","brief":"\u003cp>Зритель долистал до программы, а первая кнопка билета осталась наверху. После первых 700 пикселей будем показывать короткую панель перехода. При возвращении к началу скроем её.\u003c/p>\u003cp>\u003ccode>window.scrollY\u003c/code> хранит, на сколько пикселей страница прокручена вниз. Условие \u003ccode>window.scrollY &gt; 700\u003c/code> означает «пролистали больше 700». О прокрутке сообщает событие \u003ccode>scroll\u003c/code>.\u003c/p>","task":"Замените \u003ccode>false\u003c/code> условием \u003ccode>window.scrollY &gt; 700\u003c/code>. После готового вызова \u003ccode>updateQuickTicket();\u003c/code> подключите функцию к \u003ccode>scroll\u003c/code> окна. Добавление и удаление класса панели уже написаны.","expected":"Прокрутка вниз показывает панель, возвращение к началу скрывает её.","starter":"function updateQuickTicket() {\n  if (false) {\n    quickTicket.classList.add(\"is-visible\");\n  } else {\n    quickTicket.classList.remove(\"is-visible\");\n  }\n}\n\nupdateQuickTicket();\n// Подключите updateQuickTicket к scroll окна.\n","solution":"function updateQuickTicket() {\n  if (window.scrollY > 700) {\n    quickTicket.classList.add(\"is-visible\");\n  } else {\n    quickTicket.classList.remove(\"is-visible\");\n  }\n}\n\nupdateQuickTicket();\nwindow.addEventListener(\"scroll\", updateQuickTicket);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>Панель — второй путь к тому же билету. Она находится сверху окна и не перекрывает кнопки подтверждения. В начале страницы достаточно обычной кнопки, после просмотра верхней части удобен закреплённый переход.\u003c/p>\u003cp>scrollY показывает положение страницы, а не силу одного движения колеса. В начале это обычно ноль; после прокрутки на 800 пикселей — около 800.\u003c/p>\u003cp>Число 700 — выбранный момент появления панели для этой афиши. Его не нужно вычислять по размерам картинок или положению элементов. В этом задании работаем с одним числом и одним сравнением.\u003c/p>\u003cp>Структура функции такая же, как в предыдущем шаге: if включает класс, else убирает. Меняются свойство окна, класс и событие.\u003c/p>\u003cp>Событие scroll возникает часто. Поэтому функция выполняет короткое действие, а не открывает запросы и сообщения при каждой прокрутке.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function updateQuickTicket() {\n  if (window.scrollY &gt; 700) {\n    quickTicket.classList.add(&quot;is-visible&quot;);\n  } else {\n    quickTicket.classList.remove(&quot;is-visible&quot;);\n  }\n}\n\nupdateQuickTicket();\nwindow.addEventListener(&quot;scroll&quot;, updateQuickTicket);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>window.scrollY &gt; 700\u003c/code>\u003c/dt>\u003cdd>Читаем текущую прокрутку. Ровно 700 ещё не больше 700.\u003c/dd>\u003cdt>\u003ccode>quickTicket.classList.add(&quot;is-visible&quot;)\u003c/code>\u003c/dt>\u003cdd>Показываем существующую панель через готовый класс.\u003c/dd>\u003cdt>\u003ccode>else\u003c/code>\u003c/dt>\u003cdd>Обрабатываем обратный путь: возвращение к началу скрывает панель.\u003c/dd>\u003cdt>\u003ccode>updateQuickTicket()\u003c/code>\u003c/dt>\u003cdd>Проверяем начальное положение.\u003c/dd>\u003cdt>\u003ccode>window.addEventListener(&quot;scroll&quot;, updateQuickTicket)\u003c/code>\u003c/dt>\u003cdd>Подключаем уже знакомым способом, теперь к прокрутке.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Прокрутите результат до программы вечера. Должна появиться панель «К билету».\u003c/p>\u003cp>Перейдите к билету, затем вернитесь к началу. В начале панель исчезает.\u003c/p>\u003cp>Сравните код со сменой размера: в обоих случаях читается свойство window, проверяется условие и меняется класс.\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Что будет, если удалить готовую ветку else?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>После первого появления панель останется видимой и при возвращении наверх. Класс сам не исчезает.\u003c/p>\u003c/details>","hint":"Повторите схему resize: другое свойство и другое событие. Условия объединять и координаты элементов вычислять не нужно.","hintCode":"window.addEventListener(\"scroll\", updateQuickTicket);\n","experiment":null,"previewLabel":"Крыша","previewStart":null,"globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\nconst nameHint = document.querySelector(\".name-hint\");\nconst ticket = document.querySelector(\".cinema-ticket\");\nconst ticketStatus = document.querySelector(\".ticket-status\");\nconst bookButton = document.querySelector(\".book-button\");\nconst pageState = document.querySelector(\".season-label\");\nconst poster = document.querySelector(\".poster\");\nconst page = document.querySelector(\".cinema-page\");\nconst quickTicket = document.querySelector(\".quick-ticket\");","support":"","history":[{"id":"t3","number":3,"title":"Пустое поле тоже не имя","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== \"\") {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n"},{"id":"t5","number":5,"title":"Билет есть. А где вход?","solution":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n    window.alert(\"Вход со двора кинотеатра. Поднимайтесь на крышу к 21:15.\");\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n"},{"id":"t6","number":6,"title":"Афиша загрузилась, надпись осталась","solution":"function showReady() {\n  pageState.textContent = \"Последний показ сезона\";\n  poster.classList.add(\"is-ready\");\n}\n\nwindow.addEventListener(\"load\", showReady);\n"},{"id":"t7","number":7,"title":"Зритель открыл афишу на телефоне","solution":"function updateLayout() {\n  if (window.innerWidth \u003c 480) {\n    page.classList.add(\"is-compact\");\n  } else {\n    page.classList.remove(\"is-compact\");\n  }\n}\n\nupdateLayout();\nwindow.addEventListener(\"resize\", updateLayout);\n"}],"stage":8,"replaces":[]},{"id":"t9","kind":"reinforce","title":"Защитите бронь от случайной отмены","file":"js","brief":"\u003cp>Планы изменились: зритель хочет отменить уже оформленный билет. Кнопка отмены и команды возврата готовы, но сейчас один случайный клик сразу отменяет бронь. Добавьте вопрос перед действием.\u003c/p>\u003cp>Повторите знакомый приём: \u003ccode>window.confirm(question)\u003c/code> возвращает решение, а \u003ccode>if (accepted)\u003c/code> разрешает изменения только после согласия. Новых методов и условий здесь нет.\u003c/p>","task":"Внутри \u003ccode>cancelTicket\u003c/code>, после \u003ccode>question\u003c/code>, получите ответ \u003ccode>window.confirm(question)\u003c/code> в \u003ccode>accepted\u003c/code>. Оберните четыре готовые команды отмены в \u003ccode>if (accepted)\u003c/code>. Подключение кнопки и вопрос уже написаны.","expected":"Сначала откажитесь от отмены: бронь сохранится. Затем согласитесь: имя останется, билет можно оформить снова.","starter":"function cancelTicket() {\n  const question = `Отменить бронь на имя «${ticketName.textContent}»?`;\n\n  // Здесь получите ответ confirm в accepted.\n\n  // Эти четыре команды должны выполняться только после согласия.\n  ticket.classList.remove(\"is-confirmed\");\n  ticketStatus.textContent = \"Бронь отменена. Имя сохранено.\";\n  nameButton.disabled = false;\n  bookButton.disabled = false;\n}\n\ncancelButton.addEventListener(\"click\", cancelTicket);\n","solution":"function cancelTicket() {\n  const question = `Отменить бронь на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.remove(\"is-confirmed\");\n    ticketStatus.textContent = \"Бронь отменена. Имя сохранено.\";\n    nameButton.disabled = false;\n    bookButton.disabled = false;\n  }\n}\n\ncancelButton.addEventListener(\"click\", cancelTicket);\n","explain":"\u003ch3>Что и зачем делаем\u003c/h3>\u003cp>Здесь не нужно придумывать оформление отмены. Четыре команды уже делают нужное: убирают класс подтверждения, меняют статус и включают две прежние кнопки.\u003c/p>\u003cp>Проблема только в моменте выполнения. Сейчас нажатие сразу запускает команды. Нужно сначала получить согласие, как при оформлении билета.\u003c/p>\u003cp>После question напишите const accepted = window.confirm(question). Затем поставьте if (accepted) перед четырьмя командами и заключите их в фигурные скобки. При false весь блок пропускается.\u003c/p>\u003cp>Не переносите в условие строку addEventListener: она подключает кнопку заранее. Условие находится внутри функции и проверяет ответ на каждое нажатие.\u003c/p>\u003cp>Имя не меняется: среди четырёх команд нет присваивания ticketName. Кнопка отмены видна у подтверждённого билета благодаря уже готовому CSS-классу is-confirmed; после удаления класса она скрывается.\u003c/p>\u003ch3>Разберём код\u003c/h3>\u003cpre>\u003ccode>function cancelTicket() {\n  const question = `Отменить бронь на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.remove(&quot;is-confirmed&quot;);\n    ticketStatus.textContent = &quot;Бронь отменена. Имя сохранено.&quot;;\n    nameButton.disabled = false;\n    bookButton.disabled = false;\n  }\n}\n\ncancelButton.addEventListener(&quot;click&quot;, cancelTicket);\u003c/code>\u003c/pre>\u003cdl>\u003cdt>\u003ccode>const accepted = window.confirm(question)\u003c/code>\u003c/dt>\u003cdd>Точно тот же способ получить согласие, что при оформлении.\u003c/dd>\u003cdt>\u003ccode>if (accepted)\u003c/code>\u003c/dt>\u003cdd>Вопрос теперь об отмене, поэтому true разрешает именно отмену брони.\u003c/dd>\u003cdt>\u003ccode>Четыре команды внутри фигурных скобок\u003c/code>\u003c/dt>\u003cdd>Ни одна из них не должна выполняться при отказе.\u003c/dd>\u003cdt>\u003ccode>disabled = false\u003c/code>\u003c/dt>\u003cdd>Возвращает доступность кнопок. Эти готовые строки не требуют изменений.\u003c/dd>\u003cdt>\u003ccode>cancelButton.addEventListener(&quot;click&quot;, cancelTicket)\u003c/code>\u003c/dt>\u003cdd>Подключение остаётся после функции, вне условия.\u003c/dd>\u003c/dl>\u003ch3>Попробуйте на билете\u003c/h3>\u003cp>Подпишите и подтвердите билет. Появится «Отменить бронь».\u003c/p>\u003cp>Нажмите отмену брони и откажитесь в вопросе. Подтверждение, имя и недоступность прежних кнопок должны сохраниться.\u003c/p>\u003cp>Повторите и согласитесь. Статус сообщит об отмене, имя останется, прежние кнопки снова доступны.\u003c/p>\u003cp>Оформите билет ещё раз. Не нужно повторно вводить то же имя.\u003c/p>\u003ch3>Проверьте понимание\u003c/h3>\u003cp>Что случится, если одну из четырёх команд оставить за скобкой if?\u003c/p>\u003cdetails class=\"recall\">\u003csummary>Разобрать ответ\u003c/summary>\u003cp>Она выполнится и после отказа. Например, кнопка подписи станет доступной, хотя бронь всё ещё подтверждена.\u003c/p>\u003c/details>","hint":"Вспомните получение accepted при оформлении. Здесь нужен такой же запрос, а готовые изменения должны попасть внутрь одного if.","hintCode":"const accepted = window.confirm(question);\n\nif (accepted) {\n  // Четыре готовые команды отмены.\n}\n","experiment":"reload","previewLabel":"Крыша","previewStart":".cinema-ticket-section","globalNames":["nameButton","ticketName","nameHint","ticket","ticketStatus","bookButton","pageState","poster","page","quickTicket","cancelButton"],"globals":"const nameButton = document.querySelector(\".name-button\");\nconst ticketName = document.querySelector(\".ticket-name\");\nconst nameHint = document.querySelector(\".name-hint\");\nconst ticket = document.querySelector(\".cinema-ticket\");\nconst ticketStatus = document.querySelector(\".ticket-status\");\nconst bookButton = document.querySelector(\".book-button\");\nconst pageState = document.querySelector(\".season-label\");\nconst poster = document.querySelector(\".poster\");\nconst page = document.querySelector(\".cinema-page\");\nconst quickTicket = document.querySelector(\".quick-ticket\");\nconst cancelButton = document.querySelector(\".cancel-button\");","support":"","history":[{"id":"t3","number":3,"title":"Пустое поле тоже не имя","solution":"function askName() {\n  const visitorName = window.prompt(\"Как подписать ваш билет?\");\n\n  if (visitorName !== null) {\n    const cleanName = visitorName.trim();\n\n    if (cleanName !== \"\") {\n      ticketName.textContent = cleanName;\n      nameHint.textContent = \"\";\n    } else {\n      nameHint.textContent = \"Введите имя или ник\";\n    }\n  }\n}\n\nnameButton.addEventListener(\"click\", askName);\n"},{"id":"t5","number":5,"title":"Билет есть. А где вход?","solution":"function bookTicket() {\n  const question = `Забронировать место на имя «${ticketName.textContent}»?`;\n  const accepted = window.confirm(question);\n\n  if (accepted) {\n    ticket.classList.add(\"is-confirmed\");\n    ticketStatus.textContent = `${ticketName.textContent}, место за вами`;\n    nameButton.disabled = true;\n    bookButton.disabled = true;\n    window.alert(\"Вход со двора кинотеатра. Поднимайтесь на крышу к 21:15.\");\n  }\n}\n\nbookButton.addEventListener(\"click\", bookTicket);\n"},{"id":"t6","number":6,"title":"Афиша загрузилась, надпись осталась","solution":"function showReady() {\n  pageState.textContent = \"Последний показ сезона\";\n  poster.classList.add(\"is-ready\");\n}\n\nwindow.addEventListener(\"load\", showReady);\n"},{"id":"t7","number":7,"title":"Зритель открыл афишу на телефоне","solution":"function updateLayout() {\n  if (window.innerWidth \u003c 480) {\n    page.classList.add(\"is-compact\");\n  } else {\n    page.classList.remove(\"is-compact\");\n  }\n}\n\nupdateLayout();\nwindow.addEventListener(\"resize\", updateLayout);\n"},{"id":"t8","number":8,"title":"Билет должен оставаться под рукой","solution":"function updateQuickTicket() {\n  if (window.scrollY > 700) {\n    quickTicket.classList.add(\"is-visible\");\n  } else {\n    quickTicket.classList.remove(\"is-visible\");\n  }\n}\n\nupdateQuickTicket();\nwindow.addEventListener(\"scroll\", updateQuickTicket);\n"}],"stage":9,"replaces":[]}]</script>
<script id="lessonProject" type="application/json">{"html":"\u003c!doctype html>\n\u003chtml lang=\"ru\">\n  \u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n    \u003ctitle>Крыша — Город после полуночи\u003c/title>\n    \u003clink rel=\"stylesheet\" href=\"style.css\">\n  \u003c/head>\n\n  \u003cbody class=\"cinema-page\" data-stage=\"__STAGE__\">\n    \u003cheader class=\"cinema-header\">\n      \u003ca class=\"cinema-brand\" href=\"#top\">Крыша\u003c/a>\n      \u003ca class=\"cinema-nav\" href=\"#ticket-section\">Мой билет\u003c/a>\n    \u003c/header>\n\n    \u003cmain>\n      \u003csection class=\"cinema-hero poster\" id=\"top\" aria-labelledby=\"film-title\">\n        \u003cimg src=\"assets/city.jpg\" alt=\"Ночной город с крыши\">\n\n        \u003cdiv class=\"cinema-hero-copy\">\n          \u003cp class=\"season-label\">Открываем афишу…\u003c/p>\n          \u003ch1 id=\"film-title\">Город после\u003cbr>полуночи\u003c/h1>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"cinema-booking-summary\" aria-label=\"О сеансе\">\n        \u003cdiv class=\"cinema-details\">\n          \u003cdiv>\n            \u003cstrong>29 августа\u003c/strong>\n            \u003cp>Начало в 21:30\u003c/p>\n          \u003c/div>\n\n          \u003cdiv>\n            \u003cstrong>Кинотеатр «Орбита»\u003c/strong>\n            \u003cp>Открытая крыша\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003ca class=\"cinema-primary cinema-main-action\" href=\"#ticket-section\">\n          Получить билет\n        \u003c/a>\n      \u003c/section>\n\n      \u003csection class=\"cinema-content\" aria-labelledby=\"program-title\">\n        \u003ch2 id=\"program-title\">Как пройдёт вечер\u003c/h2>\n\n        \u003cdiv class=\"cinema-schedule\">\n          \u003cdiv class=\"cinema-schedule-row\">\n            \u003ctime datetime=\"21:00\">21:00\u003c/time>\n            \u003cp>Открываем крышу\u003c/p>\n          \u003c/div>\n\n          \u003cdiv class=\"cinema-schedule-row\">\n            \u003ctime datetime=\"21:30\">21:30\u003c/time>\n            \u003cp>Начинаем показ\u003c/p>\n          \u003c/div>\n\n          \u003cdiv class=\"cinema-schedule-row\">\n            \u003ctime datetime=\"23:00\">23:00\u003c/time>\n            \u003cp>Последние титры\u003c/p>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cimg\n          class=\"cinema-place-photo\"\n          src=\"assets/screening.jpg\"\n          alt=\"Кинопоказ под открытым небом с большим экраном и гирляндами\"\n        >\n\n        \u003cp class=\"cinema-place-text\">\n          На крыше прохладнее. Возьмите с собой тёплую вещь.\n        \u003c/p>\n      \u003c/section>\n\n      \u003csection\n        class=\"cinema-ticket-section\"\n        id=\"ticket-section\"\n        aria-labelledby=\"ticket-title\"\n      >\n        \u003ch2 id=\"ticket-title\">Ваш билет\u003c/h2>\n\n        \u003carticle class=\"cinema-ticket\">\n          \u003ch3>Город после полуночи\u003c/h3>\n          \u003cp class=\"cinema-ticket-date\">29 августа, 21:30\u003c/p>\n          \u003cp class=\"cinema-ticket-venue\">Кинотеатр «Орбита», крыша\u003c/p>\n\n          \u003cdiv class=\"cinema-ticket-person\">\n            \u003cspan class=\"cinema-ticket-label\">Зритель\u003c/span>\n            \u003cspan class=\"ticket-name\">Гость\u003c/span>\n          \u003c/div>\n\n          \u003cp class=\"name-hint\" aria-live=\"polite\">\u003c/p>\n          \u003cp class=\"ticket-status\" aria-live=\"polite\">Осталось подтвердить билет\u003c/p>\n\n          \u003cdiv class=\"cinema-ticket-actions\">\n            \u003cbutton class=\"cinema-secondary name-button\" type=\"button\">\n              Подписать билет\n            \u003c/button>\n\n            \u003cbutton class=\"cinema-primary book-button\" type=\"button\">\n              Подтвердить\n            \u003c/button>\n          \u003c/div>\n\n          \u003cbutton class=\"cinema-secondary cancel-button\" type=\"button\" hidden>\n            Отменить бронь\n          \u003c/button>\n        \u003c/article>\n      \u003c/section>\n    \u003c/main>\n\n    \u003caside class=\"quick-ticket\" aria-label=\"Переход к билету\">\n      \u003cp>Город после полуночи\u003c/p>\n      \u003ca class=\"cinema-primary\" href=\"#ticket-section\">К билету\u003c/a>\n    \u003c/aside>\n\n    \u003cscript src=\"interface.js\">\u003c/script>\n    \u003cscript src=\"script.js\">\u003c/script>\n  \u003c/body>\n\u003c/html>\n","css":":root {\n  color-scheme: dark;\n  --page: #191c1c;\n  --ink: #f5f0e6;\n  --muted: #bfc8c0;\n  --line: #414941;\n  --accent: #ac3d29;\n  font-family: \"Segoe UI\", Arial, sans-serif;\n}\n\n* {\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  margin: 0;\n  color: var(--ink);\n  background: var(--page);\n  font-size: 18px;\n  line-height: 1.5;\n}\n\nh1,\nh2,\nh3,\np {\n  margin: 0;\n}\n\nbutton,\ninput {\n  font: inherit;\n}\n\nbutton,\na {\n  -webkit-tap-highlight-color: transparent;\n}\n\nbutton {\n  cursor: pointer;\n}\n\na:focus-visible,\nbutton:focus-visible {\n  outline: 3px solid #eab9a1;\n  outline-offset: 4px;\n}\n\nbutton:disabled {\n  cursor: default;\n  opacity: .5;\n}\n\n.cinema-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 20px;\n  padding: 21px 28px;\n}\n\n.cinema-brand {\n  color: var(--ink);\n  text-decoration: none;\n  font-size: 28px;\n  font-weight: 800;\n  letter-spacing: -1px;\n}\n\n.cinema-nav {\n  color: var(--ink);\n  text-underline-offset: 5px;\n  font-size: 18px;\n  font-weight: 500;\n}\n\n.cinema-hero {\n  position: relative;\n  min-height: 340px;\n  height: min(480px, 76vh);\n  overflow: hidden;\n  color: #fffaf0;\n  background: #142b36;\n  isolation: isolate;\n}\n\n.cinema-hero img {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  object-position: center 60%;\n  z-index: -2;\n  opacity: .65;\n}\n\n.cinema-hero.is-ready img {\n  opacity: 1;\n}\n\n.cinema-hero::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(180deg, #07172270, #07172208 65%, #07172233);\n  z-index: -1;\n}\n\n.cinema-hero-copy {\n  padding: 32px 28px;\n}\n\n.season-label {\n  margin-bottom: 16px;\n  color: #fffaf0;\n  font-size: 18px;\n  font-weight: 500;\n}\n\n.cinema-hero h1 {\n  max-width: 650px;\n  font-size: clamp(44px, 9vw, 64px);\n  font-weight: 700;\n  line-height: 1.06;\n  letter-spacing: -2px;\n  color: #fffaf0;\n}\n\n.cinema-booking-summary {\n  padding: 24px 28px 30px;\n}\n\n.cinema-details {\n  display: grid;\n  grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);\n  gap: 22px;\n}\n\n.cinema-details strong {\n  display: block;\n  font-size: 21px;\n  line-height: 1.35;\n  font-weight: 600;\n}\n\n.cinema-details p {\n  margin-top: 4px;\n  color: var(--muted);\n  font-size: 18px;\n}\n\n.cinema-primary,\n.cinema-secondary {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 54px;\n  padding: 12px 20px;\n  border: 1px solid transparent;\n  border-radius: 3px;\n  text-decoration: none;\n  font-size: 19px;\n  line-height: 1.4;\n  font-weight: 600;\n  text-align: center;\n}\n\n.cinema-primary {\n  background: var(--accent);\n  border-color: var(--accent);\n  color: #fffaf2;\n}\n\n.cinema-primary:hover:not(:disabled) {\n  background: #8d2d1b;\n  border-color: #8d2d1b;\n}\n\n.cinema-main-action {\n  display: flex;\n  width: 100%;\n  margin-top: 23px;\n}\n\n.cinema-content {\n  padding: 4px 28px 36px;\n}\n\n.cinema-content h2,\n.cinema-ticket-section > h2 {\n  font-size: 30px;\n  font-weight: 600;\n  line-height: 1.2;\n  letter-spacing: -.65px;\n  margin-bottom: 20px;\n  color: var(--ink);\n}\n\n.cinema-schedule {\n  margin: 0 0 28px;\n}\n\n.cinema-schedule-row {\n  display: grid;\n  grid-template-columns: 85px minmax(0, 1fr);\n  gap: 20px;\n  padding: 17px 0;\n  border-bottom: 1px solid var(--line);\n}\n\n.cinema-schedule-row:first-child {\n  border-top: 1px solid var(--line);\n}\n\n.cinema-schedule time {\n  font-size: 21px;\n  font-weight: 500;\n  font-variant-numeric: tabular-nums;\n}\n\n.cinema-schedule p {\n  font-size: 20px;\n  color: var(--ink);\n}\n\n.cinema-place-photo {\n  display: block;\n  width: 100%;\n  aspect-ratio: 3/2;\n  object-fit: cover;\n  border-radius: 3px;\n}\n\n.cinema-place-text {\n  margin-top: 18px;\n  font-size: 19px;\n  color: var(--muted);\n}\n\n.cinema-ticket-section {\n  padding: 3px 28px 130px;\n  scroll-margin-top: 110px;\n}\n\n.cinema-ticket {\n  color: #25332a;\n  background: #f0e8d8;\n  padding: 27px 25px 25px;\n  border: 1px solid #d0c6af;\n  border-top: 5px solid #b54a32;\n  border-radius: 3px;\n}\n\n.cinema-ticket :where(h3, p, span, label) {\n  color: #25332a;\n}\n\n.cinema-ticket.is-confirmed {\n  border-top-color: #326249;\n}\n\n.cinema-ticket h3 {\n  font-size: 27px;\n  font-weight: 600;\n  line-height: 1.2;\n  letter-spacing: -.7px;\n}\n\n.cinema-ticket-date {\n  margin-top: 13px;\n  font-size: 19px;\n}\n\n.cinema-ticket .cinema-ticket-venue {\n  margin-top: 3px;\n  color: #526052;\n  font-size: 18px;\n}\n\n.cinema-ticket-person {\n  margin-top: 23px;\n  padding-top: 20px;\n  border-top: 1px solid #c5c7b7;\n}\n\n.cinema-ticket .cinema-ticket-label {\n  display: block;\n  color: #526052;\n  font-size: 18px;\n}\n\n.ticket-name {\n  display: block;\n  margin-top: 3px;\n  font-size: 29px;\n  font-weight: 600;\n  overflow-wrap: anywhere;\n}\n\n.ticket-status {\n  margin-top: 19px;\n  font-size: 18px;\n}\n\n.name-hint {\n  margin-top: 14px;\n  font-size: 18px;\n}\n\n.name-hint:empty {\n  display: none;\n}\n\n.cinema-ticket.is-confirmed .ticket-status {\n  color: #24583b;\n  font-size: 23px;\n  font-weight: 600;\n}\n\n.cinema-ticket-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 12px;\n  margin-top: 20px;\n}\n\n.cinema-ticket-actions > * {\n  flex: 1 1 200px;\n}\n\n.cancel-button {\n  display: none;\n  margin-top: 14px;\n  width: 100%;\n}\n\n.cinema-ticket.is-confirmed .cancel-button {\n  display: inline-flex;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n.cinema-secondary {\n  border-color: #81917e;\n  color: #25332a;\n  background: transparent;\n}\n\n.cinema-secondary:hover:not(:disabled) {\n  background: #e4e6d7;\n}\n\n.quick-ticket {\n  position: fixed;\n  left: 14px;\n  right: 14px;\n  top: 10px;\n  display: none;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding: 13px 15px;\n  border: 1px solid var(--line);\n  border-radius: 3px;\n  background: var(--page);\n  color: var(--ink);\n  z-index: 5;\n}\n\n.quick-ticket.is-visible {\n  display: flex;\n}\n\n.quick-ticket p {\n  font-size: 19px;\n  line-height: 1.3;\n  font-weight: 500;\n}\n\n.quick-ticket a {\n  flex: 0 0 auto;\n  min-height: 48px;\n  padding: 10px 15px;\n  font-size: 18px;\n}\n\n.is-compact .cinema-hero {\n  min-height: 300px;\n  height: 360px;\n}\n\n.is-compact .cinema-hero-copy {\n  padding: 27px 20px;\n}\n\n.is-compact .cinema-hero h1 {\n  font-size: 45px;\n  letter-spacing: -1.5px;\n}\n\n.is-compact .cinema-header {\n  padding: 18px 20px;\n}\n\n.is-compact .cinema-booking-summary {\n  padding: 23px 20px 28px;\n}\n\n.is-compact .cinema-details {\n  grid-template-columns: 1fr;\n  gap: 15px;\n}\n\n.is-compact .cinema-content {\n  padding: 2px 20px 34px;\n}\n\n.is-compact .cinema-ticket-section {\n  padding: 2px 20px 130px;\n}\n\n.is-compact .cinema-ticket {\n  padding: 23px 18px;\n}\n\n.is-compact .cinema-ticket h3 {\n  font-size: 25px;\n}\n\n@media (max-width: 340px) {\n  .cinema-header {\n    padding: 18px;\n  }\n\n  .cinema-hero-copy {\n    padding: 27px 18px;\n  }\n\n  .cinema-hero h1 {\n    font-size: 43px;\n  }\n\n  .cinema-booking-summary {\n    padding-inline: 18px;\n  }\n\n  .cinema-details {\n    grid-template-columns: 1fr;\n    gap: 15px;\n  }\n\n  .cinema-content {\n    padding-inline: 18px;\n  }\n\n  .cinema-ticket-section         const MEMO_TEXT = "\u003ch3>Событие и обработчик\u003c/h3>\u003cp>Событие сообщает, что произошло. Обработчик — функция с нашими действиями. Передаём её без скобок: браузер вызовет её при событии.\u003c/p>\u003cpre>\u003ccode>nameButton.addEventListener(&quot;click&quot;, askName);\nwindow.addEventListener(&quot;load&quot;, showReady);\nwindow.addEventListener(&quot;resize&quot;, updateLayout);\nwindow.addEventListener(&quot;scroll&quot;, updateQuickTicket);\u003c/code>\u003c/pre>\u003ch3>window и document\u003c/h3>\u003cp>document представляет HTML-страницу: через него ищем элементы. window даёт доступ к событиям окна, его размеру, прокрутке и диалогам. В результате справа собственное окно: его ширина и прокрутка относятся к афише.\u003c/p>\u003ch3>Три диалога\u003c/h3>\u003ctable>\u003cthead>\u003ctr>\u003cth>Метод\u003c/th>\u003cth>Зачем вызываем\u003c/th>\u003cth>Результат\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>prompt\u003c/td>\u003ctd>Получить текст\u003c/td>\u003ctd>Строка или null при отмене\u003c/td>\u003c/tr>\u003ctr>\u003ctd>confirm\u003c/td>\u003ctd>Получить решение\u003c/td>\u003ctd>true при согласии, false при отмене\u003c/td>\u003c/tr>\u003ctr>\u003ctd>alert\u003c/td>\u003ctd>Сообщить информацию\u003c/td>\u003ctd>Ответ для условия не нужен\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3>Отмена ввода\u003c/h3>\u003cpre>\u003ccode>if (visitorName !== null) {\n  // Ввод не отменён — можно работать со строкой.\n}\u003c/code>\u003c/pre>\u003cp>trim() убирает пробелы по краям. Результат сравниваем с пустой строкой \"\". У null этого метода нет, поэтому проверка отмены идёт раньше.\u003c/p>\u003ch3>Согласие до действия\u003c/h3>\u003cpre>\u003ccode>const accepted = window.confirm(question);\n\nif (accepted) {\n  // Действия только после согласия.\n}\u003c/code>\u003c/pre>\u003ch3>Загрузка и изменения окна\u003c/h3>\u003cp>DOMContentLoaded у document сообщает о готовности структуры HTML. load у window — о загрузке страницы           disposeEditor();
          try {
            editorModel = monacoApi.editor.createModel(
              $("#editor").value,
              { html: "html", css: "css", js: "javascript" }[selectedFile],

              model: editorModel,
              theme: "vs-dark",

              automaticLayout: true,

              lineNumbers: "on",
              scrollBeyondLastLine: false,
              folding: false,
              overviewRulerLanes: 0,
              padding: { top: 12, bottom: 10 },
              readOnly: selectedFile !== "js",
              readOnlyMessage: {
                value:
                  "Код предыдущих шагов уже готов. Редактируйте текущее задание вверху.",
              },
              quickSuggestions: { other: true, comments: false, strings: true },
              suggestOnTriggerCharacters: true,
              wordBasedSuggestions: "currentDocument",
              parameterHints: { enabled: true },
              fixedOverflowWidgets: true,
              overflowWidgetsDomNode: $("#editorOverlays"),
            });
            const tail = selectedFile === "js" ? previousCode(current()) : "";
            const head = selectedFile === "js" ? sharedCode(current()) : "";
            const decorations = editorInstance.createDecorationsCollection();
            let validValue = editorInstance.getValue();
            let restoring = false;
            const boundary = () =>
              tail
                ? editorInstance.getValue().length - tail.length
                : editorInstance.getValue().length;
            function protectHistory() {
              if (!tail) return;
              const start = editorModel.getPositionAt(boundary());
              const headerEnd = editorModel.getPositionAt(head.length);
              decorations.set([
                ...(head
                  ? [
                      {
                        range: new monacoApi.Range(
                          1,
                          1,
                          Math.max(1, headerEnd.lineNumber - 1),
                          1,
                        ),
                        options: {
                          isWholeLine: true,
                          className: "previous-code-line",
                        },
                      },
                    ]
                  : []),
                {
                  range: new monacoApi.Range(
                    start.lineNumber + 1,
                    1,
                    editorModel.getLineCount(),
                    1,
                  ),
                  options: {
                    isWholeLine: true,
                    className: "previous-code-line",
                  },
                },
              ]);
              const selection = editorInstance.getSelection();
              const touchesHistory =
                editorModel.getOffsetAt(selection.getEndPosition()) >
                  boundary() ||
                editorModel.getOffsetAt(selection.getStartPosition()) <
                  head.length;
              editorInstance.updateOptions({ readOnly: touchesHistory });
            }
            editorInstance.onDidChangeCursorSelection(protectHistory);
            editorInstance.onDidChangeModelContent(() => {
              if (restoring) return;
              const value = editorInstance.getValue();
              if (
                (head && !value.startsWith(head)) ||
                (tail && !value.endsWith(tail))
              ) {
                const view = editorInstance.saveViewState();
                restoring = true;
                editorInstance.setValue(validValue);
                editorInstance.restoreViewState(view);
                restoring = false;
                protectHistory();
                feedback(
                  "Код предыдущих шагов защищён от изменений. Пишите выше подписи.",
                );
                return;
              }
              validValue = value;
              $("#editor").value = value;
              protectHistory();
              codeChanged();
            });
            if (tail || head) {
              editorInstance.addCommand(
                monacoApi.KeyMod.CtrlCmd | monacoApi.KeyCode.KeyA,
                () => {
                  const end = editorModel.getPositionAt(boundary());
                  editorInstance.setSelection(
                    new monacoApi.Range(
                      editorModel.getPositionAt(head.length).lineNumber,
                      1,
                      end.lineNumber,
                      end.column,
                    ),
                  );
                },
              );
            }
            editorInstance.addCommand(
              monacoApi.KeyMod.CtrlCmd | monacoApi.KeyCode.Enter,
              check,
            );
            const taskStart = editorModel.getPositionAt(head.length);
            editorInstance.setPosition(taskStart);
            editorInstance.setScrollTop(
              Math.max(0, (taskStart.lineNumber - 1) * 22),
            );
            protectHistory();
            $("#monaco").classList.add("ready");
            $("#fallback").style.display = "none";
            const mountedEditor = editorInstance;
            requestAnimationFrame(() => {
              if (editorInstance !== mountedEditor) return;
              mountedEditor.layout();
              mountedEditor.setScrollTop(
                Math.max(0, (taskStart.lineNumber - 2) * 22),
              );
            });
          } catch {
            disposeEditor();
            $("#monaco").classList.remove("ready");
            $("#fallback").style.display = "block";
          }
        }

        function loadMonaco() {

function frameBridge(config) {
          const errors = [];
          const calls = [];
          const messages = [];
          const pending = new Map();
          const responses = [];
          const listeners = [];
          let sequence = 0;
          let lastGesture = 0;
          let domReady = null;
          const send = (type, data) => parent.postMessage({__windowEvents:true, token:config.token, type, data}, "*");
          const waitForLayout = () => new Promise(resolve => setTimeout(resolve, 120));
          async function changeScroll(action) {
            action();
            await waitForLayout();
            // Стабильное уведомление для фоновых проверочных кадров.
            window.dispatchEvent(new Event("scroll"));
            await waitForLayout();
          }
          for (const type of ["pointerdown", "keydown", "click"]) {
            document.addEventListener(type, event => {
              if (event.isTrusted) lastGesture = Date.now();

            const data = event.data;
            if (event.source !== parent || data?.token !== config.token || !data.__windowEvents) return;
            const key = data.data?.id;
            if (data.type === "dialog-result" || data.type === "size-result") {
              const resolve = pending.get(key);
              if (resolve) {
                pending.delete(key);
                lastGesture = Date.now();
                resolve(data.data.value);
              }
            }
          });

            const id = ++sequence;

            if (config.test) {

            }
            if (Date.now() - lastGesture > 15000) {
              return Promise.resolve(kind === "prompt" ? null : kind === "confirm" ? false : undefined);
            }
            return request("dialog", {kind, message:String(message), defaultValue:String(defaultValue)});
          }
          window.prompt = (message, value) => ask("prompt", message, value);
          window.confirm = message => ask("confirm", message);
          window.alert = message => ask("alert", message);
          for (const method of ["log","info","warn","error"]) {
            const original = console[method];
            console[method] = (...args) => {
              const message = args.map(x => typeof x === "object" ? (() => {try{return JSON.stringify(x);}catch{return String(x);}})() : String(x)).join(" ");
              messages.push(message);
              send("log", {method, message});

            };
          }
          window.addEventListener("error", event => {
            const error = {name:event.error?.name || "Ошибка", message:event.message, line:event.lineno};
            errors.push(error);

            errors.push(error);
            send("error", error);
          });
          const selectors = [".season-label",".poster",".cinema-page",".quick-ticket",".ticket-name",".name-hint",".cinema-ticket",".ticket-status",".name-button",".book-button",".cancel-button",".cinema-main-action",".cinema-ticket-section"];
          function snapshot(label) {
            const fields = {};
            for (const selector of selectors) {
              const element = document.querySelector(selector);
              if (!element) continue;
              const css = getComputedStyle(element);
              fields[selector] = {
                text:element.textContent,
                classes:Array.from(element.classList),
                disabled:!!element.disabled,
                hidden:!!element.hidden,
                bottom:element.getBoundingClientRect().bottom,
                top:element.getBoundingClientRect().top,
                display:css.display,
                visibility:css.visibility,
                color:css.color,
                background:css.backgroundColor

            if (!config.test) {
              if (config.startAt) document.querySelector(config.startAt)?.scrollIntoView({behavior:"instant",block:"start"});
              send("ready", {errors}); return;
            }
            if (config.test.initialText) {
              for (const [selector, text] of Object.entries(config.test.initialText)) {
                const element = document.querySelector(selector);
                if (element) element.textContent = text;
              }
            }
            await waitForLayout();
            const timeline = [domReady || snapshot("dom-ready"), snapshot("initial")];
            try {
              for (const op of config.test.ops || []) {
                if (op[0] === "response") responses.push({kind:op[1],value:op[2]});
                if (op[0] === "resize") {
                  await request("frame-size", {width:op[1]});
                  await waitForLayout();
                  window.dispatchEvent(new Event("resize"));
                  await waitForLayout();
                }
                if (op[0] === "scroll") {
                  document.documentElement.style.scrollBehavior = "auto";
                  await changeScroll(() => window.scrollTo({top:op[1],behavior:"instant"}));
                }
                if (op[0] === "edge") {
                  const element = document.querySelector(op[1]);
                  document.documentElement.style.scrollBehavior = "auto";
                  await changeScroll(() => window.scrollTo({top:scrollY + element.getBoundingClientRect().bottom + op[2],behavior:"instant"}));
                }
                if (op[0] === "view") {
                  document.documentElement.style.scrollBehavior = "auto";
                  await changeScroll(() => document.querySelector(op[1]).scrollIntoView({block:"start",behavior:"instant"}));
                }
                if (op[0] === "click") {
                  const element = document.querySelector(op[1]);
                  if (!element) throw Error("Не найден элемент " + op[1]);

                  await waitForLayout();

                if (op[0] === "text") {

                }
