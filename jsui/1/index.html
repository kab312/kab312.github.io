<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Введение в DOM / NEON QUEST</title>
  <style>:root {
  --bg: #f2f5f9;
  --paper: #fff;
  --ink: #203047;
  --muted: #5e6e84;
  --line: #dce3ed;
  --blue: #245fd0;
  --green: #137451;
  --red: #ab303f;
  --code: #152131;
  --shadow: 0 5px 22px #1c355010;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  font:
    15px/1.48 system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  background: var(--bg);
}
body {
  height: 100dvh;
  overflow: hidden;
}
button {
  font: inherit;
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.46;
}
button:focus-visible,
textarea:focus-visible,
summary:focus-visible,
a:focus-visible {
  outline: 3px solid #83a9f3;
  outline-offset: 2px;
}
code,
kbd,
pre {
  font-family: "Cascadia Code", Consolas, monospace;
}
code {
  font-size: 0.92em;
}
p {
  margin: 0 0 10px;
}
p:last-child {
  margin-bottom: 0;
}
.hidden,
[hidden] {
  display: none !important;
}
#shell {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.top {
  height: 62px;
  flex: none;
  padding: 10px 22px;
  background: white;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand {
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}
.logo {
  background: #183357;
  color: #fff;
  border-radius: 9px;
  padding: 5px 9px;
}
.topmeta {
  margin-left: auto;
  display: flex;
  gap: 12px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
}
.meter {
  width: 115px;
  height: 5px;
  background: #e4ebf5;
  border-radius: 9px;
  overflow: hidden;
}
.meter > span {
  display: block;
  height: 100%;
  background: var(--blue);
  transition: width 0.2s;
}
.btn {
  padding: 9px 12px;
  line-height: 1.15;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: #264260;
  font-weight: 650;
}
.btn:hover:not(:disabled) {
  background: #f1f6ff;
}
.btn.small {
  font-size: 12px;
  padding: 7px 10px;
}
.btn.main {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.btn.success {
  background: #e8f6ee;
  border-color: #b5dec8;
  color: #146242;
}
.btn.danger {
  color: #9d3a3a;
  font-size: 12px;
}
.inner {
  width: 100%;
  max-width: 1640px;
  margin: 0 auto;
  padding: 14px 22px 12px;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.eyebrow {
  font-size: 11px;
  color: #3d65a6;
  text-transform: uppercase;
  letter-spacing: 0.055em;
  font-weight: 750;
}
.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
h1 {
  font-size: 25px;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin: 4px 0 0;
}
.intro {
  flex: none;
}
.lesson-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 11px;
}
.brief {
  font-size: 14px;
  color: #3b4e65;
  max-height: 126px;
  overflow: auto;
  line-height: 1.53;
}
.brief code,
.task code {
  background: #e8eef8;
  border-radius: 4px;
  padding: 1px 3px;
  overflow-wrap: anywhere;
}
.task {
  padding: 9px 13px;
  border: 1px solid #cbdcf3;
  border-left: 3px solid var(--blue);
  border-radius: 9px;
  background: #fff;
  max-height: 145px;
  overflow: auto;
  font-size: 14px;
  line-height: 1.5;
}
.task-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #41618d;
  font-weight: 800;
  margin-bottom: 3px;
}
.expected {
  font-size: 12px;
  color: #526d61;
  margin-top: 5px;
}
.expected:before {
  content: "Проверь себя: ";
  font-weight: 750;
}
.workgrid {
  flex: 1;
  min-height: 260px;
  display: grid;
  grid-template-columns: minmax(0, 1.07fr) minmax(0, 0.93fr);
  gap: 13px;
}
.workcard {
  min-width: 0;
  min-height: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cardbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 7px 11px;
  min-height: 42px;
  border-bottom: 1px solid var(--line);
  background: #fafcff;
  flex: none;
}
.filetabs {
  display: flex;
  gap: 4px;
}
.filetab {
  border: 0;
  border-radius: 5px;
  background: transparent;
  font:
    12px Consolas,
    monospace;
  color: #63758a;
  padding: 6px 8px;
}
.filetab[aria-selected="true"] {
  background: #e3ecfb;
  color: #2459b2;
  font-weight: 800;
}
.subtle {
  color: var(--muted);
  font-size: 11px;
}
.editorwrap {
  position: relative;
  flex: 1;
  min-height: 120px;
  background: var(--code);
  overflow: hidden;
}
.fallback {
  position: absolute;
  inset: 0;
  display: block;
  color: #dce7f5;
  font:
    14px/22px "Cascadia Code",
    Consolas,
    monospace;
}
.fallback-gutter {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  z-index: 1;
  width: 38px;
  padding: 12px 7px;
  background: #1b2a3e;
  color: #8496ae;
  white-space: pre;
  text-align: right;
  user-select: none;
  overflow: hidden;
}
.highlight-scroller {
  position: absolute;
  inset: 0 0 0 38px;
  overflow: hidden;
  pointer-events: none;
}
.highlight-pre {
  font: inherit;
  line-height: 22px;
  tab-size: 2;
  padding: 12px 14px;
  margin: 0;
  white-space: pre;
  min-width: max-content;
}
.fallback-textarea {
  position: absolute;
  inset: 0 0 0 38px;
  width: calc(100% - 38px);
  height: 100%;
  border: 0;
  outline: none !important;
  background: transparent;
  color: transparent;
  -webkit-text-fill-color: transparent;
  caret-color: #fff;
  font: inherit;
  line-height: 22px;
  tab-size: 2;
  white-space: pre;
  resize: none;
  padding: 12px 14px;
  z-index: 2;
  overflow: auto;
}
.fallback-textarea::selection {
  background: #456fa399;
}
.syn-string {
  color: #addc9b;
}
.syn-keyword {
  color: #c4b0f7;
}
.syn-func {
  color: #87d1f6;
}
.syn-comment {
  color: #91a3bb;
}
.syn-tag {
  color: #87d1f6;
}
.syn-number {
  color: #efc792;
}
.monaco-host {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: none;
}
.monaco-host.ready {
  display: block;
}
.actions {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  flex: none;
}
.actions .edit-note {
  font-size: 11px;
  color: var(--muted);
  margin-left: auto;
}
.feedback {
  border-top: 1px solid var(--line);
  background: #f6f9fe;
  color: #3d5676;
  padding: 9px 12px;
  font-size: 13px;
  min-height: 40px;
  max-height: 90px;
  overflow: auto;
  flex: none;
}
.feedback.good {
  background: #eaf8f0;
  color: #146344;
}
.feedback.bad {
  background: #fff0ef;
  color: #9e2635;
}
.hint {
  flex: none;
  max-height: 130px;
  overflow: auto;
  padding: 9px 12px;
  background: #edf4ff;
  border-top: 1px solid #cfddf2;
  font-size: 13px;
}
.hint pre {
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  margin: 7px 0 0;
  color: #1b4075;
}
.preview-frame {
  flex: 1;
  display: block;
  width: 100%;
  border: 0;
  min-height: 130px;
  background: white;
}
.inspector {
  height: 147px;
  flex: none;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--line);
}
.inspect-tabs {
  display: flex;
  align-items: center;
  background: #f6f9fd;
  padding: 4px 8px;
  border-bottom: 1px solid var(--line);
  gap: 5px;
  flex: none;
}
.inspect-tab {
  font-size: 11px;
  padding: 4px 7px;
  border: 0;
  background: transparent;
  color: #536c88;
  border-radius: 5px;
}
.inspect-tab[aria-selected="true"] {
  background: #dfebff;
  color: #2459b2;
  font-weight: 750;
}
.inspect-body {
  min-height: 0;
  overflow: auto;
  flex: 1;
}
.inspector .tree {
  padding: 6px 10px;
}
.tree-row {
  display: block;
  border: 0;
  background: transparent;
  border-radius: 4px;
  color: #365375;
  font:
    11px/1.5 Consolas,
    monospace;
  text-align: left;
  padding: 1px 6px;
  max-width: 100%;
  white-space: nowrap;
}
.tree-row:hover,
.tree-row[aria-pressed="true"] {
  background: #deebff;
  color: #174898;
}
.tree-note {
  font-size: 10px;
  color: #63758b;
  padding: 2px 10px 5px;
}
.node-note {
  font-size: 11px;
  padding: 5px 10px;
  background: #edf4ff;
  color: #2c4f77;
}
.console {
  background: #192638;
  color: #d8eaff;
  font:
    12px/1.5 Consolas,
    monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
  padding: 9px 12px;
  min-height: 100%;
}
.compare {
  padding: 7px 11px;
  font-size: 11px;
}
.compare strong {
  font-size: 10px;
  letter-spacing: 0.02em;
  color: #5a6f89;
}
.compare pre {
  margin: 2px 0 6px;
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-word;
  color: #294e80;
}
.nav {
  flex: none;
  height: 59px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 22px;
  background: white;
  border-top: 1px solid var(--line);
}
.nav .spacer {
  flex: 1;
}
.nav-note {
  font-size: 11px;
  color: var(--muted);
}
dialog {
  border: 1px solid #d1ddeb;
  border-radius: 15px;
  padding: 0;
  color: var(--ink);
  width: min(760px, calc(100vw - 28px));
  max-height: calc(100dvh - 32px);
  box-shadow: 0 20px 100px #122b4a40;
}
dialog::backdrop {
  background: #10213c66;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 20px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: white;
  z-index: 1;
}
.dialog-head h2 {
  font-size: 19px;
  line-height: 1.3;
  margin: 0;
}
.dialog-content {
  padding: 18px 22px;
  font-size: 15px;
  line-height: 1.65;
}
.dialog-content h3 {
  font-size: 16px;
  margin: 18px 0 7px;
}
.dialog-content h3:first-child {
  margin-top: 0;
}
.dialog-content code {
  background: #eef3fb;
  border-radius: 4px;
  padding: 1px 4px;
  overflow-wrap: anywhere;
}
.dialog-content pre {
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #18283f;
  color: #dce9fc;
  padding: 14px;
  border-radius: 9px;
}
.dialog-content pre code {
  background: none;
  color: inherit;
  padding: 0;
}
.dialog-content dl {
  display: grid;
  grid-template-columns: minmax(90px, 0.7fr) minmax(0, 1.5fr);
  gap: 9px 16px;
}
.dialog-content dt {
  font-weight: 700;
  overflow-wrap: anywhere;
}
.dialog-content dd {
  margin: 0;
  min-width: 0;
}
.reason {
  padding: 11px 13px;
  border-left: 3px solid #4c83d4;
  background: #eef5ff;
  border-radius: 0 7px 7px 0;
}
.pitfall {
  padding: 10px 13px;
  background: #fff7e9;
  border-radius: 7px;
}
.dialog-content a {
  color: #245fd0;
}
.step-list {
  display: grid;
  gap: 6px;
}
.step-link {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: white;
  padding: 9px 11px;
  display: flex;
  gap: 10px;
  color: #304c70;
  text-align: left;
}
.step-link.current {
  background: #edf4ff;
  border-color: #88ade5;
}
.step-link .step-num {
  font-weight: 800;
  min-width: 23px;
}
.step-link .step-done {
  margin-left: auto;
  color: var(--green);
}
.finish {
  background: white;
  border: 1px solid #cbdcf2;
  border-radius: 13px;
  padding: 22px;
  overflow: auto;
  flex: 1;
}
.finish h2 {
  margin: 0 0 10px;
}
.finish .skills {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 15px 0;
}
.skill {
  padding: 12px 15px;
  background: #f1f6fd;
  border-radius: 8px;
}
.skill code {
  display: block;
  color: #275da6;
  margin-bottom: 4px;
  font-size: 13px;
}
.finish-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}
.finish details {
  margin-top: 16px;
}
.finish ol {
  padding-left: 23px;
}
.finish li {
  margin: 5px 0;
}
@media (max-height: 745px) and (min-width: 761px) {
  .top {
    height: 54px;
  }
  .inner {
    padding-top: 9px;
    gap: 9px;
  }
  h1 {
    font-size: 22px;
  }
  .lesson-top {
    margin-top: 7px;
    gap: 14px;
  }
  .brief {
    font-size: 13px;
    max-height: 119px;
  }
  .task {
    font-size: 13px;
    padding: 7px 10px;
    max-height: 131px;
  }
  .nav {
    height: 54px;
  }
  .inspector {
    height: 129px;
  }
  .feedback {
    padding: 7px 11px;
  }
  .expected {
    font-size: 11px;
  }
}
@media (max-width: 760px) {
  body {
    height: auto;
    min-height: 100dvh;
    overflow: auto;
  }
  .top {
    height: auto;
    min-height: 58px;
    padding: 9px 12px;
    flex-wrap: wrap;
    gap: 7px;
  }
  .brand {
    font-size: 14px;
  }
  .topmeta {
    font-size: 11px;
    gap: 6px;
  }
  .meter {
    width: 55px;
  }
  .top .btn {
    font-size: 11px;
    padding: 6px 8px;
  }
  .inner {
    padding: 14px 12px;
  }
  .heading {
    align-items: flex-start;
  }
  h1 {
    font-size: 22px;
  }
  .lesson-top {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .brief,
  .task {
    max-height: none;
  }
  .workgrid {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .workcard {
    height: 405px;
    flex: none;
  }
  .editorwrap {
    min-height: 200px;
  }
  .workcard.preview-card {
    height: 410px;
  }
  .inspector {
    height: 150px;
  }
  .nav {
    height: auto;
    min-height: 58px;
    position: sticky;
    bottom: 0;
    padding: 9px 11px;
    gap: 7px;
    z-index: 5;
  }
  .nav .btn {
    font-size: 12px;
    padding: 9px 10px;
  }
  .nav-note {
    display: none;
  }
  .actions .edit-note {
    font-size: 10px;
  }
  .dialog-content {
    padding: 15px 17px;
  }
  .dialog-content dl {
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .dialog-content dd {
    margin-bottom: 9px;
  }
  .finish .skills {
    grid-template-columns: 1fr;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

.top {
  gap: 10px;
}
.topmeta {
  gap: 8px;
}
.preview-tools {
  display: flex;
  gap: 6px;
  align-items: center;
}
.preview-note {
  flex: none;
  padding: 7px 11px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted);
  background: #fafcff;
}
.runtime-errors {
  flex: none;
  padding: 7px 11px;
  background: #fff0ef;
  color: #9e2635;
  font-size: 12px;
  max-height: 80px;
  overflow: auto;
}
.preview-card > .console {
  flex: none;
  height: 105px;
  min-height: 0;
  border-top: 1px solid #35475f;
}
.dialog-content table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.dialog-content th,
.dialog-content td {
  text-align: left;
  vertical-align: top;
  padding: 8px;
  border-bottom: 1px solid var(--line);
}
.dialog-content th {
  background: #f2f6fc;
}
.dialog-content .experiment-box {
  background: #f3f7fc;
  border: 1px solid #cfdaea;
  padding: 14px;
  border-radius: 9px;
  margin: 12px 0;
}
.experiment-input {
  width: 100%;
  max-width: 420px;
  font: 16px/1.4 inherit;
  border: 1px solid #91acd0;
  border-radius: 7px;
  padding: 9px 11px;
  margin: 8px 0;
}
.experiment-result {
  min-height: 40px;
  padding: 9px 11px;
  background: #fff;
  border-radius: 6px;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.experiment-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0;
}
.step-group {
  margin: 14px 0 5px;
  color: #44648d;
  font-size: 12px;
  font-weight: 750;
}
.step-link .step-done {
  white-space: nowrap;
}
.score-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.score-card {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f6f9fe;
}
.score-card.done {
  background: #edf8f1;
  border-color: #b5d9c3;
}
.score-card strong {
  font-size: 22px;
  display: block;
  margin-bottom: 5px;
}
.result-grade {
  font-size: 22px;
  font-weight: 750;
  margin: 12px 0;
}
.result-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0;
}
.finish pre {
  white-space: pre-wrap;
  background: #eff4fb;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
}
.small-note {
  font-size: 12px;
  color: var(--muted);
}
.theory-check {
  padding: 11px 13px;
  background: #eef5ff;
  border-radius: 8px;
  margin-top: 13px;
}
.source-link {
  font-size: 12px;
  color: #47698c;
}
.feedback {
  max-height: 82px;
}
.dialog-content pre {
  tab-size: 2;
}
@media (max-height: 745px) and (min-width: 761px) {
  .top {
    height: 51px;
    padding-top: 8px;
    padding-bottom: 8px;
  }
  .inner {
    padding-top: 8px;
    padding-bottom: 8px;
    gap: 8px;
  }
  .lesson-top {
    margin-top: 6px;
  }
  .brief {
    max-height: 98px;
  }
  .task {
    max-height: 112px;
  }
  h1 {
    font-size: 21px;
  }
  .nav {
    height: 51px;
  }
  .preview-note {
    padding: 5px 10px;
    font-size: 11px;
  }
  .cardbar {
    min-height: 39px;
    padding: 5px 10px;
  }
  .actions {
