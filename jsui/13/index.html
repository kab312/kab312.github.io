<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Что было в кадре? — асинхронный мини-проект</title>
    <style>
      :root {
        --bg: #f2f5f9;
        --paper: #fff;
        --ink: #203047;
        --muted: #5e6e84;
        --line: #dce3ed;
        --blue: #245fd0;
        --green: #137451;
        --red: #ab303f;
        --code: #152131;
        --shadow: 0 5px 22px #1c355010;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        font:
          15px/1.48 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      body {
        height: 100dvh;
        overflow: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.46;
      }
      button:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 3px solid #83a9f3;
        outline-offset: 2px;
      }
      code,
      kbd,
      pre {
        font-family: "Cascadia Code", Consolas, monospace;
      }
      code {
        font-size: 0.92em;
      }
      p {
        margin: 0 0 10px;
      }
      p:last-child {
        margin-bottom: 0;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      #shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .top {
        height: 62px;
        flex: none;
        padding: 10px 22px;
        background: white;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand {
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }
      .logo {
        background: #183357;
        color: #fff;
        border-radius: 9px;
        padding: 5px 9px;
      }
      .topmeta {
        margin-left: auto;
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .meter {
        width: 115px;
        height: 5px;
        background: #e4ebf5;
        border-radius: 9px;
        overflow: hidden;
      }
      .meter > span {
        display: block;
        height: 100%;
        background: var(--blue);
        transition: width 0.2s;
      }
      .btn {
        padding: 9px 12px;
        line-height: 1.15;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: #264260;
        font-weight: 650;
      }
      .btn:hover:not(:disabled) {
        background: #f1f6ff;
      }
      .btn.small {
        font-size: 12px;
        padding: 7px 10px;
      }
      .btn.main {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .btn.success {
        background: #e8f6ee;
        border-color: #b5dec8;
        color: #146242;
      }
      .btn.danger {
        color: #9d3a3a;
        font-size: 12px;
      }
      .inner {
        width: 100%;
        max-width: 1640px;
        margin: 0 auto;
        padding: 14px 22px 12px;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .eyebrow {
        font-size: 11px;
        color: #3d65a6;
        text-transform: uppercase;
        letter-spacing: 0.055em;
        font-weight: 750;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      h1 {
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin: 4px 0 0;
      }
      .intro {
        flex: none;
      }
      .lesson-top {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 11px;
      }
      .brief {
        font-size: 14px;
        color: #3b4e65;
        max-height: 126px;
        overflow: auto;
        line-height: 1.53;
      }
      .brief code,
      .task code {
        background: #e8eef8;
        border-radius: 4px;
        padding: 1px 3px;
        overflow-wrap: anywhere;
      }
      .task {
        padding: 9px 13px;
        border: 1px solid #cbdcf3;
        border-left: 3px solid var(--blue);
        border-radius: 9px;
        background: #fff;
        max-height: 145px;
        overflow: auto;
        font-size: 14px;
        line-height: 1.5;
      }
      .task-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #41618d;
        font-weight: 800;
        margin-bottom: 3px;
      }
      .expected {
        font-size: 12px;
        color: #526d61;
        margin-top: 5px;
      }
      .expected:before {
        content: "Проверьте себя: ";
        font-weight: 750;
      }
      .workgrid {
        flex: 1;
        min-height: 260px;
        display: grid;
        grid-template-columns: minmax(0, 1.07fr) minmax(0, 0.93fr);
        gap: 13px;
      }
      .workcard {
        min-width: 0;
        min-height: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .cardbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        padding: 7px 11px;
        min-height: 42px;
        border-bottom: 1px solid var(--line);
        background: #fafcff;
        flex: none;
      }
      .filetabs {
        display: flex;
        gap: 4px;
      }
      .filetab {
        border: 0;
        border-radius: 5px;
        background: transparent;
        font:
          12px Consolas,
          monospace;
        color: #63758a;
        padding: 6px 8px;
      }
      .filetab[aria-selected="true"] {
        background: #e3ecfb;
        color: #2459b2;
        font-weight: 800;
      }
      .subtle {
        color: var(--muted);
        font-size: 11px;
      }
      .editorwrap {
        position: relative;
        flex: 1;
        min-height: 120px;
        background: var(--code);
        overflow: hidden;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: block;
        color: #dce7f5;
        font:
          14px/22px "Cascadia Code",
          Consolas,
          monospace;
      }
      .fallback-gutter {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 1;
        width: 38px;
        padding: 12px 7px;
        background: #1b2a3e;
        color: #8496ae;
        white-space: pre;
        text-align: right;
        user-select: none;
        overflow: hidden;
      }
      .highlight-scroller {
        position: absolute;
        inset: 0 0 0 38px;
        overflow: hidden;
        pointer-events: none;
      }
      .highlight-pre {
        font: inherit;
        line-height: 22px;
        tab-size: 2;
        padding: 12px 14px;
        margin: 0;
        white-space: pre;
        min-width: max-content;
      }
      .fallback-textarea {
        position: absolute;
        inset: 0 0 0 38px;
        width: calc(100% - 38px);
        height: 100%;
        border: 0;
        outline: none !important;
        background: transparent;
        color: transparent;
        -webkit-text-fill-color: transparent;
        caret-color: #fff;
        font: inherit;
        line-height: 22px;
        tab-size: 2;
        white-space: pre;
        resize: none;
        padding: 12px 14px;
        z-index: 2;
        overflow: auto;
      }
      .fallback-textarea::selection {
        background: #456fa399;
      }
      .syn-string {
        color: #addc9b;
      }
      .syn-keyword {
        color: #c4b0f7;
      }
      .syn-func {
        color: #87d1f6;
      }
      .syn-comment {
        color: #91a3bb;
      }
      .syn-tag {
        color: #87d1f6;
      }
      .syn-number {
        color: #efc792;
      }
      .monaco-host {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: none;
      }
      .monaco-host.ready {
        display: block;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        flex: none;
      }
      .actions .edit-note {
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
      }
      .feedback {
        border-top: 1px solid var(--line);
        background: #f6f9fe;
        color: #3d5676;
        padding: 9px 12px;
        font-size: 13px;
        min-height: 40px;
        max-height: 90px;
        overflow: auto;
        flex: none;
      }
      .feedback.good {
        background: #eaf8f0;
        color: #146344;
      }
      .feedback.bad {
        background: #fff0ef;
        color: #9e2635;
      }
      .hint {
        flex: none;
        max-height: 130px;
        overflow: auto;
        padding: 9px 12px;
        background: #edf4ff;
        border-top: 1px solid #cfddf2;
        font-size: 13px;
      }
      .hint pre {
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        margin: 7px 0 0;
        color: #1b4075;
      }
      .preview-frame {
        flex: 1;
        display: block;
        width: 100%;
        border: 0;
        min-height: 130px;
        background: white;
      }
      .inspector {
        height: 147px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--line);
      }
      .inspect-tabs {
        display: flex;
        align-items: center;
        background: #f6f9fd;
        padding: 4px 8px;
        border-bottom: 1px solid var(--line);
        gap: 5px;
        flex: none;
      }
      .inspect-tab {
        font-size: 11px;
        padding: 4px 7px;
        border: 0;
        background: transparent;
        color: #536c88;
        border-radius: 5px;
      }
      .inspect-tab[aria-selected="true"] {
        background: #dfebff;
        color: #2459b2;
        font-weight: 750;
      }
      .inspect-body {
        min-height: 0;
        overflow: auto;
        flex: 1;
      }
      .inspector .tree {
        padding: 6px 10px;
      }
      .tree-row {
        display: block;
        border: 0;
        background: transparent;
        border-radius: 4px;
        color: #365375;
        font:
          11px/1.5 Consolas,
          monospace;
        text-align: left;
        padding: 1px 6px;
        max-width: 100%;
        white-space: nowrap;
      }
      .tree-row:hover,
      .tree-row[aria-pressed="true"] {
        background: #deebff;
        color: #174898;
      }
      .tree-note {
        font-size: 10px;
        color: #63758b;
        padding: 2px 10px 5px;
      }
      .node-note {
        font-size: 11px;
        padding: 5px 10px;
        background: #edf4ff;
        color: #2c4f77;
      }
      .console {
        background: #192638;
        color: #d8eaff;
        font:
          12px/1.5 Consolas,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        padding: 9px 12px;
        min-height: 100%;
      }
      .compare {
        padding: 7px 11px;
        font-size: 11px;
      }
      .compare strong {
        font-size: 10px;
        letter-spacing: 0.02em;
        color: #5a6f89;
      }
      .compare pre {
        margin: 2px 0 6px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #294e80;
      }
      .nav {
        flex: none;
        height: 59px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 22px;
        background: white;
        border-top: 1px solid var(--line);
      }
      .nav .spacer {
        flex: 1;
      }
      .nav-note {
        font-size: 11px;
        color: var(--muted);
      }
      dialog {
        border: 1px solid #d1ddeb;
        border-radius: 15px;
        padding: 0;
        color: var(--ink);
        width: min(760px, calc(100vw - 28px));
        max-height: calc(100dvh - 32px);
        box-shadow: 0 20px 100px #122b4a40;
      }
      dialog::backdrop {
        background: #10213c66;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: white;
        z-index: 1;
      }
      .dialog-head h2 {
        font-size: 19px;
        line-height: 1.3;
        margin: 0;
      }
      .dialog-content {
        padding: 18px 22px;
        font-size: 15px;
        line-height: 1.65;
      }
      .dialog-content h3 {
        font-size: 16px;
        margin: 18px 0 7px;
      }
      .dialog-content h3:first-child {
        margin-top: 0;
      }
      .dialog-content code {
        background: #eef3fb;
        border-radius: 4px;
        padding: 1px 4px;
        overflow-wrap: anywhere;
      }
      .dialog-content pre {
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #18283f;
        color: #dce9fc;
        padding: 14px;
        border-radius: 9px;
      }
      .dialog-content pre code {
        background: none;
        color: inherit;
        padding: 0;
      }
      .dialog-content dl {
        display: grid;
        grid-template-columns: minmax(90px, 0.7fr) minmax(0, 1.5fr);
        gap: 9px 16px;
      }
      .dialog-content dt {
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .dialog-content dd {
        margin: 0;
        min-width: 0;
      }
      .reason {
        padding: 11px 13px;
        border-left: 3px solid #4c83d4;
        background: #eef5ff;
        border-radius: 0 7px 7px 0;
      }
      .pitfall {
        padding: 10px 13px;
        background: #fff7e9;
        border-radius: 7px;
      }
      .dialog-content a {
        color: #245fd0;
      }
      .step-list {
        display: grid;
        gap: 6px;
      }
      .step-link {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: white;
        padding: 9px 11px;
        display: flex;
        gap: 10px;
        color: #304c70;
        text-align: left;
      }
      .step-link.current {
        background: #edf4ff;
        border-color: #88ade5;
      }
      .step-link .step-num {
        font-weight: 800;
        min-width: 23px;
      }
      .step-link .step-done {
        margin-left: auto;
        color: var(--green);
      }
      .finish {
        background: white;
        border: 1px solid #cbdcf2;
        border-radius: 13px;
        padding: 22px;
        overflow: auto;
        flex: 1;
      }
      .finish h2 {
        margin: 0 0 10px;
      }
      .finish .skills {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 15px 0;
      }
      .skill {
        padding: 12px 15px;
        background: #f1f6fd;
        border-radius: 8px;
      }
      .skill code {
        display: block;
        color: #275da6;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .finish-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .finish details {
        margin-top: 16px;
      }
      .finish ol {
        padding-left: 23px;
      }
      .finish li {
        margin: 5px 0;
      }
      @media (max-height: 745px) and (min-width: 761px) {
        .top {
          height: 54px;
        }
        .inner {
          padding-top: 9px;
          gap: 9px;
        }
        h1 {
          font-size: 22px;
        }
        .lesson-top {
          margin-top: 7px;
          gap: 14px;
        }
        .brief {
          font-size: 13px;
          max-height: 119px;
        }
        .task {
          font-size: 13px;
          padding: 7px 10px;
          max-height: 131px;
        }
        .nav {
          height: 54px;
        }
        .inspector {
          height: 129px;
        }
        .feedback {
          padding: 7px 11px;
        }
        .expected {
          font-size: 11px;
        }
      }
      @media (max-width: 760px) {
        body {
          height: auto;
          min-height: 100dvh;
          overflow: auto;
        }
        .top {
          height: auto;
          min-height: 58px;
          padding: 9px 12px;
          flex-wrap: wrap;
          gap: 7px;
        }
        .brand {
          font-size: 14px;
        }
        .topmeta {
          font-size: 11px;
          gap: 6px;
        }
        .meter {
          width: 55px;
        }
        .top .btn {
          font-size: 11px;
          padding: 6px 8px;
        }
        .inner {
          padding: 14px 12px;
        }
        .heading {
          align-items: flex-start;
        }
        h1 {
          font-size: 22px;
        }
        .lesson-top {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .brief,
        .task {
          max-height: none;
        }
        .workgrid {
          display: flex;
          flex-direction: column;
          min-height: 0;
        }
        .workcard {
          height: 405px;
          flex: none;
        }
        .editorwrap {
          min-height: 200px;
        }
        .workcard.preview-card {
          height: 410px;
        }
        .inspector {
          height: 150px;
        }
        .nav {
          height: auto;
          min-height: 58px;
          position: sticky;
          bottom: 0;
          padding: 9px 11px;
          gap: 7px;
          z-index: 5;
        }
        .nav .btn {
          font-size: 12px;
          padding: 9px 10px;
        }
        .nav-note {
          display: none;
        }
        .actions .edit-note {
          font-size: 10px;
        }
        .dialog-content {
          padding: 15px 17px;
        }
        .dialog-content dl {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        .dialog-content dd {
          margin-bottom: 9px;
        }
        .finish .skills {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }

      /* Размеры и поведение сохраняют оформление предыдущего занятия. */
      .top {
        gap: 10px;
      }
      .topmeta {
        gap: 8px;
      }
      .preview-tools {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .preview-note {
        flex: none;
        padding: 7px 11px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        background: #fafcff;
      }
      .runtime-errors {
        flex: none;
        padding: 7px 11px;
        background: #fff0ef;
        color: #9e2635;
        font-size: 12px;
        max-height: 80px;
        overflow: auto;
      }
      .preview-card > .console {
        flex: none;
        height: 105px;
        min-height: 0;
        border-top: 1px solid #35475f;
      }
      .dialog-content table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .dialog-content th,
      .dialog-content td {
        text-align: left;
        vertical-align: top;
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-content th {
        background: #f2f6fc;
      }
      .dialog-content .experiment-box {
        background: #f3f7fc;
        border: 1px solid #cfdaea;
        padding: 14px;
        border-radius: 9px;
        margin: 12px 0;
      }
      .experiment-input {
        width: 100%;
        max-width: 420px;
        font: 16px/1.4 inherit;
        border: 1px solid #91acd0;
        border-radius: 7px;
        padding: 9px 11px;
        margin: 8px 0;
      }
      .experiment-result {
        min-height: 40px;
        padding: 9px 11px;
        background: #fff;
        border-radius: 6px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .experiment-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .step-group {
        margin: 14px 0 5px;
        color: #44648d;
        font-size: 12px;
        font-weight: 750;
      }
      .step-link .step-done {
        white-space: nowrap;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0;
      }
      .score-card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f6f9fe;
      }
      .score-card.done {
        background: #edf8f1;
        border-color: #b5d9c3;
      }
      .score-card strong {
        font-size: 22px;
        display: block;
        margin-bottom: 5px;
      }
      .result-grade {
        font-size: 22px;
        font-weight: 750;
        margin: 12px 0;
      }
      .result-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      .finish pre {
        white-space: pre-wrap;
        background: #eff4fb;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
      }
      .small-note {
        font-size: 12px;
        color: var(--muted);
      }
      .theory-check {
        padding: 11px 13px;
        background: #eef5ff;
        border-radius: 8px;
        margin-top: 13px;
      }

  <body>
    <div id="shell">
      <header class="top">
        <div class="brand">
          <span class="logo">{ JS }</span> Что было в кадре?
        </div>
        <div class="topmeta">
          <span id="lessonCount"></span>

            class="meter"
            role="progressbar"

            aria-valuemin="0"
            aria-valuemax="14"

            <span id="progress"></span>
          </div>
          <button class="btn small" id="stepsBtn">Шаги</button
          ><button class="btn small" id="memoBtn">Памятка</button
          ><button id="resetProgress" class="btn small danger">
            Сбросить прогресс
          </button>
        </div>
      </header>
      <main class="inner">
        <section class="intro">
          <div class="heading">
            <h1 id="headline"></h1>
          </div>
          <div class="lesson-top">
            <div id="brief" class="brief"></div>
            <div class="task">
              <div class="task-label">Задание</div>
              <div id="taskText"></div>
              <div id="expected" class="expected"></div>
            </div>
          </div>
        </section>
        <section class="workgrid" aria-label="Редактор и результат">
          <div class="workcard editor-card">
            <div class="cardbar">
              <div class="filetabs" role="tablist" aria-label="Файлы проекта">
                <button class="filetab" data-file="html" role="tab">
                  index.html</button
                ><button class="filetab" data-file="js" role="tab">
                  script.js</button
                ><button class="filetab" data-file="css" role="tab">
                  style.css
                </button>
              </div>
              <button id="resetStep" class="btn small">Сбросить шаг</button>
            </div>
            <div class="editorwrap">
              <div class="fallback" id="fallback">
                <div class="fallback-gutter" id="gutter"></div>
                <div class="highlight-scroller" id="highlightScroll">
                  <div class="solution-highlights" id="solutionHighlights" aria-hidden="true"></div>
                  <pre class="highlight-pre" id="highlight"></pre>
                </div>
                <textarea
                  id="editor"
                  class="fallback-textarea"
                  spellcheck="false"
                  autocapitalize="off"
                  autocomplete="off"
                  aria-label="Редактор кода"
                ></textarea>
              </div>
              <div class="monaco-host" id="monaco"></div>
            </div>
            <div class="actions">
              <button class="btn success" id="checkBtn">Проверить</button
              ><button
                class="btn"
                id="hintBtn"
                aria-expanded="false"
                aria-controls="hint"
              >
                Подсказка</button
              ><span id="editNote" class="edit-note"></span>
            </div>
            <div id="hint" class="hint" hidden></div>
            <div
              id="feedback"
              class="feedback"
              role="status"
              aria-live="polite"
            ></div>
          </div>
          <div class="workcard preview-card">
            <div class="cardbar">
              <strong id="previewLabel" style="font-size: 15px"></strong>
              <div class="preview-tools">
                <button class="btn small" id="experimentBtn" hidden>Опыт</button
                ><button
                  class="btn small"
                  id="consoleBtn"
                  aria-expanded="false"
                >
                  Консоль
                </button>
              </div>
            </div>
            <iframe
              class="preview-frame"
              id="preview"
              title="Страница результата"
              sandbox="allow-scripts allow-forms"
              referrerpolicy="no-referrer"
            ></iframe>
            <div
              class="runtime-errors"
              id="runtimeErrors"
              role="status"
              hidden
            ></div>
            <pre class="console" id="console" hidden></pre>
            <div class="preview-note" id="previewNote" hidden>
              
            </div>
          </div>
        </section>
        <section class="finish" id="finish" hidden></section>
      </main>
      <nav class="nav" aria-label="Переход между шагами">
        <div class="nav-controls">
          <button id="prev" class="btn">Назад</button>
          <button id="explainBtn" class="btn">Объяснение и пример</button>
          <button id="next" class="btn main">Далее</button>
        </div>
      </nav>
    </div>
    <div
      id="editorOverlays"
      class="monaco-editor vs-dark editor-overlays"
    ></div>
    <dialog id="infoDialog">
      <div class="dialog-head">
        <h2 id="dialogTitle"></h2>
        <button class="btn small" id="closeDialog">Закрыть</button>
      </div>
      <div class="dialog-content" id="dialogContent"></div>

[{"id":"v-kadre-grow-01","stage":1,"testKey":1,"kind":"learn","markup":1,"title":"Открываем фото по клику","brief":"\u003cp>В игре нужно рассмотреть фото и ответить по памяти. Начнём с кнопки.\u003c/p>","task":"\u003cp>Замените комментарий внутри \u003ccode>playRound\u003c/code> на \u003ccode>showScreen(\"photo\")\u003c/code>.\u003c/p>","expected":"Кнопка «Смотреть кадр» открывает фотографию.","expectedHtml":"Кнопка «Смотреть кадр» открывает фотографию.","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  // Откройте экран с фотографией.\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n","solutionFocusLine":8,"intro":false,"previewLabel":"Игра","explain":"\u003cp>Начальный экран с кнопкой называется \u003ccode>ready\u003c/code>, а экран с фотографией — \u003ccode>photo\u003c/code>. Эти имена записаны в атрибутах \u003ccode>data-screen\u003c/code> на вкладке \u003ccode>index.html\u003c/code>. Готовая функция \u003ccode>showScreen(\"photo\")\u003c/code> показывает экран с этим именем и скрывает остальные.\u003c/p>\u003cp>Строка \u003ccode>startButton.onclick = playRound\u003c/code> уже подключает кнопку «Смотреть dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n","solutionFocusLine":9,"intro":false,"previewLabel":"Игра","explain":"\u003cp>При клике первой срабатывает строка \u003ccode>showScreen(\"photo\")\u003c/code>. Сразу после неё добавьте таймер. Он оставит игроку пять секунд, чтобы рассмотреть геймпад.\u003c/p>\u003cp>У \u003ccode>setTimeout\u003c/code> два аргумента. Первый — функция, которую браузер запустит один раз. В её фигурных скобках вызовите \u003ccode>showScreen(\"question\")\u003c/code>. Второй аргумент — задержка в миллисекундах. Передайте \u003ccode>5000\u003c/code>, потому что в пяти секундах 5000 миллисекунд.\u003c/p>\u003cp>Вызов \u003ccode>setTimeout\u003c/code> только ставит функцию в очередь на потом. Когда время пройдёт, браузер выполнит команду внутри неё и покажет экран \u003ccode>question\u003c/code> с тремя кнопками.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>setTimeout(function () {\n  showScreen(&quot;question&quot;);\n}, 5000);\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Нажмите «Смотреть кадр». Сначала появится фото. Примерно через пять секунд его сменит вопрос «Какого цвета был геймпад?».\u003c/p>","hints":[{"text":"Вставьте setTimeout сразу после showScreen(\"photo\") внутри playRound."},{"text":"Поместите showScreen(\"question\") в тело функции таймера и передайте 5000 вторым аргументом."}]},{"id":"v-kadre-parts-03","stage":3,"testKey":3,"kind":"learn","markup":2,"title":"Объявляем функцию для ответа","brief":"\u003cp>Три кнопки будут обращаться к одной функции. Она покажет итог раунда.\u003c/p>","task":"\u003cp>В конце файла объявите пустую функцию \u003ccode>showResult(answer, correctAnswer)\u003c/code>.\u003c/p>","expected":"Проверка находит `showResult` с двумя параметрами и пустым телом.", /code> после строки \u003ccode>startButton.onclick = playRound\u003c/code>. Перечислите два параметра в круглых скобках. Фигурные скобки оставьте пустыми. Подключение кнопок и результат появятся на следующих шагах.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>function showResult(answer, correctAnswer) {\n}\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Нажмите «Проверить». Интерактив проверит имя функции, два параметра и пустое тело между фигурными скобками.\u003c/p>","hints":[{"text":"В скобках объявления перечислите answer и correctAnswer через запятую."},{"text":"После круглых скобок поставьте пустые фигурные скобки."}]},{"id":"v-kadre-parts-04","stage":4,"testKey":4,"kind":"learn","markup":2,"title":"Подключаем кнопки к функции","brief":"\u003cp>Нажатие на любой вариант передаст в \u003ccode>showResult\u003c/code> две строки.\u003c/p>","task":"\u003cp>Ниже \u003ccode>showResult\u003c/code> найдите кнопки ответа и назначьте им обработчики.\u003c/p>","expected":"Каждая кнопка передаёт свою надпись и правильный ответ «Синий».","expectedHtml":"Каждая кнопка передаёт свою надпись и правильный ответ «Синий».","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n}\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solutionFocusLine":19,"intro":false,"previewLabel":"Игра","explain":"\u003cp>На вкладке \u003ccode>index.html\u003c/code> у кнопок «Белый», «Синий» и «Чёрный» есть атрибут \u003ccode>data-answer\u003c/code>. В \u003ccode>script.js\u003c/code> сохраните список этих кнопок в \u003ccode>answerButtons\u003c/code> через \u003ccode>document.querySelectorAll(\"[data-answer]\")\u003c/code>.\u003c/p>\u003cp>Цикл \u003ccode>for…of\u003c/code> по очереди берёт каждую кнопку из списка. Для каждой \u003ccode>button\u003c/code> задайте \u003ccode>onclick\u003c/code>. Код внутри \u003ccode>function () { ... }\u003c/code> выполнится при нажатии на эту кнопку.\u003c/p>\u003cp>Вызовите \u003ccode>showResult(button.textContent, \"Синий\")\u003c/code> внутри обработчика. Первый аргумент берётся с нажатой кнопки. При выборе «Белый» получится \u003ccode>showResult(\"Белый\", \"Синий\")\u003c/code>, при выборе «Чёрный» — \u003ccode>showResult(\"Чёрный\", \"Синий\")\u003c/code>. Второй аргумент одинаковый, потому что на фото синий геймпад.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>const answerButtons = document.querySelectorAll(&quot;[data-answer]&quot;);\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, &quot;Синий&quot;);\n  };\n}\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Нажмите «Проверить». Интерактив по очереди нажмёт три кнопки и проверит пару строк в каждом вызове. Заголовок итога появится после заполнения \u003ccode>showResult\u003c/code> на следующем шаге.\u003c/p>","hints":[{"text":"Сохраните результат querySelectorAll в answerButtons и переберите его через for…of."},{"text":"В onclick вызовите showResult с текстом button.textContent и строкой «Синий»."}]},{"id":"v-kadre-parts-05","stage":5,"testKey":5,"kind":"learn","markup":3,"title":"Показываем выбор игрока","brief":"\u003cp>Из нажатой кнопки уже приходит её надпись. Покажем её в итоге раунда.\u003c/p>","task":"\u003cp>Внутри \u003ccode>showResult\u003c/code> заполните заголовок \u003ccode>#outcome\u003c/code> и откройте \u003ccode>result\u003c/code>.\u003c/p>","expected":"При клике на «Белый» видно «Вы выбрали: Белый».","expectedHtml":"При клике на «Белый» видно «Вы выбрали: Белый».","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  outcome.textContent = `Вы выбрали: ${answer}`;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  outcome.textContent = `Вы выбрали: ${answer}`;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solutionFocusLine":18,"intro":false,"previewLabel":"Игра","explain":"\u003cp>На вкладке \u003ccode>index.html\u003c/code> появился экран \u003ccode>result\u003c/code> с пустым заголовком \u003ccode>id=\"outcome\"\u003c/code>. Вставьте три строки в фигурные скобки уже объявленной \u003ccode>showResult\u003c/code>. Первая находит заголовок и сохраняет его в \u003ccode>outcome\u003c/code>.\u003c/p>\u003cp>Вторая меняет текст заголовка. В шаблонной строке запись \u003ccode>${answer}\u003c/code> подставляет значение первого параметра. Если игрок нажал «Белый», получим «Вы выбрали: Белый».\u003c/p>\u003cp>Третья строка вызывает \u003ccode>showScreen(\"result\")\u003c/code>. Сначала заполняем заголовок, потом показываем экран, на котором он находится.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>const outcome = document.querySelector(&quot;#outcome&quot;);\noutcome.textContent = `Вы выбрали: ${answer}`;\nshowScreen(&quot;result&quot;);\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Нажмите «Смотреть кадр», дождитесь вопроса и выберите «Белый». На экране должно быть «Вы выбрали: Белый».\u003c/p>","hints":[{"text":"Добавьте строки в фигурные скобки уже объявленной showResult."},{"text":"Сначала заполните заголовок #outcome, затем вызовите showScreen(\"result\")."}]},{"id":"v-kadre-parts-06","stage":6,"testKey":6,"kind":"learn","markup":3,"title":"Проверяем ответ","brief":"\u003cp>По выбору игрока и правильному ответу определим, угадал ли он цвет.\u003c/p>","task":"\u003cp>Замените надпись «Вы выбрали» в \u003ccode>showResult\u003c/code> на сравнение и \u003ccode>if…else\u003c/code>.\u003c/p>","expected":"«Синий» даёт «Верно!». Другие ответы дают «Не угадали».","expectedHtml":"«Синий» даёт «Верно!». Другие ответы дают «Не угадали».","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  outcome.textContent = `Вы выбрали: ${answer}`;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solutionFocusLine":19,"intro":false,"previewLabel":"Игра","explain":"\u003cp>Найдите внутри \u003ccode>showResult\u003c/code> строку, которая задаёт текст «Вы выбрали…». Вместо неё вставьте блок из примера. Он должен стоять между поиском заголовка \u003ccode>#outcome\u003c/code> и вызовом \u003ccode>showScreen(\"result\")\u003c/code>.\u003c/p>\u003cp>\u003ccode>answer === correctAnswer\u003c/code> сравнивает две строки. Для «Синий» и «Синий» в \u003ccode>correct\u003c/code> попадёт \u003ccode>true\u003c/code>. Для «Белый» и «Синий» получится \u003ccode>false\u003c/code>.\u003c/p>\u003cp>\u003ccode>if (correct)\u003c/code> показывает «Верно!», когда в \u003ccode>correct\u003c/code> лежит \u003ccode>true\u003c/code>. При \u003ccode>false\u003c/code> выполняется блок \u003ccode>else\u003c/code> и появляется «Не угадали». После любого из двух блоков \u003ccode>showScreen(\"result\")\u003c/code> открывает карточку.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>const correct = answer === correctAnswer;\nif (correct) {\n  outcome.textContent = &quot;Верно!&quot;;\n} else {\n  outcome.textContent = &quot;Не угадали&quot;;\n}\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Сыграйте раунд и выберите «Синий». Появится «Верно!». При нажатии «Проверить» интерактив проверит и «Синий», и «Белый».\u003c/p>","hints":[{"text":"Запишите итог сравнения в const correct."},{"text":"В if (correct) и в else меняйте текст одного и того же outcome."}]},{"id":"v-kadre-parts-07","stage":7,"testKey":7,"kind":"learn","markup":3,"title":"Подсвечиваем правильный ответ","brief":"\u003cp>Зелёный заголовок поможет сразу заметить верный ответ.\u003c/p>","task":"\u003cp>Перед показом \u003ccode>result\u003c/code> запишите \u003ccode>correct\u003c/code> в \u003ccode>result.dataset.correct\u003c/code>.\u003c/p>","expected":"Заголовок «Верно!» зелёный. «Не угадали» отображается обычным цветом.","expectedHtml":"Заголовок «Верно!» зелёный. «Не угадали» отображается обычным цветом.","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solutionFocusLine":25,"intro":false,"previewLabel":"Игра","explain":"\u003cp>Найдите всю итоговую секцию по \u003ccode>[data-screen=\"result\"]\u003c/code> и сохраните её в \u003ccode>result\u003c/code>. Добавьте две строки из примера внутри \u003ccode>showResult\u003c/code> перед \u003ccode>showScreen(\"result\")\u003c/code>.\u003c/p>\u003cp>Когда пишем \u003ccode>result.dataset.correct = correct\u003c/code>, JavaScript задаёт секции HTML-атрибут \u003ccode>data-correct\u003c/code>. Если сравнение дало \u003ccode>true\u003c/code>, получится \u003ccode>data-correct=\"true\"\u003c/code>. При ошибке запишется \u003ccode>data-correct=\"false\"\u003c/code>.\u003c/p>\u003cp>В готовом \u003ccode>style.css\u003c/code> правило \u003ccode>.result[data-correct=\"true\"] h2\u003c/code> окрашивает заголовок секции в зелёный цвет. Атрибут меняется при каждом ответе, поэтому цвет совпадает с текстом.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>const result = document.querySelector(&#x27;[data-screen=&quot;result&quot;]&#x27;);\nresult.dataset.correct = correct;\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Выберите «Синий» и посмотрите на зелёное «Верно!». Кнопка «Проверить» отдельно проверит, что при выборе «Белый» заголовок «Не угадали» отображается обычным цветом.\u003c/p>","hints":[{"text":"Сохраните экран результата в переменную result."},{"text":"Добавьте изменение dataset перед showScreen(\"result\")."}]},{"id":"v-kadre-parts-08","stage":8,"testKey":8,"kind":"learn","markup":4,"title":"Возвращаемся к началу раунда","brief":"\u003cp>После результата игроку нужна возможность попробовать ещё раз.\u003c/p>","task":"\u003cp>В конце файла подключите кнопку «Сыграть ещё» к экрану \u003ccode>ready\u003c/code>.\u003c/p>","expected":"«Сыграть ещё» возвращает кнопку «Смотреть кадр».","expectedHtml":"«Сыграть ещё» возвращает кнопку «Смотреть кадр».","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solutionFocusLine":37,"intro":false,"previewLabel":"Игра","explain":"\u003cp>На итоговом экране появилась кнопка «Сыграть ещё» с \u003ccode>id=\"next-round\"\u003c/code>. Ниже цикла с кнопками ответа добавьте для неё отдельный обработчик \u003ccode>onclick\u003c/code>.\u003c/p>\u003cp>При нажатии обработчик вызовет \u003ccode>showScreen(\"ready\")\u003c/code>. На экране снова появится «Смотреть кадр». Следующий клик по этой кнопке запустит \u003ccode>playRound\u003c/code> и новый таймер.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>document.querySelector(&quot;#next-round&quot;).onclick = function () {\n  showScreen(&quot;ready&quot;);\n};\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Дождитесь вопроса и выберите «Синий». Нажмите «Сыграть ещё», затем «Смотреть кадр». Во втором раунде выберите «Белый» и проверьте надпись «Не угадали».\u003c/p>","hints":[{"text":"Найдите кнопку #next-round."},{"text":"В её обработчике вызовите showScreen(\"ready\")."}]},{"id":"v-kadre-parts-09","stage":9,"testKey":9,"kind":"learn","markup":5,"title":"Показываем время рядом с фото","brief":"\u003cp>Игрок видит фотографию. Добавим рядом число секунд просмотра.\u003c/p>","task":"\u003cp>Задайте \u003ccode>seconds = 5\u003c/code>. Выведите цифру в \u003ccode>#seconds\u003c/code> и используйте \u003ccode>seconds\u003c/code> в таймере.\u003c/p>","expected":"На фото сразу видно 5. Через пять секунд открывается вопрос.","expectedHtml":"На фото сразу видно 5. Через пять секунд открывается вопрос.","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, 5000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  const seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, seconds * 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  const seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, seconds * 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solutionFocusLine":9,"intro":false,"previewLabel":"Игра","explain":"\u003cp>Сразу после \u003ccode>showScreen(\"photo\")\u003c/code> добавьте первые три строки. \u003ccode>seconds\u003c/code> хранит число секунд. \u003ccode>clock\u003c/code> указывает на элемент \u003ccode>#seconds\u003c/code> рядом с фото. Запись в \u003ccode>clock.textContent\u003c/code> ставит цифру 5 на экран.\u003c/p>\u003cp>Ниже уже есть \u003ccode>setTimeout\u003c/code>, который открывает вопрос. В его втором аргументе замените \u003ccode>5000\u003c/code> на \u003ccode>seconds * 1000\u003c/code>. Таймер принимает миллисекунды, поэтому при \u003ccode>seconds = 5\u003c/code> получается \u003ccode>5 * 1000 = 5000\u003c/code>.\u003c/p>\u003cp>Начальная цифра и длительность просмотра зависят от одной переменной. На следующем шаге сделаем так, чтобы эта цифра уменьшалась.\u003c/p>\u003ch3>Добавьте после показа фото\u003c/h3>\u003cpre>\u003ccode>const seconds = 5;\nconst clock = document.querySelector(&quot;#seconds&quot;);\nclock.textContent = seconds;\u003c/code>\u003c/pre>\u003ch3>Обновите второй аргумент у своего setTimeout\u003c/h3>\u003cpre>\u003ccode>setTimeout(function () {\n  showScreen(&quot;question&quot;);\n}, seconds * 1000);\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Нажмите «Смотреть кадр». Сразу появится цифра 5. Она будет видна на фото до перехода к вопросу через пять секунд.\u003c/p>","hints":[{"text":"Объявите const seconds = 5 и запишите seconds в clock.textContent сразу после открытия фото."},{"text":"Уже написанному setTimeout передайте seconds * 1000 вместо числа 5000."}]},{"id":"v-kadre-parts-10","stage":10,"testKey":10,"kind":"learn","markup":5,"title":"Обновляем цифру раз в секунду","brief":"\u003cp>Сейчас рядом с фото всё время стоит 5. Сделаем обратный отсчёт.\u003c/p>","task":"\u003cp>Поменяйте \u003ccode>const seconds\u003c/code> на \u003ccode>let seconds\u003c/code> и добавьте \u003ccode>setInterval\u003c/code> после \u003ccode>setTimeout\u003c/code>.\u003c/p>","expected":"После старта видна цифра 5, через секунду 4, ещё через секунду 3.","expectedHtml":"После старта видна цифра 5, через секунду 4, ещё через секунду 3.","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  const seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, seconds * 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, seconds * 1000);\n\n  setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, seconds * 1000);\n\n  setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solutionFocusLine":9,"intro":false,"previewLabel":"Игра","explain":"\u003cp>В \u003ccode>playRound\u003c/code> замените \u003ccode>const seconds = 5\u003c/code> на \u003ccode>let seconds = 5\u003c/code>. Дальше мы будем записывать в \u003ccode>seconds\u003c/code> новое число, поэтому нужна переменная через \u003ccode>let\u003c/code>.\u003c/p>\u003cp>Вставьте \u003ccode>setInterval\u003c/code> после закрывающей строки \u003ccode>}, seconds * 1000);\u003c/code> существующего \u003ccode>setTimeout\u003c/code>. Число \u003ccode>1000\u003c/code> у интервала задаёт одну секунду между вызовами.\u003c/p>\u003cp>\u003ccode>seconds -= 1\u003c/code> значит «возьми текущее число, отними один и сохрани обратно». Следующая строка выводит новое число. До первого запуска функции рядом с фото видно 5, через секунду станет 4, затем 3. Вопрос через пять секунд пока открывает старый \u003ccode>setTimeout\u003c/code>.\u003c/p>\u003ch3>Замените объявление числа секунд\u003c/h3>\u003cpre>\u003ccode>let seconds = 5;\u003c/code>\u003c/pre>\u003ch3>Добавьте после существующего setTimeout внутри playRound\u003c/h3>\u003cpre>\u003ccode>setInterval(function () {\n  seconds -= 1;\n  clock.textContent = seconds;\n}, 1000);\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Запустите один раунд. Увидите 5, затем 4 и 3. Через пять секунд появится вопрос. Остановку повторяющегося таймера добавим на шаге 12.\u003c/p>","hints":[{"text":"Смените const на let в строке с seconds."},{"text":"Внутри функции setInterval сначала отнимите единицу, затем обновите clock.textContent."}]},{"id":"v-kadre-parts-11","stage":11,"testKey":11,"kind":"learn","markup":5,"title":"Открываем вопрос на нуле","brief":"\u003cp>Открывать вопрос будет тот же таймер, который обновляет цифру.\u003c/p>","task":"\u003cp>Откройте вопрос в интервале при \u003ccode>seconds === 0\u003c/code>. Удалите вызов \u003ccode>setTimeout\u003c/code>.\u003c/p>","expected":"После цифры 1 проходит секунда и открывается вопрос.","expectedHtml":"После цифры 1 проходит секунда и открывается вопрос.","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n  setTimeout(function () {\n    showScreen(\"question\");\n  }, seconds * 1000);\n\n  setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solutionFocusLine":16,"intro":false,"previewLabel":"Игра","explain":"\u003cp>Внутри функции \u003ccode>setInterval\u003c/code> уже есть две строки, которые уменьшают \u003ccode>seconds\u003c/code> и пишут число в \u003ccode>#seconds\u003c/code>. Сразу после них добавьте условие \u003ccode>if (seconds === 0)\u003c/code>. В его фигурных скобках вызовите \u003ccode>showScreen(\"question\")\u003c/code>.\u003c/p>\u003cp>На первых вызовах значение равно 4, 3, 2 и 1. На пятом вызове оно станет 0, условие выполнится и фото сразу сменится вопросом.\u003c/p>\u003cp>Удалите весь прежний вызов \u003ccode>setTimeout\u003c/code>, от строки с его именем до строки \u003ccode>}, seconds * 1000);\u003c/code> включительно. Теперь переход зависит от числа в отсчёте.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>setInterval(function () {\n  seconds -= 1;\n  clock.textContent = seconds;\n  if (seconds === 0) {\n    showScreen(&quot;question&quot;);\n  }\n}, 1000);\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Сыграйте один раунд. Дождитесь цифры 1. Спустя секунду должен открыться вопрос.\u003c/p>","hints":[{"text":"Поставьте if (seconds === 0) сразу после clock.textContent = seconds внутри интервала."},{"text":"Внутри if откройте question. Затем уберите весь прежний вызов setTimeout."}]},{"id":"v-kadre-parts-12","stage":12,"testKey":12,"kind":"learn","markup":5,"title":"Останавливаем отсчёт на нуле","brief":"\u003cp>После вопроса старый таймер продолжает считать. Он мешает следующему раунду.\u003c/p>","task":"\u003cp>Сохраните результат \u003ccode>setInterval\u003c/code> в \u003ccode>timer\u003c/code>. Когда \u003ccode>seconds === 0\u003c/code>, вызовите \u003ccode>clearInterval(timer)\u003c/code>.\u003c/p>","expected":"При повторном старте видно 5, через секунду 4, затем 3.","expectedHtml":"При повторном старте видно 5, через секунду 4, затем 3.","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  const timer = setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      clearInterval(timer);\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  const timer = setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      clearInterval(timer);\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solutionFocusLine":12,"intro":false,"previewLabel":"Игра","explain":"\u003cp>На прошлом шаге при нуле открывался вопрос. Интервал продолжал работать и спустя секунду записывал −1 в \u003ccode>#seconds\u003c/code>, который в это время скрыт вместе с фото. При новом раунде старый и новый интервалы начинают писать числа в один элемент.\u003c/p>\u003cp>Добавьте \u003ccode>const timer =\u003c/code> перед вашим \u003ccode>setInterval\u003c/code>. В \u003ccode>timer\u003c/code> сохранится номер запущенного интервала, его идентификатор. В \u003ccode>seconds\u003c/code> хранится оставшееся время.\u003c/p>\u003cp>В уже написанном условии \u003ccode>seconds === 0\u003c/code> поставьте \u003ccode>clearInterval(timer)\u003c/code> перед \u003ccode>showScreen(\"question\")\u003c/code>. Браузер по номеру остановит будущие вызовы именно этого интервала. После этого выполнится показ вопроса.\u003c/p>\u003ch3>Так выглядит интервал после двух правок\u003c/h3>\u003cpre>\u003ccode>const timer = setInterval(function () {\n  seconds -= 1;\n  clock.textContent = seconds;\n  if (seconds === 0) {\n    clearInterval(timer);\n    showS
