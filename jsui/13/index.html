utton of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  const timer = setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      clearInterval(timer);\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  document.querySelector(\"#correct-answer\").textContent = `Ответ: ${correctAnswer}`;\n  const photo = document.querySelector(\"[data-photo]\");\n  document.querySelector(\"#review-image\").src = photo.src;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","commentedSolution":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  const timer = setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      clearInterval(timer);\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  document.querySelector(\"#correct-answer\").textContent = `Ответ: ${correctAnswer}`;\n  const photo = document.querySelector(\"[data-photo]\");\n  document.querySelector(\"#review-image\").src = photo.src;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solutionFocusLine":37,"intro":false,"previewLabel":"Игра","explain":"\u003cp>В карточке результата есть место для фото, изображение \u003ccode>#review-image\u003c/code>. Адрес возьмём у фотографии с геймпадом, которую игрок видел во время отсчёта.\u003c/p>\u003cp>У фото с геймпадом на вкладке \u003ccode>index.html\u003c/code> есть атрибут \u003ccode>data-photo\u003c/code>. Найдите фотографию через \u003ccode>document.querySelector(\"[data-photo]\")\u003c/code> и сохраните её в \u003ccode>photo\u003c/code>.\u003c/p>\u003cp>Внутри \u003ccode>showResult\u003c/code> перед \u003ccode>showScreen(\"result\")\u003c/code> передайте \u003ccode>photo.src\u003c/code> картинке \u003ccode>#review-image\u003c/code>. Свойство \u003ccode>src\u003c/code> задаёт адрес изображения. В результате игрок увидит тот же кадр, который был в начале раунда.\u003c/p>\u003ch3>Пример для игры\u003c/h3>\u003cpre>\u003ccode>const photo = document.querySelector(&quot;[data-photo]&quot;);\ndocument.querySelector(&quot;#review-image&quot;).src = photo.src;\u003c/code>\u003c/pre>\u003ch3>Как проверить\u003c/h3>\u003cp>Посмотрите на кадр и выберите любой ответ. Рядом с правильным ответом появится та же фотография с геймпадом.\u003c/p>","hints":[{"text":"Найдите фото с геймпадом через document.querySelector(\"[data-photo]\")."},{"text":"Запишите photo.src в свойство src картинки #review-image внутри showResult."}]},{"id":"v-kadre-timer-project-15","stage":15,"testKey":15,"kind":"assignment","markup":13,"title":"Самостоятельно. Меняем время просмотра","brief":"\u003cp>Игрок рассматривает фото с геймпадом. Измените время на просмотр.\u003c/p>","task":"\u003cp>На «4» установите 3 секунды. На «5» добавьте выбор 3 или 5 секунд.\u003c/p>","expected":"Отсчёт с 3 или 5. Затем открывается вопрос.","expectedHtml":"Отсчёт с 3 или 5. Затем открывается вопрос.","starter":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  const timer = setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      clearInterval(timer);\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  document.querySelector(\"#correct-answer\").textContent = `Ответ: ${correctAnswer}`;\n  const photo = document.querySelector(\"[data-photo]\");\n  document.querySelector(\"#review-image\").src = photo.src;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n","solution":"","commentedSolution":"","solutionFocusLine":1,"intro":false,"previewLabel":"Игра","hints":[],"explain":"\u003cp>Продолжайте в своём \u003ccode>script.js\u003c/code>. В \u003ccode>playRound\u003c/code> строка \u003ccode>let seconds = 5;\u003c/code> задаёт, сколько секунд игрок видит фото с геймпадом.\u003c/p>\u003ch3>На «4». Три секунды на фото\u003c/h3>\u003cp>Замените 5 на 3 в строке \u003ccode>let seconds = 5;\u003c/code>. Нажмите «Смотреть кадр». Вы увидите 3, 2 и 1, затем откроется вопрос.\u003c/p>\u003ch3>На «5». Выбор времени перед стартом\u003c/h3>\u003cp>В \u003ccode>index.html\u003c/code> в группе \u003ccode>#modes\u003c/code> уже есть варианты «3 секунды» и «5 секунд». В конце \u003ccode>script.js\u003c/code> найдите группу и задайте её свойству \u003ccode>hidden\u003c/code> значение \u003ccode>false\u003c/code>. Тогда игрок сможет выбрать время до нажатия «Смотреть кадр».\u003c/p>\u003cp>При каждом вызове \u003ccode>playRound\u003c/code> найдите выбранный вариант по селектору \u003ccode>input[name=\"duration\"]:checked\u003c/code>. Его свойство \u003ccode>value\u003c/code> вернёт строку \u003ccode>\"3\"\u003c/code> или \u003ccode>\"5\"\u003c/code>. Преобразуйте её через \u003ccode>Number()\u003c/code> и используйте результат как начальное значение \u003ccode>seconds\u003c/code> перед выводом цифры.\u003c/p>\u003ch3>Как проверить\u003c/h3>\u003cp>Выберите «3 секунды» и начните раунд. Ответьте, нажмите «Сыграть ещё», выберите «5 секунд» и повторите. Отсчёт должен начаться с выбранной цифры. После ответа снова видно фото с геймпадом.\u003c/p>"}]

lute;\n  inset: clamp(6px, 2.2vh, 15px) clamp(6px, 2.2vw, 15px) auto auto;\n  display: grid;\n  place-items: center;\n  min-width: clamp(38px, 10.2vh, 59px);\n  height: clamp(34px, 10vh, 51px);\n  border-radius: 10px;\n  padding: 0 .23em;\n  font-size: clamp(21px, 6.5vh, 34px);\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n  font-weight: 790;\n  color: var(--accent-text);\n  background: var(--accent);\n  box-shadow: 0 2px 12px #12181257;\n}\n.answers {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: clamp(5px, 1.8vw, 11px);\n}\n.answers button { min-width: 0; overflow-wrap: anywhere; }\n.result {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n}\n.result:has(.review:not([hidden])) {\n  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);\n}\n.result-copy { min-width: 0; }\n.result[data-correct=\"true\"] h2 { color: var(--accent); }\n.review {\n  display: grid;\n  min-width: 0;\n  min-height: 0;\n  align-self: stretch;\n  background: #141a19;\n}\n.review img { object-fit: cover; }\n.modes {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 5px;\n  border: 0;\n  padding: 0;\n}\n.modes label {\n  display: inline-flex;\n  align-items: center;\n  white-space: nowrap;\n  gap: 5px;\n  padding: 4px 8px;\n  border: 1px solid var(--line);\n  border-radius: 8px;\n  font-size: 13px;\n  cursor: pointer;\n}\n.modes input {\n  width: 13px;\n  height: 13px;\n  margin: 0;\n  accent-color: var(--accent);\n}\n.modes label:has(:checked) {\n  border-color: #b9d58a;\n  background: #3a4a37;\n}\n@media (max-height: 183px) {\n  :root { --control: 32px; --panel-inset: clamp(9px, 3vw, 17px); --block-gutter: 3px; }\n  h1, h2 { font-size: clamp(20px, 4.9vw, 24px); }\n  .ready, .question, .result-copy { gap: 5px; padding-block: 5px; }\n  .counter, .rule, #correct-answer, .modes label { font-size: 13px; }\n  button, .answers button { font-size: 14px; }\n  .modes label { padding-block: 3px; }\n}\n@media (max-height: 14 ml>\n"},"demo":{"html":"\u003c!doctype html>\n\u003chtml lang=\"ru\">\n  \u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    \u003ctitle>Что было в кадре?\u003c/title>\n    \u003clink rel=\"stylesheet\" href=\"style.css\">\n    \u003cscript src=\"script.js\" defer>\u003c/script>\n  \u003c/head>\n  \u003cbody>\n    \u003cmain class=\"game\">\n      \u003csection class=\"screen ready\" data-screen=\"ready\" aria-labelledby=\"game-title\">\n        \u003ch1 id=\"game-title\">Что было в кадре?\u003c/h1>\n        \u003cp class=\"rule\" id=\"round-rule\">Рассмотри фото за 5 секунд.\u003c/p>\n        \u003cbutton class=\"primary\" id=\"start-round\" type=\"button\">Смотреть кадр\u003c/button>\n      \u003c/section>\n\n      \u003csection class=\"screen photo\" data-screen=\"photo\" aria-label=\"Кадр для просмотра\" hidden>\n        \u003cimg src=\"assets/gamepad.webp\" data-photo=\"gamepad\" alt=\"Синий геймпад, наушники и кружка на столе\" width=\"1120\" height=\"630\">\n        \u003cspan id=\"seconds\" class=\"clock\" role=\"timer\" aria-label=\"Осталось секунд\">\u003c/span>\n      \u003c/section>\n\n      \u003csection class=\"screen question\" data-screen=\"question\" aria-labelledby=\"question\" hidden>\n        \u003ch2 id=\"question\" tabindex=\"-1\">Какого цвета был геймпад?\u003c/h2>\n        \u003cdiv class=\"answers\" id=\"answers\">\n          \u003cbutton type=\"button\" data-answer>Белый\u003c/button>\n          \u003cbutton type=\"button\" data-answer>Синий\u003c/button>\n          \u003cbutton type=\"button\" data-answer>Чёрный\u003c/button>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"screen result\" data-screen=\"result\" aria-labelledby=\"outcome\" hidden>\n        \u003cdiv class=\"result-copy\">\n          \u003ch2 id=\"outcome\" tabindex=\"-1\">\u003c/h2>\n          \u003cp id=\"correct-answer\">\u003c/p>\n          \u003cbutton class=\"primary\" id=\"next-round\" type=\"button\">Сыграть ещё\u003c/button>\n        \u003c/div>\n        \u003cfigure class=\"review\" id=\"review\">\n          \u003cimg id=\"review-image\" alt=\"\" width=\"1120\" height=\"630\">\n        \u003c/figure>\n      \u003c/section>\n    \u003c/main>\n  \u003c/body>\n\u003c/html>\n","css":":root {\n  color-scheme: dark;\n  font: 16px/1.38 system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --backdrop: #141a19;\n  --surface: #202a27;\n  --line: #41534b;\n  --text: #f6f6e9;\n  --muted: #bdccc4;\n  --accent: #d7f798;\n  --accent-text: #242d1b;\n  --block-gutter: clamp(3px, 2.1vh, 19px);\n  --inline-gutter: clamp(7px, 2.5vw, 24px);\n  --panel-inset: clamp(13px, 4.7vw, 32px);\n  --control: clamp(34px, 9vh, 48px);\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody {\n  min-height: 100vh;\n  min-height: 100dvh;\n  margin: 0;\n  display: grid;\n  place-items: center;\n  padding: var(--block-gutter) var(--inline-gutter);\n  color: var(--text);\n  background: var(--backdrop);\n}\n.game {\n  display: grid;\n  grid-template: minmax(0, 1fr) / minmax(0, 1fr);\n  width: min(100%, 740px);\n  height: min(calc(100dvh - 2 * var(--block-gutter)), 465px);\n  min-width: 0;\n  border: 1px solid var(--line);\n  border-radius: clamp(12px, 3.8vh, 22px);\n  background: var(--surface);\n  overflow: hidden;\n}\n.screen {\n  grid-area: 1 / 1;\n  min-width: 0;\n  min-height: 0;\n}\nh1, h2, p, figure, fieldset { margin: 0; }\nh1, h2 { font-weight: 760; line-height: 1.05; letter-spacing: -.039em; }\nh1 { font-size: clamp(25px, min(7.4vw, 13vh), 54px); }\nh2 { font-size: clamp(23px, min(6.2vw, 10vh), 40px); }\nbutton {\n  min-width: 0;\n  min-height: var(--control);\n  border: 1px solid var(--line);\n  border-radius: 9px;\n  padding: 5px clamp(7px, 2vw, 15px);\n  font: inherit;\n  text-align: center;\n  font-weight: 650;\n  line-height: 1.15;\n  color: var(--text);\n  background: #2d3a34;\n  cursor: pointer;\n}\nbutton:hover:not(:disabled) { background: #394c42; }\nbutton:disabled { cursor: default; opacity: .68; }\nbutton:focus-visible, label:has(input:focus-visible) {\n  outline: 2px solid #f9f5e4;\n  outline-offset: 2px;\n}\nh2:focus { outline: none; }\n.primary {\n  justify-self: start;\n  border-color: transparent;\n  color: var(--accent-text);\n  background: var(--accent);\n}\n.primary:hover:not(:disabled) { background: #e7ffb9; }\n.ready, .question, .result-copy {\n  display: grid;\n  align-content: center;\n  gap: clamp(6px, 2.8vh, 16px);\n  padding: clamp(6px, 3vh, 20px) var(--panel-inset);\n}\n.ready, .question {\n  background:\n    radial-gradient(ellipse at 100% -12%, #4c6146a3 0%, transparent 65%),\n    var(--surface);\n}\n.counter {\n  color: #d4e2c7;\n  font-size: clamp(12px, 3.8vw, 14px);\n  font-weight: 680;\n}\n.rule, #correct-answer {\n  color: var(--muted);\n  font-size: clamp(14px, 3.9vw, 18px);\n}\n.photo {\n  position: relative;\n  display: grid;\n  place-items: center;\n  background: #0d100e;\n}\n.photo img, .review img {\n  width: 100%;\n  height: 100%;\n  min-height: 0;\n  min-width: 0;\n  display: block;\n  object-fit: contain;\n}\n.clock {\n  position: absolute;\n  inset: clamp(6px, 2.2vh, 15px) clamp(6px, 2.2vw, 15px) auto auto;\n  display: grid;\n  place-items: center;\n  min-width: clamp(38px, 10.2vh, 59px);\n  height: clamp(34px, 10vh, 51px);\n  border-radius: 10px;\n  padding: 0 .23em;\n  font-size: clamp(21px, 6.5vh, 34px);\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n  font-weight: 790;\n  color: var(--accent-text);\n  background: var(--accent);\n  box-shadow: 0 2px 12px #12181257;\n}\n.answers {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: clamp(5px, 1.8vw, 11px);\n}\n.answers button { min-width: 0; overflow-wrap: anywhere; }\n.result {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n}\n.result:has(.review:not([hidden])) {\n  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);\n}\n.result-copy { min-width: 0; }\n.result[data-correct=\"true\"] h2 { color: var(--accent); }\n.review {\n  display: grid;\n  min-width: 0;\n  min-height: 0;\n  align-self: stretch;\n  background: #141a19;\n}\n.review img { object-fit: cover; }\n.modes {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 5px;\n  border: 0;\n  padding: 0;\n}\n.modes label {\n  display: inline-flex;\n  align-items: center;\n  white-space: nowrap;\n  gap: 5px;\n  padding: 4px 8px;\n  border: 1px solid var(--line);\n  border-radius: 8px;\n  font-size: 13px;\n  cursor: pointer;\n}\n.modes input {\n  width: 13px;\n  height: 13px;\n  margin: 0;\n  accent-color: var(--accent);\n}\n.modes label:has(:checked) {\n  border-color: #b9d58a;\n  background: #3a4a37;\n}\n@media (max-height: 183px) {\n  :root { --control: 32px; --panel-inset: clamp(9px, 3vw, 17px); --block-gutter: 3px; }\n  h1, h2 { font-size: clamp(20px, 4.9vw, 24px); }\n  .ready, .question, .result-copy { gap: 5px; padding-block: 5px; }\n  .counter, .rule, #correct-answer, .modes label { font-size: 13px; }\n  button, .answers button { font-size: 14px; }\n  .modes label { padding-block: 3px; }\n}\n@media (max-height: 148px) {\n  .ready:has(.modes:not([hidden])) { gap: 4px; }\n  .ready:has(.modes:not([hidden])) .rule { display: none; }\n  .result-copy { gap: 5px; }\n}\n\n.clock:empty { display: none; }\n","js":"function showScreen(name) {\n  for (const screen of document.querySelectorAll(\"[data-screen]\")) {\n    screen.hidden = screen.dataset.screen !== name;\n  }\n}\n\nfunction playRound() {\n  showScreen(\"photo\");\n  let seconds = 5;\n  const clock = document.querySelector(\"#seconds\");\n  clock.textContent = seconds;\n\n  const timer = setInterval(function () {\n    seconds -= 1;\n    clock.textContent = seconds;\n    if (seconds === 0) {\n      clearInterval(timer);\n      showScreen(\"question\");\n    }\n  }, 1000);\n}\n\nconst startButton = document.querySelector(\"#start-round\");\nstartButton.onclick = playRound;\n\nfunction showResult(answer, correctAnswer) {\n  const outcome = document.querySelector(\"#outcome\");\n  const correct = answer === correctAnswer;\n  if (correct) {\n    outcome.textContent = \"Верно!\";\n  } else {\n    outcome.textContent = \"Не угадали\";\n  }\n  const result = document.querySelector('[data-screen=\"result\"]');\n  result.dataset.correct = correct;\n  document.querySelector(\"#correct-answer\").textContent = `Ответ: ${correctAnswer}`;\n  const photo = document.querySelector(\"[data-photo]\");\n  document.querySelector(\"#review-image\").src = photo.src;\n  showScreen(\"result\");\n}\n\nconst answerButtons = document.querySelectorAll(\"[data-answer]\");\nfor (const button of answerButtons) {\n  button.onclick = function () {\n    showResult(button.textContent, \"Синий\");\n  };\n}\n\ndocument.querySelector(\"#next-round\").onclick = function () {\n  showScreen(\"ready\");\n};\n"}}
</script>

  const logs = [];
  const errors = [];

  const send = (type, data) => parent.postMessage({

  }, "*");

    const item = { name: error?.name || "Ошибка", message: error?.message || String(error) };
    errors.push(item);
    send("error", item);
  };

  for (const method of ["log", "warn", "error", "info"]) {
    const original = console[method];
    console[method] = (...values) => {
      const message = values.map(value =>
        Object.prototype.toString.call(value) === "[object Promise]" ? "Promise" : String(value)

    if (typeof callback !== "function")
      throw new TypeError("Передайте таймеру функцию. Вызов со скобками произойдёт сразу.");
    const ms = Math.max(1, Number(delay) || 0);

function learningStructure(step, source) {
  let tree;
  try {
    tree = acorn.parse(source, { ecmaVersion: "latest", sourceType: "script" });
  } catch (error) {
    return { error: friendlyError(error) };
  }

  function has(node, predicate) {
    if (!node || typeof node !== "object") return false;
    if (Array.isArray(node)) return node.some(child => has(child, predicate));
    return predicate(node) || Object.values(node).some(child => has(child, predicate));
  }

  function named(name) {
    for (const node of tree.body) {
      if (node.type === "FunctionDeclaration" && node.id?.name === name) return node;
      if (node.type === "VariableDeclaration") {
        const declaration = node.declarations.find(item => item.id.name === name);
        if (declaration?.init && ["ArrowFunctionExpression", "FunctionExpression"].includes(declaration.init.type)) {
          return declaration.init;
        }
      }
    }
  }

  function calls(node, name) {
    return node?.type === "CallExpression" &&
      (node.callee.name === name ||
        (node.callee.object?.name === "window" && node.callee.property?.name === name));
  }

  const stage = step.testKey;
  const round = named("playRound");
  if (stage === 2 && !has(round, node => calls(node, "setTimeout"))) {
    return { error: "Назначьте открытие вопроса через setTimeout внутри playRound." };
  }
  if (stage === 3 || stage === 4) {
    const result = named("showResult");
    if (result?.body.type !== "BlockStatement" || result.params.length !== 2 ||
        result.params.some(param => param.type !== "Identifier")) {
      return { error: "Объявите showResult с двумя параметрами, answer и correctAnswer." };
    }
    if (result.body.body.length !== 0) {
      return { error: "Оставьте тело showResult пустым. Заполните его на следующем шаге после подключения кнопок." };
    }
    if (stage === 4) {
      const [answer, correct] = result.params;
      // Capture arguments only in the checking frame. Keep the editor and visible game untouched.
      const trace = `\nwindow.document.documentElement.dataset.lessonAnswer = window.JSON.stringify([${answer.name}, ${correct.name}]);\n`;
      const insertion = result.body.start + 1;
      return { source: source.slice(0, insertion) + trace + source.slice(insertion) };
    }
  }
  if (stage === 10 && !has(round, node => calls(node, "setInterval"))) {
    return { error: "Добавьте setInterval после существующего setTimeout внутри playRound." };
  }
  if (stage === 10 && !has(round, node => calls(node, "setTimeout"))) {
    return { error: "Оставьте переход к вопросу в setTimeout. Пока интервал только меняет цифру." };
  }
  if (stage === 11 && has(round, node => calls(node, "setTimeout"))) {
    return { error: "Когда переход выполняется внутри setInterval, удалите прежний setTimeout." };
  }
  if (stage === 12 && !has(round, node => calls(node, "clearInterval"))) {
    return { error: "Остановите интервал через clearInterval в условии нуля." };
  }
  return { source };
}

  const at = (run, name) => run.timeline.find(frame => frame.label === name) || {};
  const last = run => run.timeline.at(-1) || {};
  const start = click("#start-round");
  const again = click("#next-round");
  const answer = number => click("#answers button:nth-child(" + number + ")");
  const first = "Какого цвета был геймпад?";
  const opening = [start, snap("photo"), advance(4999), snap("before"), advance(1), snap("question")];
  const photo = (frame, name = "gamepad") => frame.screen === "photo" && frame.photo === name;
  const question = (frame, text = first) =>
    frame.screen === "question" && frame.question === text && !frame.photo;
  const outcome = (frame, correct) =>
    frame.screen === "result" && frame.outcome === (correct ? "Верно!" : "Не угадали");
  const hasOrder = (run, name = "gamepad", prompt = first) =>
    photo(at(run, "photo"), name) && photo(at(run, "before"), name) && question(at(run, "question"), prompt);

  function test(label, ops, ok, why) {
    return { label, ops, ok, why };
  }

  const right = test("Верный ответ", [...opening, answer(2)],
    run => hasOrder(run) && outcome(last(run), true),
    "Клик по «Синий» должен открыть результат «Верно!».");
  const wrong = test("Неверный ответ", [...opening, answer(1)],
    run => hasOrder(run) && outcome(last(run), false),
    "При другом варианте откройте результат «Не угадали».");

  if (stage === 1) return [test("Кнопка открывает фото", [start],
    run => at(run, "initial").screen === "ready" && photo(last(run)),
    "Вызовите showScreen с именем photo внутри playRound.")];

  if (stage === 2) return [test("Фото сменяется вопросом через пять секунд", opening,
    run => hasOrder(run), "Передайте показ вопроса в setTimeout и укажите 5000 мс.")];

  if (stage === 3) return [test("Функция объявлена, раунд открывает вопрос", opening,
    run => hasOrder(run), "Оставьте таймер показа вопроса и добавьте объявление showResult в конец файла.")];

  if (stage === 4) return [test("Все три кнопки передают свои ответы",
    [...opening, answer(1), snap("white"), answer(2), snap("blue"), answer(3), snap("black")],
    run => hasOrder(run) && !at(run, "question").answerArgs &&
      [["white", "Белый"], ["blue", "Синий"], ["black", "Чёрный"]].every(([name, option]) =>
        question(at(run, name)) && at(run, name).answerArgs === JSON.stringify([option, "Синий"])),
    "В обработчике каждой кнопки вызовите showResult(button.textContent, \"Синий\").")];

  if (stage === 5) return [["Белый", 1], ["Синий", 2]].map(([option, number]) =>
    test("На экране видно, что выбрали", [...opening, answer(number)],
      run => hasOrder(run) && last(run).screen === "result" &&
        [option, "Вы выбрали: " + option].includes(last(run).outcome),
      "В showResult запишите выбранный ответ в #outcome и откройте result."));

  if (stage === 6) return [right, wrong];

  if (stage === 7) return [
    test("Верный ответ подсвечен", right.ops,
      run => right.ok(run) && last(run).correct,
      "В showResult установите data-correct у экрана результата, чтобы CSS подсветил «Верно!»." ),
    test("Ошибочный ответ сохраняет обычный цвет", wrong.ops,
      run => wrong.ok(run) && !last(run).correct,
      "Записывайте результат сравнения в dataset.correct для каждого ответа."),
  ];

  if (stage === 8) return [test("Можно сыграть ещё раз",
    [...opening, answer(2), snap("firstResult"), again, snap("readyAgain"),
      start, snap("photoAgain"), advance(5000), answer(1)],
    run => hasOrder(run) && outcome(at(run, "firstResult"), true) &&
      at(run, "firstResult").correct && at(run, "readyAgain").screen === "ready" &&
      photo(at(run, "photoAgain")) && outcome(last(run), false) && !last(run).correct,
    "Назначьте кнопке «Сыграть ещё» обработчик, который открывает ready.")];

  if (stage === 9) return [test("Стартовое время видно на фото", opening,
    run => hasOrder(run) && at(run, "photo").clock === 5,
    "Покажите пять секунд рядом с фотографией через clock.textContent.")];

  const ticking = [start, snap("photo"), advance(1000), snap("firstTick"), advance(3999),
    snap("before"), advance(1), snap("question")];
  function tickSequence(run) {
    return hasOrder(run) && at(run, "photo").clock === 5 && at(run, "firstTick").clock === 4 &&
      at(run, "before").clock === 1;
  }

  if (stage === 10) return [test("Цифра убывает раз в секунду", ticking,
    run => tickSequence(run) && at(run, "photo").intervals === 1,
    "Уменьшайте seconds и меняйте подпись при каждом вызове функции setInterval.")];

  if (stage === 11) return [test("Интервал открывает вопрос на нуле", ticking,
    run => tickSequence(run),
    "Вызывайте showScreen(\"question\") внутри интервала, когда seconds станет равным нулю.")];

  if (stage === 12) return [test("Старый интервал не меняет цифру нового",
    [...ticking, answer(2), again, advance(300), start, advance(700), snap("beforeSecondTick"), advance(300)],
    run => tickSequence(run) && at(run, "question").intervals === 0 &&
      at(run, "beforeSecondTick").clock === 5 && last(run).clock === 4 && last(run).intervals === 1,
    "Сохраните идентификатор и остановите интервал внутри условия seconds === 0.")];

  if (stage === 13) return [test("В итоге указан верный ответ",
    [...ticking, answer(1)],
    run => tickSequence(run) && outcome(last(run), false) && last(run).caption === "Ответ: Синий",
    "Покажите в #correct-answer правильный ответ из второго параметра showResult.")];

  if (stage === 14) return [test("Кадр и подпись видны на результате",
    [...ticking, advance(1000), snap("waiting"), answer(1)],
    run => tickSequence(run) && question(at(run, "waiting")) &&
      at(run, "waiting").intervals === 0 && !at(run, "waiting").reviewPhoto &&
      outcome(last(run), false) && last(run).reviewPhoto === "gamepad" && last(run).caption === "Ответ: Синий",
    "Покажите фото и правильный ответ после клика игрока, внутри showResult.")];

  return [];
}


        async function check() {
          if (current().kind === "assignment") return;
          if (checking || finished) return;
          if (demoOpen) {
            closeDemo();
            runPreview();
          }
          persistEditor();
          save();
          const s = current(),
            entry = attempt(),
            myEpoch = epoch;
          const sourceFiles = getFiles();
          const structure = learningStructure(s, sourceFiles.js);
          if (structure.error) { feedback(structure.error, "bad"); return; }
          const testFiles = { ...sourceFiles, js: structure.source };
          checking = true;
          $("#checkBtn").disabled = true;
          if (previewDirty) runPreview();
          try {
            const cases = testCases(s.id),
              results = [];
            if (!cases.length) throw new Error("Не найдена проверка задания.");
            for (let i = 0; i < cases.length; i++) {
              if (myEpoch !== epoch) return;
              feedback(
                `Проверяем ситуацию ${i + 1} из ${cases.length}: ${cases[i].label}`,
              );
              const r = await runFrame(testFiles, cases[i]);
              if (myEpoch !== epoch) return;
              if (r.cancelled) return;
              if (r.timeout) {
                results.push({
                  label: cases[i].label,
                  ok: false,
                  message:
                    "Проверка не получила ответ. Проверьте код на ошибки и бесконечные циклы.",
                });
                break;
              }
              if (r.errors?.length) {
                results.push({
                  label: cases[i].label,
                  ok: false,
                  message: friendlyError(r.errors[0]),
                });
                break;
              }
              let ok = false;
              try { ok = !!cases[i].ok(r); } catch {}
              results.push({
                label: cases[i].label,
                ok,
                message: ok ? "" : (typeof cases[i].why === "function" ? cases[i].why(r) : cases[i].why),
              });
            }
            if (myEpoch !== epoch) return;
            entry.checks = results;
            entry.passed =
              results.length === cases.length && results.every((x) => x.ok);
            entry.updated = new Date().toISOString();
            if (entry.passed) entry.verifiedJs=entry.js;
            if (entry.passed)
              db.unlocked = Math.max(
                db.unlocked,
                Math.min(steps.length - 1, db.index + 1),
                firstUnfinishedStep(),
              );
            save();
            progress();
            const failed = results.find((x) => !x.ok);
            feedback(
              entry.passed
                ? (s.kind === "reinforce" ? "Получилось. Можно продолжать." : "Работает. Можно продолжать.")
                : `${failed?.label || "Проверка"}: ${failed?.message || "Сравните код с условием."}`,
              entry.passed ? "good" : "bad",
            );
          } finally {
            if (myEpoch === epoch) {
              checking = false;
              $("#checkBtn").disabled = false;
            }
          }
        }

        function openDialog(title, html) {
          $("#dialogTitle").textContent = title;
          $("#dialogContent").innerHTML = html;
          highlightLessonCode($("#dialogContent"));
          bindLessonDownloads($("#dialogContent"));
          if (!$("#infoDialog").open) $("#infoDialog").showModal();
          $("#infoDialog").scrollTop = 0;
        }
        function focusSolutionLine() {
          const line = current().solutionFocusLine;
          requestAnimationFrame(() => {
            if (finished || !attempt().solutionShown || selectedFile !== "js") return;
            if (editorInstance) {
              editorInstance.setPosition({ lineNumber: line, column: 1 });
              editorInstance.revealLineInCenter(line);
              editorInstance.focus();
            } else {
              const editor = $("#editor");
              const offset = editor.value.split("\n").slice(0, line - 1).join("\n").length + (line > 1 ? 1 : 0);
              editor.setSelectionRange(offset, offset);
              editor.scrollTop = Math.max(0, (line - 4) * 22);
              editor.focus();
              paint();
            }
          });
        }

        function switchSolution() {
          if (current().kind === "assignment") return;
          persistEditor();
          clearTimeout(autoTimer);
          epoch++;
          cancelJobs();
          checking = false;
          const entry = attempt();
          if (entry.solutionShown && entry.solutionDraft) {
            db.entries[current().id] = entry.solutionDraft;
          } else {
            entry.solutionDraft = clone(entry);
            entry.js = current().commentedSolution;
            entry.solutionShown = true;
            entry.passed = false;
            delete entry.grade;
            entry.checks = [];
            delete entry.verifiedJs;
            entry.updated = new Date().toISOString();
          }
          render();
          if (attempt().solutionShown) focusSolutionLine();
        }

        function showHint() {
          if (current().kind === "assignment") return;
          if (attempt().solutionShown || hintLevel === 2) {
            switchSolution();
            return;
          }
          hintLevel++;
          const hint = current().hints[hintLevel - 1];
          $("#hint").hidden = false;
          $("#hintBtn").setAttribute("aria-expanded", "true");
          $("#hint").innerHTML = "<p>" + esc(hint.text) + "</p>";
          $("#hintBtn").textContent = hintLevel === 1 ? "Ещё подсказка" : "Показать решение";
        }

        function showExplanation() {
          openDialog(current().title, current().explain);
        }
        function go(index) {
          const target = Math.max(0, Math.min(steps.length - 1, index));
          if (target > db.unlocked) return;
          persistEditor();
          clearTimeout(autoTimer);
          epoch++;
          cancelJobs();
          checking = false;
          $("#checkBtn").disabled = false;
          db.index = target;
          db.finished = false;
          render();
        }

        function showSteps() {
          const html='<div class="step-list">'+steps.map((step,index)=>{
            const passed=step.kind !== "assignment" && !!db.entries[step.id]?.passed;
            const locked=index>db.unlocked;
            return '<button class="step-link '+(passed?'passed':'pending')+(!finished && index===db.index?' current':'')+'" data-step="'+index+'" '+(locked?'disabled':'')+'><span class="step-num">'+(index+1)+'</span><span class="step-name">'+esc(step.title)+'</span><span class="step-done">'+(locked?'Позже':step.kind === 'assignment'?'Самостоятельная работа':passed?'Выполнено':'Можно открыть')+'</span></button>';
          }).join('')+'</div>';
          openDialog("Шаги",html);
          $$("[data-step]:not([disabled])").forEach(button=>button.onclick=()=>{$("#infoDialog").close();go(Number(button.dataset.step));});
        }

        function showMemo() { openDialog("Памятка по асинхронности", MEMO_TEXT); }


        function setConsoleOpen(open) {
          $("#console").hidden = !open;
          $("#consoleBtn").setAttribute("aria-expanded", String(open));
        }

        const lessonDownloadUrls = new Map();
        function bindLessonDownloads(root) {
          root.querySelectorAll("[data-lesson-asset]").forEach(a=>{
            const name=a.dataset.lessonAsset;
            if(!lessonDownloadUrls.has(name) && assets[name]) {
              const [head,encoded]=assets[name].split(",");
              const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
              const type=head.slice(5).split(";")[0];
              lessonDownloadUrls.set(name,URL.createObjectURL(new Blob([bytes],{type})));
            }
            a.href=lessonDownloadUrls.get(name) || "#";
          });
        }
        window.addEventListener("pagehide",()=>lessonDownloadUrls.forEach(url=>URL.revokeObjectURL(url)));
        function render() {
          closeDemo();
          $("#experimentBtn").hidden = !current().demo;
          $("#experimentBtn").textContent = "Готовая игра";
          finished = false;
          db.finished = false;
          hintLevel = attempt().solutionShown ? 3 : 0;
          selectedFile = "js";
          previewDirty = false;
          $(".intro").hidden = false;
          $(".workgrid").hidden = false;
          $("#finish").hidden = true;
          $("#checkBtn").disabled = false;
          $("#headline").textContent = current().title;
          $("#brief").innerHTML = current().brief;
          $("#taskText").innerHTML = current().task;
          bindLessonDownloads(document);
          $("#explainBtn").textContent = current().kind === "assignment" ? "Условие задания" : "Объяснение и пример";
          highlightLessonCode($("#brief"));
          highlightLessonCode($("#taskText"));
          $("#expected").innerHTML = current().expectedHtml || esc(current().expected);
          highlightLessonCode($("#expected"));
          $("#previewLabel").textContent = current().previewLabel;
          const independent = current().kind === "assignment";
          $("#hintBtn").hidden = independent;
          $("#checkBtn").hidden = independent;
          $(".actions").hidden = independent;
          $("#feedback").hidden = independent;
          $("#hint").hidden = true;
          $("#hintBtn").textContent = attempt().solutionShown ? "Вернуть мой код" : "Подсказка";
          $("#hintBtn").setAttribute("aria-expanded", "false");
          setConsoleOpen(Boolean(current().intro));
          feedback(
            attempt().passed
              ? "Работает. Можно продолжать."
              : "",
            attempt().passed ? "good" : "",
          );
          makeEditor();
          progress();
          save();
          runPreview();
          if (current().kind === "assignment" && !attempt().taskOpened) {
            attempt().taskOpened = true;
            save();
            showExplanation();
          }
        }
function finish() {
  if (db.index !== steps.length - 1 || db.index > db.unlocked) return;
  persistEditor(); clearTimeout(autoTimer); epoch++; cancelJobs();
  checking = false; finished = true; db.finished = true; save(); disposeEditor();
  if ($("#infoDialog").open) $("#infoDialog").close();
  $(".intro").hidden = true; $(".workgrid").hidden = true; $("#finish").hidden = false;
  $("#finish").innerHTML = "\u003ch2>Чему научились\u003c/h2>\u003cdiv class=\"skills\">\u003carticle class=\"skill\">\u003ccode>setTimeout\u003c/code>\u003cp>Открывать вопрос один раз после задержки.\u003c/p>\u003c/article>\u003carticle class=\"skill\">\u003ccode>setInterval\u003c/code>\u003cp>Уменьшать число секунд и обновлять отсчёт рядом с фото.\u003c/p>\u003c/article>\u003carticle class=\"skill\">\u003ccode>clearInterval\u003c/code>\u003cp>Останавливать интервал по идентификатору, когда отсчёт дошёл до нуля.\u003c/p>\u003c/article>\u003carticle class=\"skill\">\u003ccode>onclick\u003c/code>\u003cp>Начинать раунд и проверять ответ при нажатии нужной кнопки.\u003c/p>\u003c/article>\u003c/div>\u003ch3>Вопросы для закрепления\u003c/h3>\u003cdetails class=\"review-question\">\u003csummary>Что происходит сразу после нажатия «Смотреть кадр»?\u003c/summary>\u003cp>Игра показывает фото и начальное значение \u003ccode>seconds\u003c/code>. Первая смена цифры происходит через секунду, когда браузер вызывает функцию интервала.\u003c/p>\u003c/details>\u003cdetails class=\"review-question\">\u003csummary>Почему в первом варианте игры передаём в \u003ccode>setTimeout\u003c/code> функцию с показом вопроса?\u003c/summary>\u003cp>Эту функцию браузер вызовет через пять секунд. Если написать \u003ccode>showScreen(\"question\")\u003c/code> отдельной строкой сразу после открытия фото, вопрос появится сразу.\u003c/p>\u003c/details>\u003cdetails class=\"review-question\">\u003csummary>Почему у \u003ccode>setInterval\u003c/code> указано 1000, хотя на просмотр даётся 5 секунд?\u003c/summary>\u003cp>1000 мс — время между вызовами. На каждом вызове отнимается одна секунда. При старте с 5 понадобится пять вызовов.\u003c/p>\u003c/details>\u003cdetails class=\"review-question\">\u003csummary>Что может случиться при повторном раунде без \u003ccode>clearInterval(timer)\u003c/code>?\u003c/summary>\u003cp>Первый интервал продолжит обновлять цифру после нуля. Когда начнётся следующий раунд, два интервала будут записывать числа в одно и то же поле.\u003c/p>\u003c/details>\u003cdetails class=\"review-question\">\u003csummary>Где меняется длительность просмотра для режима на 3 секунды?\u003c/summary>\u003cp>В начале \u003ccode>playRound\u003c/code> начальное значение \u003ccode>seconds\u003c/code> становится равным 3. Функция интервала по-прежнему выполняется каждые 1000 мс.\u003c/p>\u003c/details>";
  highlightLessonCode($("#finish"));
  $("#finish").scrollTop = 0;
  progress();
}

        function askReset(all = false) {
          openDialog(
            all
              ? "Сбросить прогресс занятия?"
              : "Сбросить текущий шаг?",
            `<p>${all ? "Будут удалены код и результаты всех шагов этого интерактива. Прогресс других занятий сохранится." : "Изменится только текущее задание. Остальные попытки и результаты сохранятся."}</p><div class="result-actions"><button class="btn danger" id="confirmReset">${all ? "Сбросить всё занятие" : "Сбросить шаг"}</button><button class="btn" id="cancelReset">Отмена</button></div>`,
          );
          $("#cancelReset").onclick = () => $("#infoDialog").close();
          $("#confirmReset").onclick = () => {
            clearTimeout(autoTimer);
            clearTimeout(saveTimer);
            epoch++;
            cancelJobs();
            checking = false;
            disposeEditor();
            $("#infoDialog").close();
            if (all) {
              try {
                localStorage.removeItem(STORAGE_KEY);
              } catch {}
              db = fresh();
            } else
              db.entries[current().id] = {
                js: starterCode(current()),
                passed: false,
                checks: [],
                updated: null,
              };
            save();
            render();
          };
        }

        $("#experimentBtn").onclick = () => {
          if (!current().demo || finished) return;
          demoOpen = !demoOpen;
          $("#experimentBtn").textContent = demoOpen ? "К заданию" : "Готовая игра";
          runPreview();
        };
        $("#checkBtn").onclick = check;
        $("#hintBtn").onclick = showHint;
        $("#explainBtn").onclick = showExplanation;
        $("#memoBtn").onclick = showMemo;
        $("#stepsBtn").onclick = showSteps;
        $("#closeDialog").onclick = () => $("#infoDialog").close();
        $("#consoleBtn").onclick = () => setConsoleOpen($("#console").hidden);
        const infoDialog = $("#infoDialog");
        let dialogPressOnBackdrop = false;
        function isDialogBackdrop(event) {
          const bounds = infoDialog.getBoundingClientRect();
          return (
            event.target === infoDialog &&
            (event.clientX < bounds.left ||
              event.clientX >= bounds.right ||
              event.clientY < bounds.top ||
              event.clientY >= bounds.bottom)
          );
        }
        infoDialog.addEventListener("pointerdown", (event) => {
          dialogPressOnBackdrop = event.button === 0 && isDialogBackdrop(event);
        });
        infoDialog.addEventListener("click", (event) => {
          const close = dialogPressOnBackdrop && isDialogBackdrop(event);
          dialogPressOnBackdrop = false;
          if (close) infoDialog.close();
        });
        infoDialog.addEventListener("pointercancel", () => {
          dialogPressOnBackdrop = false;
        });
        infoDialog.addEventListener("close", () => {
          dialogPressOnBackdrop = false;
        });
        $$(".filetab").forEach(
          (b) =>
            (b.onclick = () => {
              persistEditor();
              selectedFile = b.dataset.file;
              makeEditor();
            }),
        );
        $("#prev").onclick = () => {
          if (finished) {
            go(db.index);
            return;
          }
          go(db.index - 1);
        };
        $("#next").onclick = () => {
          if (current().kind !== "assignment" && !attempt().passed) return;
          if (db.index === steps.length - 1) finish();
          else go(db.index + 1);
        };
        $("#resetStep").onclick = () => askReset(false);
        $("#resetProgress").onclick = () => askReset(true);
        window.addEventListener("beforeunload", () => {
          persistEditor();
          save();
        });
        window.addEventListener("resize", () => {
          if (monacoApi && !editorInstance && !finished && innerWidth > 760)
            mountMonaco();
          else if (!monacoApi) loadMonaco();
        });
        const restoreFinish = db.finished;
        render();
        if (restoreFinish) finish();
        loadMonaco();
      })();
    


</script>
